itle": "布料很好！ ️", "title_orig": "生地はいい‼️", "content": "我买了一张queen size的床，所以首先买了这个物超所值、四季皆可使用的产品。我用在两张半单人床单并排的床垫上，但尺寸稍显不足💦面料很放松，给我安全感😌\n", "content_orig": "クイーンサイズのベットを購入したので、まずはオールシーズン使えるコスパのいいこの商品を購入。セミシングルを2つ並べたマットレスに使用しましたが微妙にサイズが足りませんでした💦生地はリラックス出来る生地で安心感があります😌\n", "model": "", "star": 3, "reviewer": "佐藤芽", "date": "2024-05-25", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R226RAKE2KX1VK/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["具有性价比"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["物有所值"]}, {"asin": "B0BRPNYYR8", "title": "光滑且干燥快", "title_orig": "サラッとしてるし、すぐ乾く", "content": "绒头是棉的，但是面料是涤纶的，所以买的时候有点担心会不会真的干，结果发现非常好。\n洗涤时，它很轻，所以很容易干，并且干得很快，因此您可以更频繁地洗涤并保持清洁。\n", "content_orig": "パイルは綿だけど生地がポリエステルなので本当にサラッとしてるのか少し不安になりつつ購入したが、とても良かった。\n洗濯する時も軽いので干しやすいし、すぐに乾くので洗濯の頻度が増えて清潔に使えそう。\n", "model": "色: ブルー | サイズ: シングル", "star": 4, "reviewer": "まきん", "date": "2024-05-25", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1YRKVBARDISYW/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["速干"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPP5KC9", "title": "便宜的", "title_orig": "お安い", "content": "我为我的孙子买了这个，他将住在宿舍里上大学。\n我不知道用起来是否舒服，但我认为它是实惠的。\n", "content_orig": "進学のために寮生活する孫にと購入しました。\n使い心地は分かりませんがお手頃かと。\n", "model": "色: ピンク | サイズ: シングル", "star": 4, "reviewer": "あずき", "date": "2024-05-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1FNV21MQZ1U4F/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["具有性价比"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPP4TJK", "title": "我正在寻找的床单", "title_orig": "探していたシーツ", "content": "我很满意，因为这些就是我正在寻找的床单。\n", "content_orig": "探していたシーツなので満足しています\n", "model": "色: ベージュ | サイズ: シングル", "star": 4, "reviewer": "ここまで効かが良いとは、あまり期待して無かったので満足してます。", "date": "2024-05-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2GTS80AH15QBB/ref=cm_cr 待はしないほうがいいです。\n", "model": "", "star": 3, "reviewer": "ぺーたん", "date": "2024-04-23", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2WLBAR4PO2PPU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPP2C52", "title": "性价比好！", "title_orig": "コスパよし！", "content": "皮肤感觉良好且光滑。\n", "content_orig": "肌触りが良く、サラッとしています。\n", "model": "色: ダークグレー | サイズ: シングル", "star": 3, "reviewer": "ヤマ", "date": "2024-04-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2YWQTNOPJI1Z/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["具有性价比"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPNTP91", "title": "我以为里面有更多的棉花。", "title_orig": "もっと綿が入ってるかと思いました", "content": "比我预想的还要顺利。\n既然打开了就无法退货，所以我还在用。最后我意识到我必须去商店买。\n", "content_orig": "思ったよりもペラペラです。\n開けてしまったので、返品も出来ず使ってます。やっぱり、店頭で買わないとダメだなって思いました。\n", "model": "色: グレー | サイズ: シングル", "star": 3, "reviewer": "kuma", "date": "2024-04-14", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1VHAM9DKRWLVD/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "不是可以防螨吗？", "title_orig": "防ダニは非対応かな？", "content": "订购时价格： ¥1,598\n\n产品名称：Matdeco 床垫，毛巾，四季床垫，起绒面料，四个角加固橡胶，可水洗，100x205 厘米\n\n--------------------\n\n这是我最喜欢的床垫的完美尺寸 - 200x100x3 厘米。\n\n布料表面摸起来粗糙粗糙，甚至摩擦脸颊时可能会感到疼痛，但站立不动时触感良好，即使赤身裸体也可以舒服地躺在上面。\n\n虽然有弹性，但厚度适中，具有良好的缓冲量，并且具有优异的吸湿快干性能，以及抗菌、除臭处理，因此功能性很强。\n衬里采用聚氨酯涂层防水。另外，四个角都配有橡皮筋，可以挂在床垫上，有效防滑。\n\n防水很方便，因为它可以防止汗水进入床垫，但处理时必须小心。\n如果不小心将物品扔进洗衣机，机器可能会发生故障。\n欲了解更多信息，请在互联网上搜索“防水床单洗衣机”。\n我也使用电热毯，但它有一个缺点，如果你把它放在这些床单下面，导热率会大大降低，从而降低效果。\n\n无论如何，自从我收到它以及替换床单的那天起，它就一直工作良好。\n", "content_orig": "注文時の価格：￥1,598\n\n商品名：Matdeco 敷きパッド タオル地 オールシーズン ベッドパッド パイル地 四隅に強化ゴム付き 洗える 100x205cm\n\n--------------------\n\n自身が愛用する敷布団―200x100x3cm―にピッタリのサイズです。\n\n生地の表面はゴワゴワとした粗さも感じられ頬ずりすると痛みさえ覚えますが、静止状態での触れ心地は良好で、素っ裸でも快適に寝転べます。\n\n柔軟ながら厚さは程々にあってクッションもチョイとばかり利いており、吸湿・速乾性に優れつつ、抗菌・防臭加工まで施されているとあり、機能性は大したモノですね。\n裏地はポリウレタンコーティングとやらで防水仕様となっております。また、四隅にはゴムバンドが備わっており、敷布団へ引っ掛ける事でズレを効果的に抑制します。\n\n防水仕様は、汗などによる湿気が敷布団へ及びにくく利便ですが、取り扱いには要注意です。\n不用意に洗濯機へ放り込むなどしたなら機械が故障する恐れもあります。\n詳しくは『防水シーツ 洗濯機』などでネット検索して下さい。\nまた、自分は電気毛布も利用しているのですが、当シーツの下に敷くと熱の伝導率を大幅にカットされ、効きが悪くなると言った弊害もあります。\n\nともあれ、替えのシーツと共に、受領当日から活躍してくれておりますよ。\n", "model": "", "star": 4, "reviewer": "Amazon カスタマー", "date": "2024-04-14", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1ONVAESSEDICW/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["速干", "厚度", "触感舒适", "吸湿", "不易移位", "防螨抗菌"], "冷感体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPNYYR8", "title": "触感良好", "title_orig": "肌触り良き", "content": "我以为会厚一点，但是颜色和质地都很好。我想我也买一件来洗吧。\n", "content_orig": "勝手にもう少し厚手だと思っていましたが、色も肌触りも良いです。洗い替え用にも買おうかな。\n", "model": "色: ブルー | サイズ: シングル", "star": 4, "reviewer": "ひっぷ", "date": "2024-04-13", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R237OAI5MA53LO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0BRPP4TJK", "title": "总体满意", "title_orig": "概ね満足", "content": "它非常轻，洗后干得很好。我买了不同颜色的来洗。\n", "content_orig": "とても軽く、洗濯後の乾きが良いです。洗い替えに色違いを購入しました。\n", "model": "色: ベージュ | サイズ: シングル", "star": 4, "reviewer": "hfme", "date": "2024-04-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2Q8RCCKKN2TZ0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "普通起绒组织", "title_orig": "普通のパイル織", "content": "它不像今治毛巾那样特别光滑，但有很正常的手感。\n\n背面由聚氨酯制成，产品称其“有效防止液体渗透”，因此床侧没有通风，而且该材料似乎被设计为快速干燥。\n ⇒当我尝试从背面吹气时，正面没有气流。\n\n虽然号称四季皆宜，但夏天用我还是有点担心。\n", "content_orig": "今治タオルのような特に滑らかというわけでなく、至って普通の手触りです。\n\n裏面がポリウレタンで、商品的には「液体の浸 const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
