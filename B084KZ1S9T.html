odel": "色: ホワイト | サイズ: クイーン・160X200cm", "star": 1, "reviewer": "盧", "date": "2023-08-19", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/REQ6C1HGG2F2T/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["婴幼儿/儿童使用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["起球/掉毛问题"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KZ1S9T", "title": "可以覆盖整个", "title_orig": "全体を覆いかぶせれる", "content": "我觉得你可以把整个东西都盖起来然后洗，这真是太棒了。", "content_orig": "全体を覆いかぶせれて洗濯もできるとてもいいと思います。", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "fumi", "date": "2023-07-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R4SQQW98RGMER/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B0B9QZDLSP", "title": "小的", "title_orig": "小さい", "content": "我购买了一张200 x 200的宽特大号，使用前先清洗了，当我尝试将其贴在厚度为195 x 197的普通床垫（2张单人连在一起）上时，明显太小，床垫的四个角被压得很紧，根本无法使用。我把它的袋子扔掉了，所以我认为我不能退货换货。很遗憾，因为当我之前购买单一尺寸时，​​感觉很好并且尺寸很完美。如果您打算购买，最好在洗涤前检查尺寸是否正确。", "content_orig": "200×200のワイドキングサイズを購入しました。使用前に洗濯して、シングル２台繋げた195×197の厚さも一般的なマットレスにつけようと思ったら、明らかに小さくマットレスの四隅ぎゅーっと潰されてしまい全然使えませんでした。入っていた袋も捨ててしまったので、返品交換できないだろうなぁ、、。以前シングルサイズを購入した時は使用感もよくサイズもぴったりだったのですごく残念です。これから購入される方は洗濯前にサイズが合ってるかあらかじめ確認したほうが良いです。", "model": "色: ホワイト | サイズ: ワイドキング・200X200cm", "star": 2, "reviewer": "もーりん", "date": "2023-06-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3BXV5HHOZUN4C/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KT2HHZ", "title": "尺寸...", "title_orig": "サイズが…", "content": "从一个坏的方面来说，它太完美了。\n我不想让它移动，所以我使用了一体式床笠，但它一直在移动。我在 10 厘米厚的床垫上使用它，但这很令人沮丧，因为橡胶会像完全拉伸的床垫垫一样移动。\n但如果用在正常厚度的床垫上，就会太紧，贴不上，所以尺寸不好。", "content_orig": "悪い意味でピッタリすぎです。\nズレるのが嫌で一体型ボックスシーツにしたのに、めちゃくちゃズレます。10cm厚のマットレスに使用していますが、ゴムが伸びきった敷パット並にズレるのでストレスです。\nでも普通の厚さのマットレスに使用だとギリギリすぎてかけれないので、サイズ感がイマイチです。", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 1, "reviewer": "Amazon カスタマー", "date": "2023-06-13", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2KJ8SYVBAE8M1/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["追求防滑固定/贴合床垫"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KYDM4W", "title": "表面太滑了...", "title_orig": "表面の滑り具合があんまり…", "content": "表面不光滑，翻面困难。虽然有光滑的棉质材料，但这一款确实有一种“棉质！！”的质感。\n\n如果您穿着缎子或丝绸材质的睡衣，情况可能会有所不同，但大多数衣服都会产生摩擦，导致翻身困难。如果您通常使用简单棉质材料制成的床单和被套，这可能不是问题。如果您习惯光滑的饰面和材料，翻身的困难可能会有点压力。", "content_orig": "表面に滑らかさが無いので、寝返りしずらいです。綿素材でも滑らかなものもある中でこちらは本当に「綿！！」って感じの質感です。\n\nサテン織りやシルク素材のパジャマなどを着ていたら別でしょうが、大抵の服は摩擦で寝返りしにくいかと。普段から素朴な綿素材のシーツやカバーを使われている方なら気にならないのかも…。滑らかな加工や素材に慣れていると、寝返りのしにくさがプチストレスになるかもしれません。", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 3, "reviewer": "ナッツ", "date": "2023-05-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1VIH8ZK184NBB/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["触感柔软舒适", "触感偏粗糙/生硬"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KZ1S9T", "title": "太小了！", "title_orig": "小さ過ぎる！", "content": "这是一张普通的单人床，但是这些单人尺寸的床单非常小！\n穿上它很痛苦。\n我以前从未遇到过如此光滑的床单。\n对于那些不擅长或不喜欢安装床单的人来说，工作会因为太小而困难十倍。最好根本不买。", "content_orig": "一般的なシングルベッドですが、シングルサイズのこのシーツがめちゃくちゃ小さい！\n装着するのが一苦労。\n今までこんなツンツルテンのシーツに出会ったことないです。\nシーツ取り付けが苦手な方、嫌いな方、小さすぎる為に作業の大変さが10倍になります。絶対買わない方がいいです。", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 1, "reviewer": "しずく", "date": "2023-05-17", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R17PBNUM3UKW5L/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["追求安装简便"], "触感体验": ["触感柔软舒适"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KT2HHZ", "title": "舒适感很棒！", "title_orig": "寝心地は最高です！", "content": "我一直使用分开的床单和护垫，但这款可以让我毫无压力地睡觉，不会滑倒或扭曲！\n\n我还购买了一个替换件。\n\n我正在审查它，但是当我尝试洗它时，首先它太厚了，洗的时候我无法将它旋转出来，并且一遍又一遍地加水不均匀，它永远洗不完。\n\n而且，洗过一次后，它就缩水了，比我的床还小，拉起来穿的时候，它有点撕裂，或者说是接缝处撕裂了。\n\n我想如果再洗的​​话就不能再穿了，所以决定退货。\n\n我要寻找另一种具有独立床垫和床单的产品。", "content_orig": "いつもシーツとパット別になってるのを使用してたのですが、こちらはズレたりよれることなくストレスなく寝られます！\n\n洗い替え用も購入しました。\n\nと、レビューしていたんですけど、お洗濯してみたら、まず分厚いので、洗濯中に脱水ができず偏りで何度も給水されて、全然終わりませんでした。\n\nしかも、1度お洗濯したら、縮んで、ベッドのサイズよりも小さくなって、着けるのに引っ張ったら、少し破けました、とゆうか、縫い目が裂けました。\n\nもう1度お洗濯すると確実に着けられなくなると思い、返品する事にしました。\n\nやっぱりベッドパットとシーツが別になった他の商品を探してみます。", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 1, "reviewer": "Rieko", "date": "2023-04-05", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RSQDWVZ0VKA0P/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["触感柔软舒适"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["边缘磨损/开线破损", "洗后缩水/变形"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KLVL4H", "title": "保持舒适", "title_orig": "快適に過ごせる", "content": "我及时买了这个床罩，但我非常喜欢它，所以我打算再次购买它作为替代品。\n然而，它与床的贴合度并不完美，而且有一点错位，但我认为对于这个价格来说，它是一个优质的产品。", "content_orig": "間に合わせに購入したベッドカバーでしたが\nお気に入りで洗い替え用にまた購入予定です。\nただベッドにピッタリあってる訳ではなく\n少しズレが気になりますが、お値段の割には良質商品だと思います。", "model": "色: グレー | サイズ: セミダブル・120X200cm", "star": 3, "reviewer": "ぁゅ", "date": "2023-03-14", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2PQTX1W7MYFO5/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["追求防滑固定/贴合床垫"], "触感体验": ["触感柔软舒适"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KT2HHZ", "title": "侧面的布料起皱", "title_orig": "サイドの部分の生地がシワシワになる", "content": "我买它是因为它的价格最便宜，但与我一直使用的同类产品相比，它的床垫很不寻常，而且侧面的布料在洗涤时会起皱和褶皱，给人一种邋遢的感觉。", "content_orig": "最安値だったので購入しましたが、今まで使用していた同じ様なお品よりマットレスにはめずらく、サイドの生地が洗うとシワシワになり、だらしない印象になります。", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 2, "reviewer": "J", "date": "2023-01-31", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RXZ2LRDUT0KO3/ref=cm_cr_getr_d_rvw_ttl? 我把它放在半阴处干燥来使用。\n即使被指甲划伤也非常安全，而且由于它是一体化的，因此您不必担心床单会移动。我希望我早点买这个！将其设为灰色以与窗帘的颜色相匹配是正确的选择。\n我基本上都是在床上住的，所以很满意。\n洗完之后我再发帖。\n\n附录 2021.11.20\n买了这个之后，我尝试了防水床笠，但这个是最容易使用的。\n这是箱垫移动最不麻烦的事情，但经过反复清洗后，它似乎缩小了，并且开始移动了很多。\n其中一些被兔子的破坏性活动咬掉了，而且有些地方已经解开，但它们比我迄今为止拥有的任何床单都要好，所以我会继续使用它们。\n\n我收到第一张照片的那天\n大约6个月后的第二张和第三张照片", "content_orig": "ペットのうさぎがすぐボロボロにしてしまうのと、基本的にベッドの上で作業していて頻繁に洗濯するので今まで何枚もベッドパッド、シーツを買い替えてきました。\n開封時多少の糸くずはついてました。ほつれは無いので許容範囲です。嗅覚過敏のため半日陰干しして使用してます。\n爪でガリガリされても全然大丈夫だし、一体型だからシーツのずれも気にならないしもっと早く買えば良かった！カーテンの色に合わせてグレーにしたの正解でした。\n基本的にベッドの上生活なので大満足してます。\nまた洗濯したら追記します。\n\n追記2021.11.20\nこちらを購入後防水ボックスシーツなど試しましたがやっぱりこれが一番使いやすいです。\nボックスパッドのズレもこれが一番気になりませんが、洗濯を繰り返したら縮んだようで結構ズレるようになりました。\nうさぎの破壊活動で一部噛みちぎって所々ほつれましたが今までのボックスシーツのより一番マシなのでこれからも使います。\n\n写真1枚目届いた当日\n2,3枚目半年後くらい", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "c", "date": "2021-05-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R13LBBOQ5BQID0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["宠物家庭"], "使用期望": ["追求防滑固定/贴合床垫"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["边缘磨损/开线破损", "洗后缩水/变形", "起球/掉毛问题", "存在异味"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KX2LFN", "title": "我担心气味", "title_orig": "匂いが気になりました", "content": "当我把它从包里拿出来时，我注意到了时间的味道。我洗完后一直在用，感觉很好。", "content_orig": "袋から出したと時の匂いが気になりました。洗濯してから使っていますが、とても気持ち良く使っています。", "model": "色: グレー | サイズ: クイーン・160X200cm", "star": 4, "reviewer": "かお", "date": "2021-05-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RLJJY3QCDHR6G/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["存在异味"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KT2HHZ", "title": "颜色漂亮", "title_orig": "色目がキレイ", "content": "很好", "content_orig": "良かったです", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "skip", "date": "2021-05-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RT4TTZVTIBDVE/ref=cm_cr_getr_d_rvw_ttl?ie= 格，但这是一个很好的产品，我可以推荐它。", "content_orig": "なかなか斬新な商品だと思う。\nパッドだけを敷くと真ん中の両端がちょっと捲れて敷布団が出てくる。\nこの部分が掛け布団や毛布と擦れて毛玉が出来てたので、その対策にシーツ一体型を使ってみた。\nボックスシーツにありがちな、寝たところのシワもパッドのお陰で気にならない。\n多少は出るけど許せる範囲です。\n\n自宅の洗濯機で洗えるところが一番良い。\nだた、干すときにはちょっと工夫が必要。\nボークスシーツ部にゴムが入っているので縮むから。\n\nお値段がちょっと高めなので気になるが、良い商品でお勧めできます。", "model": "色: グレー | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "xhenlong", "date": "2021-03-01", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2DEQ5FM6GYXK7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["追求防滑固定/贴合床垫"], "触感体验": ["触感偏粗糙/生硬"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["起球/掉毛问题"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KZ1S9T", "title": "最糟糕！", "title_orig": "最悪！", "content": "我点了3个，其中一个是这样的，如果可以的话我不会给它☆，太糟糕了！我尝试在使用前清洗它，但是当我洗完并挂起来晾干时，我注意到了这一点，我很后悔。我应该在正确清洗之前检查一下。这是我第一次做出如此不愉快的购买。我希望他们停止发货而不检查产品。", "content_orig": "3個注文して、一つこんな感じです、出来れば☆付けたくなかったです、ひどい！使う前に洗おうと思って、洗い終わって干す時に気付き、かなり後悔、ちゃんと洗う前にチェックすればよかった、こんな不快な買い物初めてです、検品しないで商品発送するのは、やめてほしい", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 1, "reviewer": "yu ki", "date": "2021-02-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3OCY3EL1O5MU2/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "季节与透气性": ["无匹配标签"], "产品质量与耐用性": ["无匹配标签"], "价值体验": ["无匹配标签"], "材质相关体验": ["无匹配标签"]}, {"asin": "B084KZ1S9T", "title": "异型一体型", "title_orig": "珍しい一体型", "content": "这是一款罕见的带有一体式床垫的床笠。脚垫不会移动，因此非常适合担心打滑的人。然而，我只知道床垫是用来延迟床笠清洗周期的盖子，所以我认为它们不适合这个目的。我认为如果你的床垫很旧并且你能感觉到弹簧的话它会很合适。", "content_orig": "敷きパッドが一体になった珍しいボックスシーツです。パッドがずれないので、ズレが気になる人にはぴったりじゃないでしょうか。ただ、敷きパッドってボックスシーツの洗濯サイクルを遅らせるために使うカバーぐらいの認識だったので、そういう用途には向きませんね。ベッドのマットレスが古かったりしてスプリングを感じるようなケースならうまくフィットすると思います。", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "そうちゃんこすーぷ", "date": "2021-02-15", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3TNBOQU2W6BKE/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["无匹配标签"], "使用期望": ["追求防滑固定/贴合床垫"], "触感体验": const PALETTE = ["#7a5233", "#b8895a", "#dfc3a3", "#d9a441", "#b35a3a", "#6b8f3f", "#3c6e8f", "#a6667a", "#8a7dc9", "#5aa0c9", "#d68c3a", "#7a9e6b"];
const GREY = "#d6d2c4";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const qualityIssue = REVIEWS.filter(r=>(r['产品质量与耐用性']||[]).some(t=>t!=='无匹配标签')).length;
  const softFeel = REVIEWS.filter(r=>(r['触感体验']||[]).includes('触感柔软舒适')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${softFeel}</div><div class="label">明确反馈触感柔软舒适</div></div>
    <div class="stat"><div class="num">${qualityIssue}</div><div class="label">提及具体质量/耐用性问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.slice(0,12).join('</b> · <b>') + (asins.length>12? '</b> 等 '+asins.length+' 个':'</b>');
}

// ---------- generic pie builder ----------
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- build all cards ----------
renderStats();

makeCard(document.getElementById('gridTop'), {
  id:'chartStar', title:'星级分布', dim:'star',
  hint:'评论星级 1～5 星占比'
});
makeCard(document.getElementById('gridTop'), {
  id:'chartUser', title:'使用人群', dim:'使用人群',
  hint:'婴幼儿、家人共用/看护、宠物家庭等特定使用场景标注'
});

makeCard(document.getElementById('gridExpect'), {
  id:'chartExpect', title:'使用期望', dim:'使用期望',
  hint:'购买动机与最看重的核心诉求（固定贴合/防污/纯棉肤感/安装简便/性价比）'
});

makeCard(document.getElementById('gridExperience'), {
  id:'chartTouch', title:'触感体验', dim:'触感体验',
  hint:'皮肤直接接触时的柔软度、顺滑度等主观感受'
});
makeCard(document.getElementById('gridExperience'), {
  id:'chartSeason', title:'季节与透气性', dim:'季节与透气性',
  hint:'保暖、闷热、速干/难干、四季通用等反馈'
});
makeCard(document.getElementById('gridExperience'), {
  id:'chartQuality', title:'产品质量与耐用性', dim:'产品质量与耐用性',
  hint:'填充物外溢、边缘磨损、缩水、起球、异味、做工等长期使用问题'
});

makeCard(document.getElementById('gridMaterial'), {
  id:'chartMaterial', title:'材质相关体验', dim:'材质相关体验',
  hint:'与该款面料/填充材质直接相关的具体反馈'
});

makeCard(document.getElementById('gridValue'), {
  id:'chartValue', title:'价值体验', dim:'价值体验',
  hint:'价格与实际体验是否匹配的评价'
});
</script>
