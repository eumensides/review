买了好几种类型的床单，犯了很多错误，但我终于找到了配得上防水这个词的床单。\n", "content_orig": "何種類か買って失敗を繰り返していましたが、やっと防水の文字に相応しいシーツに辿り着きました\n", "model": "", "star": 5, "reviewer": "k.s", "date": "2026-08-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RIRJT12YQS4WM/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSPDSDXC", "title": "商品", "title_orig": "商品", "content": "考虑到价格，我认为还算合理。\n我期待着下一次。\n", "content_orig": "お値段の事を考えると、妥当だと思います。\n次回も楽しみにしています。\n", "model": "色: ブルー | サイズ: シングル・100×200cm", "star": 3, "reviewer": "Kaz", "date": "2026-07-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R36OA1BFWH0U1T/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "看起来不错！", "title_orig": "見た目がいい感じ！", "content": "我年迈的父母都用过这些床单。\n它非常易于使用，因为它可以轻松地安装在投注板上并且不会滑动。\n他们似乎也感觉良好。\n我不会为那些来访的人感到尴尬......\n它有一种干净的感觉。\n", "content_orig": "高齢者両親二人共こちらのシーツにしました。\nベットパットにスキッと収まりズルズルしない事がとても使いやすいです。\n本人達も気持ち良いようです。\n訪問される方にも恥ずかしく無い感じで…\n清潔感があります。\n", "model": "", "star": 4, "reviewer": "おつさんみたいなオバちゃん", "date": "2026-07-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2T0ZPAS8OXBQA/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["容易移位"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSPL9P8X", "title": "我有一只狗，它已经开始做记号了。", "title_orig": "マーキングを始めたワンコがいるので", "content": "我的公狗已经 6 个多月大了，已经开始在屋子里做记号了。\n地上、沙发上、床上。\n床上铺着防水床单和软垫，但有洗过的哈吉痕迹……\n我买了两张床和两张沙发作为替换。\n令我震惊的是，白色垫子上有棕色污渍，即使清洗后也无法去除，但我认为这个价格非常超值。\n这是被子类型，所以我希望它不会从接缝处漏水。\n堪称垫子，非常薄。\n是在床单和垫子之间吗？\n这不是一种寒冷的感觉，所以我想知道每年的这个时候会是什么样子。皮肤感觉很好。\n\n将新物品清洗一次即可继续。想到这里，我家狗尿了……\n最后，我尿了。\n令人失望……\n", "content_orig": "6ヶ月を過ぎた男の子のワンコがマーキングを家の中で始めました。\n床も、ソファーもベッドの上も。\nベッドは防水シーツを敷いてパットを敷いてますが、洗ったハジからマーキング…\n洗い替えにとベッド用2枚、ソファー用2枚買いました。　\n白いパットに茶色シミが付いていて洗っても取れなかったのがショックですが、価格はすっごくお値打ちだとおもいます。\nキルトタイプなので縫い目から漏れないと良いなぁ。\nパットというにはものすごく薄いです。\nシーツとパットの間くらい？\n冷感では無いので、今の時期はどうなんたろう？肌触りは良いです。\n\n新品を一度洗濯して、さあ。と思ったらワンコがオシッコしました…\n結局、オシッコ通してしまいました。\n残念…\n", "model": "色: ホワイト | サイズ: シングル・100×200cm", "star": 2, "reviewer": "kaguyahime", "date": "2026-07-19", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1FF8UL4Q16P9M/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "为年迈的母亲做准备", "title_orig": "高齢の母に備えて", "content": "该产品放在床上感觉不柔软。我妈妈还不需要它，但我买了它并戴上以防万一。妈妈没有注意到，每天晚上都睡得很香。\n", "content_orig": "この商品は、柔らかく敷いている感がありません。まだ母には必要ないのですが、用心のため購入し敷いています。母は気付いておらず、ぐっすり毎晩寝ています。\n", "model": "", "star": 5, "reviewer": "ミスター", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R37IS4E0SUUHLF/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GG6HCN1F", "title": "良好的性价比", "title_orig": "コスパ良い", "content": "虽然买的很便宜，但是做工却出奇的好，很满意，没有任何问题😊\n", "content_orig": "安く買えたのに意外と　しっかりした作りで私は何の問題無く満足しています😊\n", "model": "色: ブルー | サイズ: ダブル・140×200cm", "star": 5, "reviewer": "ブッティ", "date": "2026-06-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1R3VGMIXAEAC1/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["具有性价比"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GG62V5PJ", "title": "睡眠舒适度发生变化", "title_orig": "寝心地が変わる", "content": "我认为它是防水的，但坚硬的面料不能分散身体压力，所以当我睡觉时，我的臀部和脚后跟会受伤，很不舒服。\n我哭了，不再放它了。\n", "content_orig": "防水性は良いと思いますが、ハリのある生地だからか体圧分散ができず、寝ていたら臀部や踵が痛くなり寝心地が悪くなりました。\n泣く泣く敷くのをやめました。\n", "model": "色: ライトグレー | サイズ: ダブル・140×200cm", "star": 2, "reviewer": "Amazon カスタマー", "date": "2026-05-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1O8YGAQZVEXCC/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ews/srp/-/R7PS53X2Z93FC/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位"], "防水体验": ["防水效果好"], "产品质量": ["容易移位"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "防水床笠", "title_orig": "防水のボックスシーツです", "content": "尽管它是防水的，但它很柔软，皮肤感觉良好。\n 4个角上的橡胶很坚固，完全停住了。\n虽然很薄，但背面的防水涂层却很坚固。\n我很高兴即使弄脏了，我也可以在家里的洗衣机里洗。\n", "content_orig": "防水なのにやわらかくて肌触りが良かったです。\n４すみのゴムがしっかりしていて、ぴたっと止まりました。\n薄手ながら裏面の防水コーティングはしっかりしてしていました。\n汚れても家の洗濯機で丸洗いできるのがありがたいです。\n", "model": "", "star": 5, "reviewer": "Amazonのお客様", "date": "2026-04-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1R98L1PNP25FY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "采用特殊设计面料的床单", "title_orig": "生地に工夫がされているシーツ", "content": "我的印象是防水床单很粗糙，除非在上面放一些东西，否则皮肤会感到不舒服，但这些床单是防水的，但我可以在上面睡觉而不会感觉到织物的特殊质感。平坦的表面和侧面可能是防水的，但由于面料不同，接缝处可能会有些渗水。\n由于面料不同，不是单件，因此不太可能从床垫上移位。安装的时候压力比较小，因为按照布料来安装就很顺利。\n我认为价格是合理的，尽管它是双层防水床单和软垫床。\n缺点是薄，但由于是双层的，所以比较大，清洗起来有点困难。我觉得这是防水片，所以没办法。\n", "content_orig": "防水シーツはガサガサしていて、上に何か敷かないと肌あたりが悪いと言うイメージでしたが、こちらのシーツは防水加工ながら特有の生地感を感じることなく、このままでも寝れます。平面及びサイドも防水加工なのでしょうがそれぞれ生地が違うので、つなぎ目部分からの浸水は多少あるかもしれません。\n生地が違うことで1枚ものになっていないので、マットレスからずれる事は少ないです。取り付ける時も生地に合わせて設置すればうまくいくのでストレスは少ないです。\nダブルサイズの防水シーツで敷きパッド加工がされているのに値段は良心的だと思います。\n難点は薄型ですが、ダブルのためサイズが大きく洗濯が少し大変です。これは防水シーツあるあるだと思うので仕方ないですね。\n", "model": "", "star": 5, "reviewer": "Aatyan", "date": "2026-04-14", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2Y3W98JFVKYOL/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["容易移位"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "マットレスを守ってくれる", "content": "", "content_orig": "防水なのにやわらかくて、寝心地がとてもいいです。\n\nひとつきほど使っていますが、とくにトラブルは感じません。\n\n寝返りをしてもカサカサ音がほとんどしません。\n音が気にならないので、ぐっすり眠れます。\n\n生地は薄めで、ベッドにかけやすいです。\n四すみのゴムがしっかりしていて、ぴたっと止まります。\nズレにくいので安心です。\n\n表の生地はふんわりしていて、さわると気持ちがいいです。\n見た目も普通のシーツみたいで自然です。\n水をこぼしても、防水加工のお陰で下までしみにくいです。\nうちはわんこが粗相をしたのですが、セーフでした。\nマットレスを守ってくれるので安心できます。\n\n防水なのにムレにくく、さらっとしています。\n\nやわらかさと防水のバランスがよく、毎日安心して使えます。\n\nこれは「防水 ボックスシーツ 薄型 吸湿性 敷きパッド 防水シーツ 防水タイプ ベッドシーツ 柔らかな触感 丸洗い可能 四季適用 （ブルー, ダブル・140×200cm） (ブルー, ダブル・140×200cm)」のレビューです。\n", "model": "", "star": 5, "reviewer": "森林キャンプの鉄人", "date": "2026-04-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/REJG27A98TVAX/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GG6HCN1F", "title": "", "title_orig": "丸洗いできる安心感が大きい防水パッド", "content": "", "content_orig": "ベッドのマットレスの汚れ防止と寝汗対策を目的に注文しました。\n\n最も惹かれたのは洗濯機で丸洗いできる手軽さです。寝具はどうしても汗や汚れが気になるので、気軽に洗えるのは大きなメリット。乾きも思ったより早く、清潔を保てる点が助かっています。\n\n使い心地についても、クッション性はほぼ無いものの、防水にしては肌触りも悪くないので、オールシーズン使えそうです。四隅のゴムバンドもしっかりしているので、寝ている間にズレることはほとんどありません。取り付けも簡単なので、洗濯→装着までストレスなく使えています。\n\n気になる点を挙げるとすれば、縫製がやや粗めなところですが在使用している分には大きなデメリットとは感じません。\n\n「手入れのしやすさ」と「快適さ」を両立したコスパの良いマットレスパッドだと思います。寝具を清潔に保ちたい方にはおすすめです。\n", "model": "色: ブルー | サイズ: ダブル・140×200cm", "star": 5, "reviewer": "takashi", "date": "2026-04-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2W5121CR7GLB8/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GG62V5PJ", "title": "", "title_orig": "防水で洗えるのでおすすめ", "content": "", "content_orig": "注意1：この製品には防水マットレスプロテクターが1枚のみあり、枕カバーやその他の製品は含まれません。注意2：最近の商品は、使用している型紙が若干異なるため、複数ご購入の場合、柄の大きさの違いや形状の若干の変更、商品の性能や素材が異なる場合がございます。変更はありませんので、ご了承ください。統一パターンは今後徐々に復活していきます。\n\n本製品は防水マットレスプロテクターであり、超薄型に設計されているため、マットレスとしては使用できません。防水寝具として薄手で吸汗性・通気性に優れ、洗濯機で丸洗い可能です。 外側の層は100％ポリエステル素材で作られており、柔らかく快適です。中わた：ポリエステル100％。背面にはTPU防水メンブレンを採用。注意：この製品には防水マットレスプロテクターが1枚のみあり、枕カバーやその他の製品は含まれません。\n\n製品の4隅には弾力性のあるバンドがあり、マットレスの4隅に縛って滑りを防ぐことができる。\n\n素材は100％ポリエステル繊維で、ピーチスキン加工を施してあり、柔らかくて快適です。\n\n洗濯機で洗うか、手洗いするかを選択できます。 室温で洗濯でき、漂白剤は必要ありません。 本品の底層 er-reviews/srp/-/R17I2SYKDRBBEW/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "手触りがよく敷パッド一体型なのでズレない", "content": "", "content_orig": "敷パッドとボックスシーツが一体化している商品。\n敷パッド裏面にTPU防水フィルムを採用しているため耐水性が高くなっている。\n手触りは、ピーチスキン加工をしているためとても気持ちよくなっている。\n何よりうれしいのは敷パッドとボックスシーツが一体化しているため、寝ていてズレない!!!\n変に寄ってゴワゴワした感触がないのがいいです。\n", "model": "", "star": 4, "reviewer": "レビュー苦手", "date": "2026-03-13", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1VVBAPP8O32ZQ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "確かに薄い。", "content": "", "content_orig": "利点といえば洗いやすいかな…\n薄型でパリッとした感じですね\n使いやすくいいですね\n防水は必要な人にはおすすめですよ。\nうちでは防水ボックスシーツの上にパイル系の高吸水シーツやパッドを付けて使用しています。\n吸水物がないと液体は流れてしまうので…\n", "model": "", "star": 5, "reviewer": "Amazingなお客様", "date": "2026-03-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RA1SPJ3L477BR/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "敷きパッド一体型とは考えない方がいいかも？", "content": "", "content_orig": "敷きパッド一体型のボックスシーツということで、洗濯や取り替えの手間が少しでも減ればと思い注文しました。実際に使ってみて感じたことを正直に書いておきます。\n\nまずサイズ感ですが、マチが約30cmとまぁ標準的な数値。\nただし伸びる素材ではないので厚みのあるマットレスだと結構キツイです。\n商品説明文では「5〜30cmのマットレスに適しています」と書かれており、説明画像のほうでは「5〜28cm」と書かれていて、どちらが正式なのかわかりにくいのですが印象としては後者の方が正しいかな。\nいずれにしても購入前にご自身のマットレスの厚みをしっかり確認しておいたほうが安心だと思います。\n\n敷きパッド一体型ということになっていますが、いわゆる単体の敷きパッドを想像していると少しイメージが違うかもしれません。表地の厚みはかなり薄めで、敷きパッドというよりは「少し厚みのあるボックスシーツ」くらいの感覚です。普段からしっかりした敷きパッドを使っている人だと物足りなく感じる可能性があるので、その場合は本品とは別に普通の敷きパッドを用意したほうが良いと思います。\n\n開封してすぐに感じたのは匂いでした。\nポリエステル系の素材の匂いが割と強めで、敏感な人じゃなくてもすぐに感じられるレベルです。\n匂いの点でもそうですが肌が敏感な方なども、一度か二度洗ってから使うほうが安心だと思います。\n\n防水についても少し気になった点があります。商品説明の画像（特に1枚目や3枚目）を見ると、かなりしっかりした防水シートのように見えて、介護用途などでも安心して使えそうな印象を受けます。\nただ説明文をよく読むと、表地は吸湿性があり、その下の層に防水生地がある構造とのことでした。敷きパッドとして吸湿性をアピールする意図は分かるのですが、見せ方としてはやや誤解を招きそうな気もします。実際に水をこぼしてテストしたわけではありませんが、パッド面の薄さを見る限り防水性能に過度な期待はしないほうが良いような気がしました。特に介護用途を考えている人だと、画像の印象だけで判断すると少しギャップを感じるかもしれません。\n\n作りに関しては、縫製がちょっと雑に感じられました。特に端末処理は結構アバウト。使っていてすぐ壊れるような感じではありませんが、細かい部分の仕上げは価格相応という印象です。\n\n一方で、肌触り自体は悪くありません。いわゆるツルっとした冷感シーツのような質感ではなく、少しやわらかさのある生地なので、ツルツル系のシーツが苦手な人には好まれる質感だと思います。寝心地としては特に不満はありませんでした。\n\n総合的には、「敷きパッド一体型」という言葉から厚みや防水性を期待しすぎると少し違和感があるかもしれませんが、ボックスシーツとして考えれば普通に使える商品という印象でした。用途や期待値を少し調整して購入すれば、十分実用的だと思います。\n", "model": "", "star": 3, "reviewer": "ももんが", "date": "2026-03-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1U4JZUSAPJX14/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "安価なわりには高級っぽく見える", "content": "", "content_orig": "今回ブルーにしてみましたが、ほぼサンプル写真どおりの渋めの青で落ち着きがあります。\nボックス型だとゴムベルトで止めるだけのよりしっかり固定できるのが良いですね。\n\n表面生地は短い起毛で手触りが良いです。\n防水層があるので不意に飲み物とかをこぼしても少し安心ですが、\n生地全部が撥水というわけではないのでこぼした後はちゃんと洗った方が良いです。\n", "model": "", "star": 5, "reviewer": "tn", "date": "2026-03-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2BNEUDP3H1HX5/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "表面の素材はポリエステルだが、天然の綿のような起毛素材で、肌触りが良いボックスシーツ", "content": "", "content_orig": "ベッドマットに取り付けるシーツは、ゴムひものタイプよりも、ボックスシーツは、\nズレにくく、安定感と耐久性が見込めます。\n\nベッドに装着するすべての周囲に伸縮性の高いゴムが入っており、\n被せるのが簡単で、短時間で取り付けが完了いたします。\n\n表面の素材はポリエステルですが、天然の綿のような、起毛素材で、肌触りは良いです。\n\n三層構造で、TPU防水コーティングが施されているため、耐水性が高く、\n安心して利用できるボックスシーツです。\n", "model": "", "star": 4, "reviewer": "モコの家族【Amazon歴25年】", "date": "2026-03-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1OSIY8RVU1Y1W/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": 完全防水的。\n然而，它并不像护理那样只在中间效果更好，所以如果边缘能更好地吸水那就太好了。\n它是超薄型，透气且不闷热，所以很舒服，但防水乙烯基暴露在背面，可能会形成小孔。背面的耐用性几乎不存在。嗯，如果衣服脏了，你就得经常洗，所以我想你必须保留大量的衣服并经常更换。\n就我个人而言，最好的使用方法是分层几层，每次弄脏时翻过来，因为只使用一层会让你感到不安。 （最下面的是垫式的，可以覆盖侧面，可以叠3层左右）\n我认为如果背面能更耐用一点就好了，因为宠物通常会爬上爬下玩耍。\n\n洗涤衣物时，由于衣物是防水的，因此可能会因脱水过度而无法正常使用，或者即使脱水也可能会残留一些水，所以要选择一个地方晾干。烘干机看起来很粗糙。\n", "content_orig": "ペットの粗相用に注文しました。\nお値段的にも、使い方的にも長持ちさせるような仕様ではないと思いますが、よほどの端っこでなければ、防水性はばっちりでした。\nただ、介護などのように真ん中よりばかりに都合よくしてくれるわけではないので、もう少し縁もしっかり吸水してくれたら最高です。\n超薄型タイプで、透湿性があり、蒸れは少ないので快適ではありますが、防水のビニールが裏側にむき出しですし、些細なことで穴があきます。裏側の耐久性はほぼ無いです。まあ、汚せは高頻度で洗うことになりますし、何枚も揃えて、頻繁に取り替え、買い替える感じなのかなと思います。\n1枚では不安が残るので、何枚か重ねがけし、汚すたびにめくって行くのが、個人的にはベストの使い方です。(一番下はサイド部分までカバーできるもので、重ねがけをパッドタイプで3枚くらい)\nペットが上ったり、潜ったりして遊んでしまうので、もう少し裏側の耐久性が上がると嬉しいなと思います。\n\nお洗濯は、防水のため、脱水が寄ってしまって上手くいかなかったり、脱水出来ても、わりと水分残ったりしますので、干す場所は選びます。乾燥機は厳しい印象です。\n", "model": "", "star": 4, "reviewer": "y", "date": "2026-02-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1OS5S4VDNFN8Y/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用", "吸湿"], "防水体验": ["防水效果好"], "产品质量": ["无匹配标签"], "感官感受": ["触感粗糙", "透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0GG6GW7L7", "title": "性价比不错，偶尔使用还可以", "title_orig": "コスパ良し、たまに使う分にはok", "content": "用于夜间锻炼。\n我把它从单人床换成了半双人床，所以我买了一张新的。\n\n 20厘米厚的床垫，四个角的橡胶相当紧。\n如果它在顶部移动太多，它就会脱落，但就我的目的而言，我不太关心。\n\n表面触感光滑且透气。\n背面有防水面，类似于高档塑料袋，可以防止水渗透。\n\n在投入实际使用之前，我在上面倒了满满一杯水，但中心部分顶住了，没有任何问题。\n如果在边缘，则吸水能力不够，会滴水。\n\n我尝试过使用其他类似的产品，但它们的性能似乎相似，所以在性价比方面我没有什么抱怨。\n不过橡胶的长度有点短，所以10cm左右的床垫比较合适。\n", "content_orig": "夜の運動用に。\nシングルからセミダブルになったので買い替え。\n\n厚さ20cmのマットレスだと、四隅のゴムが結構ギリギリ。\n上で動きすぎると外れるが、自分の用途としてはそこまで気にしない。\n\n表面はサラサラとした手触りで透湿性あり。\n裏面に高級レジ袋みたいな防水面があり、ここが水の浸透を防ぐ。\n\nとりあえず実戦投入前にコップいっぱいの水をぶちまけてみたが、中心部分は問題なく耐え。\n端っこだと吸水性能が足りず、やや滴る。\n\n他にも似たような製品を使ってみたが、性能としては似たような感じなので、コスパ的にも不満はなし。\nただゴムの長さは少し短く、10cmくらいのマットレスの方が適正と思われる。\n", "model": "色: ブルー | サイズ: セミダブル・120×200cm", "star": 4, "reviewer": "たか", "date": "2026-02-01", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1CR8 const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const waterGood = REVIEWS.filter(r=>r['防水体验'].includes('防水效果好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${waterGood}</div><div class="label">明确反馈防水效果好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- build all cards ----------
renderStats();

makeCard(document.getElementById('gridTop'), {

</script>
