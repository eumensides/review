"无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"低于价格","title_orig":"お値段以下","content":"是因为贵所以好用吗？我买的时候很薄，而且NITORI的质量比较好，因为天气不太冷。橡胶和片材是同一个颜色，色调也很好。\n然而，质量低于价格，这让我怀疑我收到的产品是否与描述和给予高评价的人不同。\n","content_orig":"高いから良いのかな？って買ったら\n薄いし、そんな冷たくない\n品質はニトリの方がいい\nゴムとシーツの色が一緒なのと色あいは良い。\nただ、品質はお値段以下、説明文や高評価の人と違う商品が届いているのか疑問になるレベルです。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":2,"reviewer":"Amazon カスタマー","date":"2024-09-26","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R15AKPC04WI40W/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VDF2KK","title":"我也想要防水。","title_orig":"防水性も欲しい","content":"我觉得这个产品很好，但是因为是夏天用的产品，所以我希望它有一个防水层，让它更加防水。\n另外，我买的枕头和枕套是一套的，但是材质一样，非常滑。早上起来，枕头会向上滑动，每天早上醒来都没有枕头哈哈。\n请改进它。\n","content_orig":"物はとても良いと思いますが、夏使用する商品なので、防水層を作って防水性をもっと高めて欲しいです。\nあと、枕と枕カバーとセットで購入したのですが、同じ素材でめちゃくちゃ滑ります、朝、枕が上方へ滑っていて、枕なしで毎朝目覚めますｗ\n改良を願い致します。\n","model":"色: ブラック | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"ZION","date":"2024-09-24","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1WV5RMHBB13K3/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["不易移位"],"冷感体验":["无匹配标签"],"产品质量":["容易移位"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"质感不错","title_orig":"いい質感","content":"我很惊讶仅仅更换床垫就能改变睡眠的舒适度。以前我很担心自己的睡姿，因为垫子很硬，但改用这个垫子后，我睡觉时感受到的压力消失了。\n","content_orig":"敷きパッドを変えるだけでこんなにも寝心地が変わるものなのかと驚きました。マットが硬いため、今まで寝相を気にしていましたが、このパッドに変えてから、睡眠時のストレスが解消しました。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"荻原竜也","date":"2024-09-24","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RZWS73YU1BH8/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"我可以看到，与更便宜的相比，它物有所值。","title_orig":"安いものと比べると値段相応だということが分かる","content":"有点凉快，感觉也不错！\n不过，相对于强调便宜和散热的产品来说，或许也仅此而已。\n\n在  name: 敷きパッド単品","star":3,"reviewer":"phillix","date":"2023-11-11","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3C7KUZCSBGZTS/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","耐用","触感舒适","颜色"],"冷感体验":["冷感体验好"],"产品质量":["棉絮跑出"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"即使您在上面也可以清洗","title_orig":"オネショしても洗えます","content":"洗一洗就能解决问题\n","content_orig":"洗えば解決\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"飛鳥","date":"2023-11-09","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RYHS0HJ2ZD2TV/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"我不太明白","title_orig":"良くわからない","content":"它得到了很好的评价，但是...\n今年夏天不凉，特别热，但是我付出了相当不错的代价，却没有得到什么结果。\n","content_orig":"口コミで良い評判だったけど…\n涼しくはなかった\n今年の夏は特別暑かったけど\nそこそこ良い値段払ったけど効果は得られない\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":1,"reviewer":"かいとうひめ","date":"2023-11-03","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RDRX7QCIU7NU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验差"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"可逆的情况很少见","title_orig":"リバーシブルは珍しい","content":"冰冷的感觉！我认为很难找到一款声称具有蓬松一面的双面床垫。\n\n您可以在夏天使用丝滑的一面，在冬天使用蓬松的一面，非常适合日本的季节。特别是最近，已经不清楚什么时候是夏天，什么时候是冬天，所以我认为这个床垫很棒，因为它可以两用。\n","content_orig":"冷感！をうたう商品でまさかもこもこ側もあるリバーシブルな敷きパッドは珍しいなと思いました。\n\n夏はさらさら、冬はふわふわしている側を使えて、日本の季節にぴったりです。特に最近はいつが夏で、いつが冬なのか曖昧になってきているので、どちらにも対応できるこの敷きパッドなかなかいいのではないでしょうか。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"no_name","date":"2023-11-02","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R25EC1043KX3WO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0B4VLTDWB","title":"如果你把冷的一面朝下它就会滑落","title_orig":"冷感側を裏にすると滑る","content":"方便的是，它可以双面使用。面料耐用且睡眠舒适，松紧带相当坚固，因此不会打滑。\n然而，当我将秋冬版翻到外面，冷面翻到背面时，冷面滑动了不少，橡皮筋根本停不下来。床垫的厚度略低于标准值，所以可能是这个原因。这有点麻烦，因为我每天都要纠正错位。我想要橡皮筋上有防滑表面之类的东西。\n","content_orig":"両面使いできるのが便利です。生地も丈夫ですし、寝心地も良く、ゴムバンドも割と強めなのでズレません。\nが、秋冬用を表にして、冷感側を裏にすると冷感側が結構滑ってゴムバンドが全て止まりません。マットレスの厚みは基準値ギリギリなので、その所為かも。毎日ずれを直す必要があるのでちょっと面倒です。ゴムバンドの表面に滑り止めとか欲しいですね。\n","model":"色: ホワイト | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"キメラグラス","date":"2023-10-23","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2601ZI8LAYQWF/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","耐用","厚度","双面可用","不易移位"],"冷感体验":["无匹配标签"],"产品质量":["容易移位"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VDF2KK","title":"时髦的！","title_orig":"おしゃれ！","content":"触感非常好，我喜欢黑色的橡胶！它是双面的，因此您可以根据季节长时间使用它！我很高兴我买了它！\n","content_orig":"とっても手触りが良くて、ゴムも黒いのが良いです！リバーシブルなので季節に合わせて長く使えます！買ってよかった！\n","model":"色: ブラック | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"山本","date":"2023-10-19","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2CPPXRN6BSY2Z/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"看起来不错，感觉很好，睡得也很好","title_orig":"見た目よし、触り心地良し、寝心地よし","content":"看起来就像照片一样。\n接缝也很坚固。\n触感极佳。\n睡起来很舒服（取决于蒲团...）\n","content_orig":"見た目は写真通り。\n縫い目もしっかりしている。\n触り心地最高。\n寝心地も良し(布団による……)\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"白蘭白雪","date":"2023-10-13","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3FHQIRGVXCQ0M/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"蓬松舒适","title_orig":"ふかふか気持ちいい","content":"我是夏天买的。它毛茸茸的，感觉很好。我期待着天气变冷时把它放在另一边。不用根据季节去更换，非常适合我这个懒人。\n","content_orig":"夏に購入しました。ふかふかで気持ちいいです。寒くなったら、反対側にするのが楽しみです。季節で入れ替えしなくていいので、ずぼらな私にはピッタリ。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":4,"reviewer":"福田眞澄","date":"2023-10-10"," した経緯はありますが、肌触りはダントツで良かったです。\n","model":"色: ブラック | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"ORESAMA","date":"2023-09-27","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1SMCSPM08TDEI/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"皮肤感觉良好","title_orig":"肌触りが良い","content":"我是9月份买的，因为睡觉时不开空调，后背会发热，很难入睡，开空调又会有点冷。\n天气好冷啊！给人的感觉更像是一种清凉的感觉。如果长时间呆在同一个地方，清凉的感觉就会消失，但如果稍稍移动一下，回到原来的位置，立刻又会感觉清凉。\n\n我决定购买它，因为它是双面的，可以全年使用，而且因为我使用过其他 GOKUMIN 产品，我对质量很有信心。\n\n另外，我目前使用的是三折床垫，但在我购买该产品之前，我上面有一个多层床垫。然后，三折床垫上的缝隙往往会打开，但该产品将其固定到位，使其睡起来更舒适。我应该早点买的。\n\n附：我用的是凉爽的，因为我喜欢它的感觉，但它似乎与枕套不太相配，而且我睡觉时枕头总是滑落。虽然有一点缺陷，但也在可以接受的范围之内。\n","content_orig":"冷房をつけずに寝ると背中に熱がこもって寝苦しく、冷房をつけると少し寒いと言う状況で九月に入ってからこちらを購入。\nものすごく冷たい！というよりはひんやりとした感じ。ずっと同じ所にとどまるとそのひんやり感はなくなりますが、少しずれて元の位置に戻るとまたすぐにひんやりする感じです。\n\nリバーシブルで通年使える事、GOKUMINの商品を他にも使っており、品質に対して安心感があったことが購入の決めてでした。\n\nまた、今三つ折りマットレスを使っているのですが\nこの商品を買うまではマルチカバーをかけていました。すると、三つ折りマットレスの隙間があきやすかったのですが、こちらの商品でホールドされるので寝心地が良くなりました。早くかえば良かった\n\n追記\n肌触りが好きなので、ひんやりの方を使っていますが、枕カバーとの相性がよくないのか、寝ている間に枕が滑りどんどん上がっていく。という難点がありましたが、許容範囲です。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"ライ麦マフィン","date":"2023-09-25","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R9HH4IE5A249P/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["容易移位"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"又冷又好","title_orig":"冷たくてgood","content":"触碰的那一刻，感觉清凉舒适。布料也很光滑。\n我很高兴我买了它。\n","content_orig":"触った瞬間冷たくて気持ち良いです。生地もサラサラしています。\n買ってよかったです。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"どすざむ","date":"2023-09-18","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1Z6ESTV1J5N6I/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"滑动" 。","content":"我买的是半双人间。其他的都是边短一点，布料薄，但是很蓬松，手感很好。\n考虑到它的成本与其他冷却产品大致相同，我认为这是一件好事。\n","content_orig":"セミダブルを購入しました。他の物は横が多少短かったり薄生地だったりするのですがふかふかしていていい感じでした。\n他の冷感物と同じ位の値段がする事を考えればこれで良かったと思います。\n","model":"色: ホワイト | サイズ: セミダブル | Set name: 敷きパッド単品","star":3,"reviewer":"た","date":"2023-07-29","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RY3RWOVZXZ1YT/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"触感光滑","title_orig":"サラッとした肌触り","content":"摸起来很光滑，感觉很好。\n我喜欢它可以在凉爽的一面和光滑的一面之间翻转，所以你可以根据当天的温度来改变它。\n\n它制作精良，我个人很喜欢它。\n","content_orig":"肌触りが良くサラッとしていて気持ちよかったです。\nヒンヤリとした面とさらっとした面のリバーシブルでその日の気温で替えられる点が良かったです。\n\n作りもしっかりしていて、個人的には気に入りました\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"yuyu","date":"2023-07-28","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RRY95GFZJT0FP/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"我感觉很酷。而且，它很坚固，不会散架。","title_orig":"ヒンヤリしています。且つしっかりしていてよれない","content":"它坚固且舒适。\n","content_orig":"しっかりしていてヨレナイ。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"さちこ","date":"2023-07-25","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1DPBJWXW9SAZO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4V9S4J8","title":"床笠","title_orig":"ボックスシーツ","content":"这是一个非常好的产品，触感很好。\n","content_orig":"肌触りも良くて大変良い品物です。\n","model":"色: ホワイト | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"商品は大変良いものでした。これから使うのが楽しみです。","date":"2023-07-23","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2IWTN3ICD1VUC/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"感觉不错","title_orig":"気持ちいい","content":"这是一个很好的垫子，感觉很好，皮肤感觉很好。\n","content_orig":"肌触りも良く、気持ちの良い良い敷きパットです。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"TOSHI","date":"2023-07-22","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RN1RKUXFLMCJV/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"不冷","title_orig":"冷たくない","content":"与我一直使用的产品相比，钩在垫子上的橡胶一点也不感觉冷。\n","content_orig":"今まで使っていた製品と比較し、全然冷たく感じない\nほぼひんやりしない\nマットに引っ掛けるゴムは取り付け位置、長さが悪くすぐ外れる\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":2,"reviewer":"りょう","date":"2023-07-20","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3MPZRAM6HIXY3/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4V732XH","title":"质地光滑","title_orig":"サラサラの肌触り","content":"这是 N Cool 的替代品。\n我一直在寻找白色的冷却垫并买了这个。我看到了很多蓝色和灰色，但找不到凉爽的白色，所以我决定尝试一下。\n\n最好在使用前立即清洗并干燥。摸起来感觉略凉，但摸起来却很光滑、光滑。睡觉前打开空调降温是个好主意。\n我想如果能使用一年没有问题的话我会再次购买。\n\n夏季使用约 2 个月后的额外印象。\n出现了不少起球现象，光滑粘稠的感觉减少了一半。\n","content_orig":"Nクールからの買い替えです。\n白のヒンヤリパッドを探していて購入しました。青系とかグレー系はたくさん見るけど白のヒンヤリはなかなかないので、ポチッと。\n\n使用前に洗濯後、すぐに乾くのが良いです。触った感じヒンヤリは微妙ですが、サラサラすべすべの肌触りが良い感じです。冷房かけて冷やしてから寝るのが良いでしょうね。\n１年問題なく使えたらまた購入しようかと思思います。\n\n追加\n夏の間2ヶ月くらい使った感想。\n毛玉が結構できて、サラサラスベスベ感は半減しました。\n","model":"色: ホワイト | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"Aimo","date":"2023-07-19","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1ST1O9I50XD2O/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","触感舒适","颜色"],"冷感体验":["冷感体验好"],"产品质量":["起球"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"这不是一种寒冷的感觉。","title_orig":"冷感ではないです。","content":"对于床垫来说，面料厚实且坚固，但因为它坚固，所以我不认为感觉冷。\n相反，每年的这个时候天气都很热。\n我选择GOKUMIN是因为枕头很好，尽管它比其他床垫贵......\n我应该直接买N Cool。\n","content_orig":"敷きパッドとしては厚みがあってしっかりした生地ですが、しっかりしてるが故、冷感ではないと思います。\nむしろ今の時期は暑苦しいです。\nGOKUMINは枕が良かったので、他の敷きパッドよりも高価でしたが選んだけど…\n素直にNクール買えば良かったです。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":3,"reviewer":"waopa","date":"2023-07-18","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3JIA2MKXXRTP0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4V732XH","title":"可正反使用","title_orig":"リバーシブルに使えて良い","content":"很方便，可以用3个季节。清凉感不是很冷，但可能对睡眠有好处。我把它放在床垫上，上面盖了一个棉质床罩，所以效果可能会弱一些，但我感觉不到床的弹簧，而且垫子很好！\n","content_orig":"3シーズン使えて便利ですね、冷感はキョーレツではないですが寝るには丁度良いかも、自分はマットレスの上に引いて、その上に綿のベットカバー引いてるので、その効果は薄いかもですが、ベッドのスプリングを感じなくなり程よいクッションになっています！\n","model":"色: ホワイト | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"しげたま","date":"2023-07-13","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1F1G9TJNWNGJO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"购物愉快","title_orig":"良い買い物","content":"面料结实，有适度凉爽的感觉。我买得很好\n","content_orig":"生地もしっかりしていて、程よいひんやり感です。良い買い物しました\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"しろ","date":"2023-07-12","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RGVJUVLSD3FIT/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"减少冷感","title_orig":"冷感は少ない","content":"买了新垫子后买了这个。\n我用的是N Cool，但清凉感大约是N Cool的一半。一点也不冷。 Nitori 整体上更好，因为它具有与 N Cool 相同的厚度和双面功能。\n质感和颜色都非常好。\n","content_orig":"新しいマットを購入したついでに購入。\nNクールを使用していましたが、冷感はNクールの半分くらい。今一冷たくありませんでした。厚みもリバーシブル機能もNクールにもあるのでトータルでニトリの方がいいです。\n生地感、色味はとても良いです。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":2,"reviewer":"こぐさん","date":"2023-07-10","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2RYMI0V25ZX1T/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"当我洗它时，总会有一些东西随之而来。","title_orig":"洗うともれなく何かがついてくる","content":"如果你用洗衣机清洗，它会沾上灰尘和污垢，可能塞满了填充材料。我是一周洗一次，但是每次都带着，所以每次都洗。我对这一点真的很困惑，但也许我是唯一犯错误的人。其他都很好，摸起来很凉，而且我喜欢这个设计，所以我只是希望它能持续很长时间。\n 【后记】\n大约两个月后，每周清洗一次，神秘的灰尘就消失了。相反，您可以看到一些磨损，但这没关系。\n","content_orig":"洗濯機で洗うとどこからともなくチリのような、ホコリのような、おそらく中綿の材料がぽこぽこ付いてきます。週１回洗いますが、毎回付いてくるので毎回コロコロしてます。この点だけすごくモヤモヤしますが、私がハズレを引いただけなのかもしれません。他は問題なく、接触冷感もあるしデザインも好きなので、あとは長く持ってくれることを祈るのみです。\n【追記】\n2ヶ月ほど週１回洗濯を繰り返していたら謎のホコリは消え去りました。代わりに多少ほつれが見えるようになりましたが、その点はしゃーない。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"はみがき","date":"2023-07-09","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R39UZ0APG4E3NR/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","触感舒适"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VDF2KK","title":"1年是极限吗？","title_orig":"1年が限界かな","content":"使用一年后，它会起球，变得粗糙，摸起来不舒服。\n价格相对其他产品来说有点高，所以性价比不是很好。\n","content_orig":"1年間使うと毛玉ができ、ザラザラで肌触りが悪くなる。\n他の商品と比較すると若干値段高めなので、コスパはあまり良くないかな\n","model":"色: ブラック | サイズ: セミダブル | Set name: 敷きパッド単品","star":2,"reviewer":"伊織","date":"2023-07-08","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R35M2PERF5XJGR/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["起球"],"感官感受":["触感粗糙"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"接触皮肤时感觉凉爽","title_orig":"肌に触れるとひんやりと気持ちがいい","content":"我使用了 Shikipatto，一种四季皆宜的双面降温蒲团，使用了大约两周。\n\n首先，摸起来感觉非常好。由于它是由冷却材料制成的，因此接触皮肤时会感觉凉爽。而且，由于填充物很柔软，所以睡起来很舒服。\n\n这帮助我睡个好觉，尤其是在天气炎热的时候。即使出汗，它也会立即吸收，所以醒来时感觉很好。\n\n另一个好处是它可以在整个季节使用。春季和秋季，使用另一面可获得光滑舒适的感觉。\n\n总的来说，我认为这是一个非常好的产品。它不仅可以在夏季使用，而且可以在所有季节使用，因此非常适合即将到来的季节，值得推荐。 ★5.\n","content_orig":"リバーシブルでオールシーズンで使える冷感布団しきぱっとを2週間ほど使用してみました。\n\nまず、触り心地がとても良かったです。冷感素材が使われているので、肌に触れるとひんやりと気持ちがいいです。また、中綿がふんわりとしているので、寝心地もとても良いです。\n\n暑いときは特に、このおかげで、ぐっすり眠ることができました。汗をかいても、すぐに吸収してくれるので、寝起きも気持ち良かったです。\n\nまた、オールシーズン使えるというのも嬉しいポイントです。春や秋は、反対側を使うと、さらっとした肌触りで気持ち良いです。\n\n総合的に、とても良い商品だと思います。夏だけでなく、オールシーズン使えるので、これからの季節にぴったりで、お勧めします。★5つです。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"でんでん","date":"2023-07-04","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2SXYXR0PQAUPG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["物有所值"]},{"asin":"B0B4VC9WQ1","title":"使用约10个月后的感想","title_orig":"10ヶ月ほど使った感想","content":"我买它是为了做床垫，洗了好几次了，但到目前为止，它还没有变形或散架。\n\n [好点]\n・凉面凉爽舒适，睡起来很舒服・凉面普通面四季皆可使用・普通质感也不错・配有橡胶将其固定在床垫上・可完全水洗\n\n[不好的地方或者更确切地说是注意的地方]\n黑色很酷，但它使灰尘显得很突出。如果实在忍不住要彻底清除家里的灰尘，可以找一款灰色的买一个省心。\n这是凉爽材料的特性，但它不具有良好的透气性，因此如果您重视透气性，请小心。\n","content_orig":"マットレス用として購入\n何回か洗濯してますが、今のところ形が崩れたりボロボロになったりしてません。\n\n［良い点］\n・ひんやり面は冷たくて心地良いので寝心地が良い\n・ひんやりとノーマル面でオールシーズン使用可\n・ノーマルの肌触りも良い\n・マットレスに固定するためのゴム付き\n・丸洗いできる\n\n［悪い点というか注意点］\n黒はカッコイイですが、ゴミが目立ちます。家のホコリとか徹底的に取らずにはいられない人はグレー系のものを探して買ったほうが心穏やかに過ごせます。\nひんやり素材特有のクセですが通気性は良くないので、通気性重視の方はご注意ください。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"SP","date":"2023-07-01","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R16QK1N10S2MXN/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4TVVBQP","title":"这是一个非常好的产品","title_orig":"とても良い商品です","content":"功能上没有问题。\n我家里用的是N Cool Super，感觉一样凉，不过这款其实质地更紧实一些。\n绳子也是黑色的，使它成为一个非常酷的产品。\n感谢您快速而精彩的回复\n","content_orig":"機能面は全く問題ありません。\nNクールスーパーを自宅で使用してますがヒンヤリ具合は同じ、むしろこちらの方が生地がしっかりしている。\n紐も黒でとてもカッコイイ商品です。\n迅速で素晴らしい対応ありがとうございました\n","model":"色: ブラック | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"rara","date":"2023-06-27","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1Z503XYNNMNYD/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"触感凉爽","title_orig":"接触冷感で気持ちいい","content":"夏季即将到来，触感凉爽的床单有助于睡个好觉。\n推荐，因为触感很好\n","content_orig":"これから夏場なので、接触冷感のシーツは安眠を助けてくれる。\n手触りも良いのでおすすめ\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"SeYaN","date":"2023-06-21","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R36N99ZUYENU7G/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4TVVBQP","title":"我输了","title_orig":"損した","content":"摸起来很舒服，但一点也不酷！\n","content_orig":"肌さわりは ええけど なんも ひんやりせん!\n","model":"色: ブラック | サイズ: ダブル | Set name: 敷きパッド単品","star":1,"reviewer":"じゅん","date":"2023-06-18","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RI0KN4BWS03CO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"感觉太完美了。","title_orig":"凄い丁度良い感。","content":"因为“清凉感”这个词，我尝试过很多产品，但一开始都是凉的！感觉很好！不知道是因为太冷了还是因为睡觉的时候把被子拿走了，早上醒来的时候，被子掉下来或者掉在地板上了……感觉花了好一会儿才睡着，直到用了这个才发现。洗头的时间大大缩短了，而且我已经好几次拿着智能手机睡着了（这一点，已经得到证实）我写这篇评论很晚了，但我一直在尝试一些事情，比如不这样做或只是在脚边洗，我的结论是一切都刚刚好。而且，能够轻松洗头非常有帮助（我是一个流口水的人，所以......）\n","content_orig":"冷感という言葉に引かれ数多の商品を試してきておりましたが、、、、最初は冷たい！気持ち良い！と思っていてもイザ睡眠となると寒すぎるのか寝具を寝ている間にどけているのか知りませんが・・・朝起きると取れていたり床に落ちていたりなど散々だったのですが・・・眠りにつく時も時間がかかっていたような気がします、コレを使うまで気付きませんでした、冷感と言えどソコまで冷やさないのがかえって丁度良いのか眠りにつくまでの時間が劇的に短くなりすぎてスマホを片手に何度も寝落ちしました(この時点で確証に変わる)レビューが遅くなりましたがコレをしなかったり足元だけにしたりと色々と実験めいた事をしておりました、結論「全てにおいて丁度良い。」です、あと気軽にお洗濯出来るのも凄く助かります(わりとヨダレを垂らす方なので・・・)\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"やまーま","date":"2023-06-17","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R14BJDDATE8QHU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"比我想象的舒服很多","title_orig":"思っていたよりもかなり快適です","content":"到目前为止，我一直避免使用降温垫，因为我认为它们不会有效，但我最近从 GOKUMIN 买了一张床垫，当我听说 GOKUMIN 发布了一款新的降温垫时，我想我可以用它作为床垫套，即使它在最坏的情况下效果不佳。\n我只使用了几天，但我的睡眠比我预期的要凉爽得多。我确实能感受到清凉的感觉。\n就我个人而言，我对质地很满意，虽然我还没有尝试过，但它是双面的，即使夏天结束后翻过来也可以使用。对于这个价格来说，我认为这是一个非常好的购买。\n\n *因为我没有洗过，所以不知道它干得有多快，所以我给它3星。\n\n 6/19从其他人的评论来看，这可能不是什么新鲜事……？我以为是新的，因为我订购时已经预订了。\n","content_orig":"今まで冷感敷きパッドは「効果なさそう…」と思って敬遠していましたが、つい最近GOKUMINさんのマットレスを買っており、そのGOKUMINさんから新しく冷感敷きパッドが出るということで最悪効果が薄くてもマットレスのカバーと思って使えば良いかと購入。\nまだ数日しか使用していませんが、思った以上に涼しく寝られています。ちゃんと冷感だなぁと実感出来てます。\n肌触りも個人的には満足な質感で、まだ試していませんがリバーシブルで裏返せば夏が終わっても使えてこのお値段ならとても良い買い物をしたかなと思っています。\n\n※洗濯等していないので速乾性だけ不明なので星3にしてます。\n\n6/19 追記\n他の方のレビューを見た限り新しく出たものではないのかも…？注文時に予約となっていたため新しいものだと思い込んでおりました。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"kaneko","date":"2023-06-17","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2J9JOU0Q91S00/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","双面可用"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"提供舒适的睡眠体验。","title_orig":"快適な寝心地を提供します。","content":"我对这个舒适凉爽的床垫非常满意。由于它采用高导热面料，接触皮肤时感觉凉爽宜人。与空调配合使用时，清凉感进一步增加。即使翻来覆去，清凉的感觉依然存在，让您舒舒服服地睡到早晨。\n\n另外，这款垫子是双面的，所以可以根据季节使用。我们在炎热的天气使用凉爽的一面，在春季和秋季使用光滑的桃皮面。只需一件即可长时间舒适地住宿，非常方便。\n\n此外，该垫的重量为200g/m2，吸水性是普通垫的1.5至2倍。它可以很好地吸收盗汗和皮脂，让您保持清洁。\n\n清洗方便，即使弄脏了，也可以立即放入洗衣机清洗。它干燥速度快，因此您可以始终在干净的状态下使用它。\n","content_orig":"この快適冷感敷パッドを使ってみて、非常に満足しています。熱伝導率の高い生地が使われているため、肌に触れると気持ちの良いひんやり感があります。冷房との併用で、ひんやり感がさらに増します。寝返りをしてもひんやり感が持続し、朝まで快適に眠ることができます。\n\nまた、この敷パッドは両面仕様で、季節に合わせて使い分けることができます。暑い時期には冷たい面を使用し、春や秋にはなめらかなピーチスキン面を使用しています。1枚で長く快適に過ごせるので、とても便利です。\n\nさらに、中綿が200g/㎡も使用されており、通常の敷パッドの1.5～2倍の吸湿性があります。寝汗や皮脂をしっかり吸収してくれるので、清潔さを保つことができます。\n\n洗濯も簡単で、汚れてもすぐに洗濯機で丸洗いできます。乾きも早いので、いつも清潔な状態で使用できます。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"じぃ","date":"2023-06-17","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RFZQKY5862IGP/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"它做工精良，我认为如果防汗对您很重要的话，这绝对是一个不错的选择。","title_orig":"しっかりした作りで、汗対策を重視するなら全然アリの選択だと思う","content":"坚固、厚实的冷却垫。虽然大多数夏季衣服都很薄，但它们足够厚，可以吸汗。缝线比较整齐，也比较厚重。\n\n我洗了几次，很快就干了，而且不缩水。有了它，即使在盛夏时节，你也可以毫不犹豫地洗衣服。它是凉爽型的，但面料很厚，所以感觉不是那么凉爽，但如果防汗对你来说很重要，我认为它是一个完美的选择。如果你想让它更酷，你也可以用一些感觉凉爽的东西覆盖它。\n\n就我个人而言，我认为如果您想要坚固的东西，那么选择这家制造商的床上用品就不会出错。这是我最近最喜欢的制造商之一。\n","content_orig":"しっかりした厚みがある冷感敷きパッド。夏用だとペラペラなものが多い中、しっかりと汗を吸収できる厚みがあるタイプ。縫製はきちんとしており、比較的重量もある。\n\n2回ほど洗濯してみたが、はやく乾くし縮むこともなかった。これなら本格的な夏を迎えても気兼ねなく洗濯できる。冷感タイプだが、生地が厚めということもあって、それほどヒンヤリという感じではないが汗対策を重視するなら全然アリの選択だと思う。さらにヒンヤリを求めるなら、冷たさを感じるペラペラなものを上に被せるということもできるだろう。\n\n個人的には、しっかりしたものが欲しければ、このメーカの寝具はハズレが少ないと考えている。最近結構お気に入りのメーカのひとつである。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"ぶい","date":"2023-06-14","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2RJLUDQV2PD25/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","吸湿"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"良好的可逆性","title_orig":"リバーシブルがGood","content":"填充物厚实且坚固，因此似乎不易因使用和洗涤而变形。\n双面均可使用的双面型◎\n一面凉爽光滑，另一面光滑，感觉像毛巾织物，因此您可以根据季节使用它。\n虽然是双人尺寸，但感觉垂直方向比床垫稍长，水平方向比舒适尺寸稍短。\n","content_orig":"パッド厚がありしっかりした作のため、使用や洗濯による形崩れに強そうです。\n裏表使えるリバーシブルタイプが◎\n片面はひんやり冷たくツルツル、片面はタオル生地っぽいサラサラな感じで、季節により使い分け出来ます。\nダブルサイズですが、縦方向はマトレスよりやや長め、横方向はジャストサイズより若干短い感じでした。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"JAPAN","date":"2023-06-13","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3V75MDDDHK05E/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"它是双面的，因此可以在所有季节使用。","title_orig":"リバーシブルなのでオールシーズン使える。","content":"蓬松且略厚的床垫。正面为柔软材质，背面为散热材料，因此两者都可以使用。夏天可以享受清凉，冬天可以睡得蓬松。虽然现在虽然是在炫耀冰冷的感觉，但是睡在上面真的很舒服。拥有一个可能是个好主意，因为它可以全年使用。坯布有一种别致的气氛。很高兴看到更多颜色可供选择，包括自然色。\n","content_orig":"ふわふわした少し厚手の敷パッド。これ、表は柔らか、裏側は冷感素材で、両方使えるのです。夏はひやひやを楽しめるし、冬はふわふわで眠れます。今は冷感の方を表にしてますが、凄く寝心地よいです。1年中使えるので1枚あるといいかも。グレージュはシックな雰囲気。ナチュラルカラーなど、色の展開が増えていくとまた嬉しいですね。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":4,"reviewer":"mofusumi","date":"2023-06-09","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2FQV8EQ4ONPHW/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"在即将到来的赛季中","title_orig":"これからの季節に","content":"皮肤感觉很好，完全没有刺痛感。\n这种面料摸起来很凉爽，所以我认为它在接下来的季节里会很有用。\n然后我睡觉的时候就穿轻便的衣服，但是这个产品不刺痛，这非常有帮助。\n\n这种颜色非常好，因为污垢不明显。\n它也很方便，因为它是双面的，因此您可以双面使用。\n\n边缘和表面的缝合都非常紧密。\n我认为它是精心构建的。\n","content_orig":"肌触りがよく、チクチクするような部分がまったくないので、とても気分がいい。\nひんやり感じる生地なので、これからの季節さらに活躍してくれると思いますが、\nそうすると寝る時に薄着ですが、この製品はチクっとしないのでとても助かる。\n\nこの色は、汚れが目立たないという意味で、とてもすぐれている。\nまた裏表使えるリバーシブルなので便利。\n\n縁取りも表面も縫製が非常にきっちりしていて、\n丁寧に造られていると思う。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"いと","date":"2023-06-09","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RQN9JH6GPMD09/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"背面光滑湿润，适合夏季使用","title_orig":"サラサラ夏用しっとり裏面","content":"我一到就洗了。它比我想象的要厚，但3-4小时内就干了，所以我当天就用了。夏季双面面光滑又冰凉！没那么糟糕，但摸起来很柔软，我可以睡得很香。我的猫不再坐在蒲团上，因为它不喜欢凉爽的感觉。似乎能缓解盛夏睡眠的不适。背面摸起来湿润，感觉适合秋季和春季。我还喜欢四个角上的橡胶与主体颜色相同。\n","content_orig":"来て直ぐに洗濯しました。思ったより厚みがあるのですが３～４時間程で乾いていたのでその日に使用しました。リバーシブルの夏用側はサラサラしていて、冷たい！程では無いですが肌触りはとても良く熟睡できます。ひんやり感を嫌がり飼い猫が布団に乗らなくなりました。真夏の寝苦しさの解消になりそうです。裏側は触るとしっとりしていて秋と春用な感じです。四隅のゴムも本体と同じ色なのも気に入りました。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"たま","date":"2023-06-08","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R38PO8PKUL9B4B/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"恰到好处的凉爽，让您睡得舒适","title_orig":"ほどよき冷感で寝心地よし","content":"对于那些在天气太冷时难以入睡的人，我们强烈推荐这款降温垫。\n正如产品说明中所述，该面料采用独特混纺工艺，触感光滑。\n可以明显感觉到清凉的感觉，但是垫子是蓬松的，所以感觉刚刚好。\n背面有一种被称为桃皮绒的柔软触感，看起来四季皆宜。\n我认为这款垫子有多种尺寸和颜色可供选择，这样您就可以根据自己的喜好进行搭配，这真是太棒了。\n","content_orig":"冷たすぎると逆に寝付けないという方にぜひオススメしたい冷感敷きパットです。\n商品説明にあるように独自ブレンドされたという生地はサラサラと手触りが良いのが印象的です。\n冷感ははっきりと感じますがパッドのふかふかもあるのであくまで程よくといった感じになります。\n裏側はピーチスキンと言われる柔らかさのある手触りでオールシーズン対応できそうです。\nこの敷パットはサイズやカラーバリエーションもあって好みに合わせられるのがスゴく良いと思いました。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"ノビノビ","date":"2023-06-05","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3SATBQE9VDS3J/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"它不太凉，也不太薄，因此很容易入睡。","title_orig":"ひんやりしすぎない、ペタっと薄くないので寝やすい","content":"我的第一印象是它是一块坚固的垫子。\n不薄不薄，但也不太厚。\n缝线很牢固，给我的第一印象非常好。\n我不认为这太酷了。\n我觉得这个量刚刚好。\n我想你可能想要在仲夏时节吃点凉爽的东西。\n当我开着空调睡觉时，我感觉更凉爽，所以我认为这个量刚刚好。\n它也可双面使用，因此您可以在多个季节使用它。\n它很受欢迎，因为它可以让对热敏感的孩子更容易入睡。\n","content_orig":"第一印象は、しっかりした敷きパッド、という感じでした。\nペラペラと薄くなく、でも厚すぎず、\n縫製もしっかりしていて第一印象がとてもよかったです。\nあまりひんやりしすぎないと思います、\nこのくらいがちょうどいいかなという感じ。\n真夏だともしかしたらもう少しひんやり感が欲しくなるかなとも思いますが、\n冷房をつけて寝るとなるとひんやり感も増すので\nこのくらいがちょうどいいと思っています。\nリバーシブルで使えるので、長いシーズン使える点も助かります。\n暑がりな子どもたちにも寝やすいと好評です。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":5,"reviewer":"レオママ","date":"2023-06-05","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2ZBFMWML7KVY6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","厚度","双面可用"],"冷感体验":["冷感体验差","冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"我喜欢它是可逆的","title_orig":"リバーシブルなのが良い","content":"很棒的是，这一件可以冷热两用。\n到目前为止，我每年夏天都会购买浅蓝色的降温床单，但从现在开始，我想我只需要一张。\n\n相当厚实，对于睡眠舒适度有很好的效果。\n\n触感也很舒适。\n","content_orig":"これ一枚で冷温両対応なのが良いです。\nいままでは夏になると水色の冷感シートを買ったりしていましたが、これからはこれ一枚で済みそうです。\n\n厚みがそれなりにあって、寝心地にいい意味で作用して良いです。\n\n肌触りも心地よいです。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"abc","date":"2023-06-04","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1KTQSVTZLVZJL/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","触感舒适"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"光滑舒适","title_orig":"さらさらで気持ちいい","content":"它包装得很紧凑，所以我不得不费点力气才把它从包里拿出来。我没有注意到任何气味，所以我直接使用它。\n它有点厚，摸起来光滑舒适。\n当我把它从袋子里拿出来，在风中吹一会儿时，我就能感受到凉爽的效果。我的皮肤感觉很好，我睡得很香。\n我将它与大约 20 厘米长的床垫一起使用，随附的橡胶将其正确固定到位。如果床垫较厚，这可能会更困难。\n","content_orig":"けっこうコンパクトに梱包されていますので、袋から出すのは力を入れました。匂いとかは感じなく、そのまま使いました。\n少し厚みがあり、触り心地はさらさらで気持ちいいです。\n袋から出して、しばらく風に当たると冷やし効果を実感できました。肌触りもよく、ぐっすり寝ました。\nうちは20cmくらいのマットレスで使っていますが、ついているゴムでちゃんと固定できました。さらに厚みがあるマットレスだと難しいかもしれません。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":4,"reviewer":"ケイコ","date":"2023-06-04","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R18B2MFPNOS9CX/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"全年均可使用。","title_orig":"1年中使えます。","content":"我很不好意思地说，我并没有真正理解床垫和床垫之间的区别。\n床垫放置在床垫和床单之间。\n据说床垫垫放在床单上面。如果你问我的话，这是有道理的！就是这样的感觉。\n\n本产品放置在床垫和床单上，因此可以直接与皮肤接触。\n因此，我们将这款产品做成双面的，一侧是凉爽的，另一侧是温暖的桃皮绒，使其一年四季都可以舒适使用。\n这是一个想法。\n您不需要两件，一件夏天一件冬天，因此可以节省衣柜空间。\n\n虽然用起来很舒服，\n冷却表面由光滑的织物制成，接触皮肤时感觉有点冷。\n如果睡前用空调给房间降温，会感觉更凉爽。\n不过，整晚都不会冷。我认为任何制造商的凉爽夏季垫都是一样的。\n\n另一面的桃皮面没有那么长的一堆。\n但我认为即使不是隆冬，它也比那舒服。\n\n床垫的厚度不是特别蓬松，感觉就是普通床垫的厚度。\n","content_orig":"敷パッドとベッドパッドの違い、恥ずかしながらよくわかっていませんでした。\nベッドパッドはマットレスとシーツの間に、\n敷パッドはシーツの上に敷くのだそうです。言われてみればなるほど！という感じですね。\n\nこちらの商品は敷パッド、シーツの上に敷くので直接肌に触れます。\nそこで片面は冷感、反対側はピーチスキンで暖かく、とリバーシブルにして、1年中快適に使えるようにした商品です。\nこれはアイデアですね。\n夏用冬用と2枚要らないので押し入れも省スペースになるし。\n\n使い心地ですが、\n冷感面はツルツルな布地で、肌に触れた時に少しヒヤッと感じます。\n寝る前にクーラーで部屋を冷やしておくと、もっと冷たく感じます。\nただ、一晩中ずっと冷たいわけじゃないです。それはどのメーカーの冷夏パッドでも同じと思います。\n\n反対側のピーチスキン面は、それほど毛足の長さはありません。\nでもそれくらいの方が、真冬じゃない時にも快適に過ごせると思います。\n\nパッドの厚みは特にふかふかというほどではなくて、一般的な敷パッドの厚さという感じでした。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"くるみ","date":"2023-06-04","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RV2FM1KZ0IRZ8/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","厚度","双面可用"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"是冷的。","title_orig":"冷たさあります。","content":"感觉很冷。\n布料很结实，缝线也很好。\n我很欣赏它是双面的并且适合所有季节。\n垫子上还有一根绳子，可以防止垫子打滑。\n而且，触感非常好。\n\n这是一个附加评论。\n我已经使用它一个多星期了。\n冰冷的感觉还在持续。\n正如预期的那样，摸起来感觉非常好。\n我认为这是一个非常好的产品。\n","content_orig":"冷感感じますね。\n生地もしっかりしており、縫製も良いですね。\nリバーシブルで使用できオールシーズン対応はありがたい。\nマットの止めひももありずれ防止なります。\nあと、手触り感もとてもよいです。\n\n追加の感想です。\n一週間以上利用してきました。\n冷たい感触はばっちり継続しております。\nやはり、肌触りがとてもいいですね。\nとても良い商品だと思います。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"Amazon fuji","date":"2023-06-04","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2CPUWZKT77JNE/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"可双面使用，可长期使用","title_orig":"リバーシブルなら長く使える","content":"我点的是[灰色]，是一种不浮夸、不朴素、沉稳的颜色。\n凉爽的床单是6月到10月使用的，蓬松的床单是11月到12月和4月到5月使用的，所以我认为在隆冬使用它会太冷。\n\n固定加固橡皮筋与座椅颜色相同，可正反使用，不会出现橡皮筋奇怪脱落的情况。我还是第一次看到固定的加固橡皮筋和座椅颜色一样。\n","content_orig":"【グレージュ】を注文しましたが派手でもなく殺風景でもなく落ち着く色合いです。\nひんやり冷感シートの方は6月～10月　ふわさらシートの方は11～12月・4～5月位の使用で真冬使用には寒いかな・・・と思いました。\n\n固定強化ゴムバンドがシートと同色のためリバーシブルで使用しても変にゴムバンドがうくことなく使えます。固定強化ゴムバンドがシートと同色なのは初めて見ました。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"3本のちゅ-りっぷ","date":"2023-06-03","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3NBJTUUIX1LM3/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"从戴上的那一刻起，感觉就完全不一样了~~~✨","title_orig":"敷いた瞬間から『全然違う~~~✨』","content":"正如标题所示，从我戴上它的那一刻起，我就知道它与周围其他护垫不同！\n它做工精良，剪裁质量很高。\n又厚又硬！它的质感很好，而且是双面的，所以两面都做工非常好。它看起来不像是双面的，这是常见的，但每件都是以专业的方式制作的。\n\n因为最近一直在蒸，所以一直用的是那种摸上去有清凉感的，丝般顺滑，凉凉的很。\n\n如果您在房间内使用风扇产生微风，床单将始终保持凉爽。\n\n我真的睡着了，好入迷，“最好了~~~✨”\n (≧∇≤)\n\n然而，我担心的一件事是，我希望固定橡胶更宽一点，这样会更深地嵌入床垫。\n\n我最近使用的床垫垫的橡胶垫之间的空间稍大一些，而且无论我如何尝试在蒲团上使用它，它都足够坚固，根本不会滑倒或掉落。这个的抓地力稍浅，所以我认为它不能用在较厚的蒲团或床垫上。\n我以为这是唯一有点令人失望的地方，但除此之外，它确实是最坚固的床垫！ ？这是一个非常棒的产品✌️\n","content_orig":"タイトル通り敷いた瞬間から\nそこら辺の敷パットとは別物だと見てわかりました！\nとても しっかり出来ていて仕立ても上等です✨\n厚みもあって 張りのある しゃん！っとした生地感  リバーシブルということで 両面本当にしっかりと作られてます よくあるとりあえずリバーシブルみたいな感じでなくて それぞれが本格的な作りです。\n\n最近蒸すので接触冷感の方を使ってますが ツルしっとりで穏やかにひんやりとします\n\n室内にファンで軽く風を起こした状態で使うと常にシーツがひんやりしてていいですね︎👍🏻\n\n本当に寝ていて『最高~~~✨』っとうっとりしてます\n(≧∇≦)\n\nただ　ひとつ気になるのは固定のゴムがもう少しぐっと、深く敷布団に、食い込むくらいに幅があったらなっと思いました\n\n直近で使っていた敷きパッドはゴムの間隔がもう少し広くとってあって どんだけ布団の上で暴れても全くずれたり外れたりしない強者だっただけに  これはかかりが少し浅いのでちょっと厚みのある敷布団やマットレスには使えないかと思います。\nそこだけがちょっと残念かなっと思いましたが それ以外な、本当に最強敷きパッドかよ！？ってくらい素晴しい商品でした✌️\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"肉子","date":"2023-06-02","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3LOVYG6UQYHW6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","双面可用","高级感","不易移位"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"寻求清凉感觉的人可能不会满足","title_orig":"冷感を求めている人は物足りないかも","content":"我用它来防止睡前不适。\n你的背部会变得很热，而且你会翻来覆去，这会让你的眼睛变冷，所以凉垫是这个季节的必备品。\n\n ■优点 质地光滑，摸起来很舒服，垫子的厚度也恰到好处。\n许多冷却垫都很薄，给人一种脆弱的印象，但从好的方面来说，没有达到我的期望。\n它的透气性似乎出奇的好，所以即使是阴天，我也是早上晒干，晚上就干了。\n至于清凉感的程度，大约是5分中的4分，这意味着还不算太冷。\n\n ■我的发现：Nitori的垫子推荐给那些寻求深层清凉感觉的人。\n不过我觉得这款产品无论是清凉感、质感、透气性等综合评分都非常高，所以我觉得很难找到什么抱怨的地方。\n","content_orig":"就寝時の寝苦しさを防ぐために使用しています。\n背中が熱をもって寝返りが多くなり目が冷めてしまうのでこれからの季節は冷感敷きパッドはかかせません。\n\n■良かった点\n肌触りがサラサラしていてとても気持ちよくさらにマットの厚みがちょうどいいです。\n冷感マットは薄いものが多くペラペラしている印象だったのですがいい意味で期待を裏切られました。\n意外と通気性もいいみたいで曇の日でも朝干していると夕方には乾いていました。\n冷感の度合いですが5段階中の4ぐらいで冷たすぎないという感じです。\n\n■気になった点\nガッツリと冷感を求めている人はニトリのマットのほうがおすすめです。\nですがこの製品は冷感、肌触り、通気性などの総合点がとても高いという印象で使っていて不満点が出づらいかと思います。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"HRS","date":"2023-06-02","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R35GB5FWB8OBZ9/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","厚度","触感舒适","高级感"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"它不一定是蓬松的。","title_orig":"フカフカでなくていい。","content":"这三天，我睡觉的时候都能感觉到自己出汗，所以感觉冰凉，吸湿排汗，快干。\n我把它换成了这个有很多填充物的物品。凉爽的一面朝上。\n\n我还有另外两块散热垫，但是散热质量比另外两块要差一些，不过较厚的一块吸湿性更好，干燥也快。 （还不知道快干）\n因为它更厚，所以它会下沉并增加与皮肤的接触面积，当天气很热时，这可能会让人不舒服。\n","content_orig":"この三日ほど就寝中に寝汗かいてるのが分\nかるほどだったので、”冷感、吸湿速乾\"\nで中綿の多い本品と交換。冷感側を上に。\n\n他二枚冷感パッド持ってますが、ひんやり\n間は他二枚に譲りだけど、厚い分吸湿速乾\nの吸湿は良さげ。(速乾はまだ分からず)\n厚みがある分、沈み込みで肌との接触面が\n増えるので、それが暑い時にはヤな感じ。\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"正信偈","date":"2023-06-02","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R19QI45PGEJ1WD/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"豪华衬垫","title_orig":"高級感のある敷きパット","content":"起初，我很惊讶地发现它装在一个如此高品质的盒子里，我简直不敢相信它里面有一个垫子。\n触感很好，使用起来很舒服。\n","content_orig":"最初敷きパットが入っているとは思えないほどの高級そうな箱に入っていてびっくりしました。\n肌触りが良く使い心地は良かったです。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"くま","date":"2023-06-01","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/RN0GHRVOW3MDZ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"一年四季都可以使用的垫子","title_orig":"年中使える敷パッド","content":"在炎热的天气里它可以用作冷却垫，在其他时候可以用作蓬松的垫。\n皮肤感觉良好且舒适。\n我也用床垫，刚刚好，很舒服。\n","content_orig":"暑い時期には冷感パッドとして、それ以外にはふんわりなパッドとして利用可能。\n肌触りもよく、快適です。\nベットマットも使用していますが、ちょうど揃って快適です。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"Amazonレビュアー","date":"2023-06-01","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R25PAYFUFGX9NO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"可在凉爽面料和桃皮绒面料之间翻转","title_orig":"冷感生地とピーチスキン生地とのリバーシブル","content":"这款床垫采用绗缝设计，具有恰到好处的缓冲效果。它是双面的，具有光滑的冷却面和哑光桃皮面，因此您可以根据季节使用正面和背面。当你直接触摸冷却表面时，触感绝对凉爽，看起来对即将到来的季节很有好处。它缝制得很好，看起来可以用很长时间。\n","content_orig":"キルティング加工され、程良いクッション性があるベッドマットです。すべすべした生地の冷感面と、マット感のある生地のピーチスキン面とのリバーシブルで、季節で表裏を使い分けることができます。冷感面に直接触れると確かにひんやりとした触感で、これからの季節に良さそうです。縫製もしっかりしていて長く使えそうです。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":5,"reviewer":"アルタイア","date":"2023-06-01","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R11WKTXRP063HP/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W3QJ1K","title":"这是一款四季皆可使用的床垫。","title_orig":"オールシーズン使える敷きパッドです。","content":"【感想】\n双面床垫夏天触感凉爽，秋季到春季桃皮面触感温暖，适合所有季节使用。\n虽然我认为全年持续使用它的能力是一种优势，但与专门为夏季使用设计的产品相比，我认为它的性能较差。\n\n 【弱点】\n - 夏天时，我使用Q-Max值为0.469的床垫，但与本产品（Q-Max值为0.35）相比，触感清凉感有明显差异。\n・当我们将睡眠舒适度与专为夏季设计的产品进行比较时，我们发现长时间使用该产品容易积热。 （我觉得不是凉凉的问题，而是透气吸湿的问题。）\n","content_orig":"【感想】\n夏場は接触冷感面でひんやり、秋から春はピーチスキン面で暖かなリーバーシブルな敷きパッドで、オールシーズン使えます。\n年中使い続ける事ができる点は強みだと感じた一方、夏用に特化した製品と比較すると性能面では負けると感じました。\n\n【弱み】\n・夏場私はQ-Max値0.469の敷きパッドを利用していますが、この製品（Q-Max値0.35）と比較すると、冷感は触って即分かるレベルで差がありました。\n・夏場に特化した製品と寝心地を比較したところ、この製品を長時間利用していると熱がこもりやすい事が分かりました。（接触冷感の問題ではなく通気性や吸湿性といった側面の問題と思います。）\n","model":"色: グレージュ | サイズ: セミダブル | Set name: 敷きパッド単品","star":4,"reviewer":"あめ","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3EKTQ3NHCPTUA/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"一款可让您在凉爽触感和光滑触感之间进行选择的床垫。","title_orig":"接触冷感とサラ感の両方が選べる敷きパッド","content":"它是双面型，一侧是触感凉爽的凉垫，另一侧是触感光滑的光滑垫。\n两者的皮肤触感都很好，而且能够根据季节和心情选择一款很有趣（尽管这款垫子在冬天很难使用）。\n\n顾名思义，摸起来感觉冰凉，但如果长时间保持同一个位置，就和普通垫子没什么区别了。在这种情况下，您可以通过翻身或稍微移动身体到不同的位置来再次体验凉爽的感觉。\n垫子很厚，填充物充足，让您睡得舒适。\n\n它的质地光滑舒适，一旦使用就爱不释手。\n","content_orig":"リバーシブルタイプで、片面は接触冷感のひんやり系、もう片方はスベスベ触感のさらさら系の敷きパッドです。\nどちらも肌辺りが良くて季節や気分によって自由に選ぶ事が出来るのが楽しいですね(流石に冬場にこの敷きパッドは厳しいですが)。\n\n接触冷感の名の通り触った時は冷たく感じますが、ずっと同じ位置にいると普通の敷きパッドと変わりありません。そういう時は寝返りを打ったり別の場所に体を少し移動させたりするとひんやり感を再び味わえます。\n中綿もしっかりある厚みのある敷きパッドなので気持ち良く就寝出来ます。\n\nスベスベとした肌触りも気持ち良いので、一度使うと手放せなくなります。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"DukeDog","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R831AW71WCPNP/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"作为床垫，它的硬度和蓬松感之间有着很好的平衡。","title_orig":"敷きパッドとして硬さのバランスとフカフカ感が良い。","content":"当我实际尝试使用它时，我发现它比其他提供许多其他评论者所说的“织物感觉”的产品更蓬松。\n另外，它是双面的吗？背面的凉爽面料很硬吗？我认为这很顺利而且很好。\n\n我担心的是，我不确定是否应该称其为网状缝合，但线太细了，如果钉子卡在里面，它看起来就会松开。\n它可能有点粗糙，但我使用它没有任何问题。\n\n至于降温灵敏度，感觉不太冷，要么是因为蓬松的手感，要么是因为它很容易积聚热量，但与其他散热垫相比，在几十秒内很难感觉到寒冷，所以我认为这不是一个大问题。我觉得如果睡眠舒适度很重要，那是个好主意。\n","content_orig":"他レビュワー様の多くが言う「生地の感触」を実際に使用してみて\n他の販売品より「フカフカ感」が確かに感じられますね。\nそしてリバーシブルタイプで裏面の冷感生地は硬さがあるのかな？と思いきやサラサラ感で良し。\n\n気になる点としては網目縫と言ったらいいのか不明だが「糸が細い」ので爪が引っかかると解けそう。\nちょっと荒いかもしれませんが使用上は問題なかったです。\n\n冷感度に関してもフカフカ感のせいか熱が籠りやすいのか冷感度は感じづらさはありましたが\n他の冷感パッドと比較しても数十秒で冷たさは感じづらくなるので大して問題にはならないかと思います。寝心地を重視するなら良かったと感じました。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":4,"reviewer":"president NATU","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1BMLZHTQZF02X/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适","触感粗糙"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"制作得非常仔细！","title_orig":"凄く丁寧に作られています！","content":"双面是最好的♪夏天很光滑！春天和秋天是另一种蓬松！冬天有盖毯子吗？就是这样的感觉。夏天干燥的一款有清凉的感觉，另一款有微暖的感觉，都很舒服♪\n橡胶伸展性好，没有难闻的气味，使用方便。\n附带日语使用说明书。\n","content_orig":"リバーシブルが最高です♪夏はサラサラの面で！春、秋はもう片方のふわっとで！冬はこの上に毛布かな？って感じです。夏のサラサラは冷感が有ります、もう片方は少しだけ温かみが有ります、両方とも快適です♪\nゴムの伸び具合も良く、嫌な匂いも無く、使用しやすいです。\n日本語説明書付きです。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"boroty","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/REEHY730C2NO3/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"可长期使用","title_orig":"シーズン長く使えます","content":"这些GOKUMIN系列睡衣的质量和手感都非常好，我已经使用了很长一段时间，但这是我第一次体验床垫。\n我对GOKUMIN的床上用品非常满意，所以我是抱着很高的门槛写这篇评论的，但最终我还是非常满意的。\n\n首先，它是双面的，而且背面和正面由不同的材料制成，因此您可以在整个季节长时间使用它。\n我在冬天使用不同的床垫，所以我认为它可以从春天到秋天使用。\n对于那些只想要凉爽感觉的人来说，凉爽床单可能比双面床单更好，但对于那些想要长时间使用但即使在夏天也想感觉适度凉爽的人来说，我认为这款产品是最好的选择。\n","content_orig":"こちらのGOKUMINシリーズのパジャマの品質や肌触りが非常に良く、ずっと愛用していますが敷きパッドは初めての体験です。\n自分のなかでGOKUMINの寝具は非常に満足度の高い商品でしたので、ハードルが高い中でのレビューとなりますが、結果としては大満足でした。\n\nまずリバーシブルにでき、裏と表の素材が異なるのでシーズン通して長く使うことができます。\n冬場はまた違う敷きパッドを敷くので、春から秋ぐらいまでは使用できそうです。\n涼感のみを求める方はリバーシブルより涼感シートの方がひんやり感は上かもしれませんが、長いシーズンを使用したいが夏でも適度な涼を味わいたい方はこの商品一択かなと思います。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"アマゾンカスタマー","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3DEFFK1CPAG4K/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感","双面可用","触感舒适"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W2GMGJ","title":"适合所有季节的双面垫","title_orig":"リバーシブルでオールシーズン使える敷きパッド","content":"桃皮绒材质的双面双人床垫，适合四季使用，材质表面触感凉爽，适合夏季使用，床单光滑。有许多一侧具有清凉感的护垫，但很少有一种是双面的。它具有沉稳的坯色，两面都有精细的缝线，因此填充物不会移位，表面也平整。它使用大橡皮筋固定，因此即使在厚床垫上也很容易固定。我认为这是一个非常精心制作的床垫。\n","content_orig":"ダブルサイズの敷パッドで夏用の接触冷感素材面とサラサラしたシーツなどによく使われるオールシーズン向けのピーチスキン素材のリバーシブル。片面接触冷感の敷きパッドは多いけどリバーシブルで使えるものは珍しいかも。落ち着いたグレージュカラーで両面共細かくステッチがはいっているので中綿がズレず表面がきれいにフラットな状態になっています。装着は大き目ゴムバンドなので厚みのあるマットレスでも簡単に装着できました。とても丁寧につくられている敷きパッドだと思います。\n","model":"色: グレージュ | サイズ: ダブル | Set name: 敷きパッド単品","star":5,"reviewer":"カスタマー","date":"2023-05-31","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3MTN62JS9H5K6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["冷感体验好"],"产品质量":["容易移位"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0C5W17RHB","title":"背面很微妙","title_orig":"裏側は微妙","content":"正面的凉面感觉相当凉爽。\n如果你睡一会儿，它会变暖，但如果你移动到一个没有接触过的地方，它就会再次变冷。\n背面感觉有点不太满意。\n这种面料不像蓬松的毛巾，而是像普通的布料，所以与正面唯一的区别是感觉不冷。\n背面可能适用于春季和秋季，并且可能会要求您在冬季使用另一面。\n它可以用作普通床垫，没有任何问题，但背面有点令人失望。\n","content_orig":"表のひんやりする方はそれなりにひんやり感があります。\nちょっと寝てると暖かくなってしまいますが、触れてない所に動けばまたひんやりします。\n裏側はちょっといまいち感があります。\nふわふわのタオルみたいなのではなく普通の布みたいな生地になっているので、表との違いはひやっとしないだけという感じです。\n裏側は春秋用で冬はまた別のを使ってくださいという事なのかもしれません。\n普通に敷きパッドとして問題無く使用できますが裏側はちょっと期待外れでした。\n","model":"色: グレージュ | サイズ: シングル | Set name: 敷きパッド単品","star":3,"reviewer":"moulton","date":"2023-05-30","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3GNLAT5DJR10X/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["冷感"],"冷感体验":["冷感体验好"],"产品质量":["无匹配标签"],"感官感受":["触感舒适"],"价值体验":["无匹配标签"]},{"asin":"B0B4VLTDWB","title":"光滑的","title_orig":"サラサラ","content":"我用它作为床垫。我觉得春天和初夏比较适合。仲夏还在这里，所以我想看看它进展如何。\n","content_orig":"マットレスのパッドとして使っています。春から初夏には良いと思います。真夏はまだこれからなのでどうなのか様子を見ていきたいです。\n","model":"色: ホワイト | サイズ: シングル | Set name: 敷きパッド単品","star":3,"reviewer":"なーな","date":"2023-05-29","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3A1G8DZ1KLJDG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"天气没有我想象的那么冷","title_orig":"思っていた以上にひんやりしない","content":"Nitori 的 N Cool（灰色）更酷。驯服☆-1\n床垫上的图案没有缝好，已经松开了。驯服☆-1\n光滑的感觉是正常的，所以没有其他问题。\n","content_orig":"ニトリのNクール（グレー）のほうがひんやりする。ため☆-1\n敷パッドの模様がきちんと縫われておらず、ほどけていた。ため☆-1\nサラサラ感は普通にあるため、その他については特に問題無し。\n","model":"色: ブラック | サイズ: シングル | Set name: 敷きパッド単品","star":3,"reviewer":"塩田 衛","date":"2023-05-22","link":"https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2ZMCN14O86J1C/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8","使用人群":["自用"],"使用期望":["无匹配标签"],"冷感体验":["无匹配标签"],"产品质量":["无匹配标签"],"感官感受":["无匹配标签"],"价值体验":["无匹配标签"]},{"asin":"B0B4VC9WQ1","title":"产品本身就给人留下了很好的印象！","title_orig":"製品その物は好印象！","content":"躺在上面感觉很舒服。干得很快，所以即使在雨天也可以使用 ;

const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- build all cards ----------
renderStats();

makeCard(document.getElementById('gridTop'), {
  id:'chartStar', title:'星级分布', dim:'star',

</script>
