我不能把它放在床上，因为这是一个单间房间，我可以看到床。\n我很失望\n", "content_orig": "届いてすぐ洗濯をしてベランダに干したら同色の糸のかたまり？の様なものが何十個も落ちてきてびっくり！虫かと思いました\nベッドにセットしたところシワがひどくクシャクシャ…ワンルームなのでベッドが見えるため敷いておけません。\nガッカリでした\n", "model": "色: ダークグレー | サイズ: セミダブル・120X200cm", "star": 1, "reviewer": "taku", "date": "2026-08-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/srp/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["颜色"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07R68TQPF", "title": "【质感极佳，不起球！ ] 由 100% 棉制成，全年舒适，非常适合床垫和蒲团", "title_orig": "【肌触り抜群＆毛玉ゼロ！】綿100%で年中快適、マットレスにも敷布団にもピッタリ", "content": "[概述]\n我买的是半双人床床垫，它是五星级的，没有任何抱怨。\n给我印象最深的是面料的质感和耐用性。由100%纯棉制成，触感非常柔软光滑，并且具有出色的吸湿性和透气性，让您一年四季都能舒适睡眠。我已经洗过很多次了，一点也不起球，而且面料仍然很坚固。深层衬料和全方位松紧带提供紧密贴合感，使其成为日常使用的完美床笠。\n [优点]\n完全不起球且高度耐用：不存在聚酯混纺片材出现的“起球”压力。越洗越能融入肌肤，可以长期使用。\n 100%纯棉，温和呵护裸露肌肤：没有化学纤维的噼啪或闷热感，质地光滑温和，即使接触裸露肌肤也非常舒适。\n合身且易于穿脱：非常适合 120 x 200 厘米的小双人床尺寸。四周都有橡胶，只要戴上就可以固定，即使翻身也不会滑落。\n深海军蓝：沉稳优雅的海军蓝给人一种奢华的感觉，增添了房间的气氛。\n [什么引起了我的注意（如果我不得不这么说的话）]\n洗涤后起皱：由于100%纯棉的天然特性，洗涤后容易出现一点起皱。晾干时，既可以轻轻拍打定型，然后挂起来晾干，也可以牢牢地放在床垫上，不会打扰您。\n [给买家的建议]\n我们绝对向那些正在寻找不会起球的床单或想要对皮肤温和且吸汗的 100% 纯棉床单的人推荐这些！\n它非常易于使用，因为它不仅适用于床垫，还适用于厚床垫。海军蓝是一种不易显脏的流行颜色，因此如果将两件放在一起清洗，您将始终能够干净舒适地使用它们！\n", "content_orig": "【総評】\nセミダブルのマットレス用に購入しましたが、文句なしの★5です。\n一番感動したのは生地の質感と耐久性の高さです。綿100%なので肌触りがとても柔らかくサラッとしており、吸湿性・通気性が抜群で1年を通して気持ちよく眠れます。何度も洗濯していますが毛玉が全く発生せず、生地もしっかりしたままなのが素晴らしいです。深めのマチと全周ゴムでフィット感も高く、日常使いのボックスシーツとして完璧な仕上がりです。\n【良かった点】\n完全毛玉なし＆高耐久: ポリエステル混のシーツにありがちな「使っているうちに毛玉ができる」ストレスが一切ありません。洗うほどに肌に馴染んで長く使えます。\n素肌に優しい綿100%: 化学繊維のようなパチパチ感や蒸れ感がなく、サラッとした優しい肌触りで素肌に当たってもとても快適です。\nフィット感と着脱のしやすさ: 120×200cmのセミダブルサイズにジャストフィット。全周ゴム仕様なのでかぶせるだけでセット完了し、寝返りを打ってもズレにくいです。\n深みのあるネイビー: 落ち着いた上品なネイビーカラーで高級感があり、お部屋の雰囲気もぐっと引き締まります。\n【気になった点（あえて言うなら）】\n洗濯後のシワ: 綿100%のナチュラルな素材特性上、洗濯後は多少シワになりやすいです。干す時にパンパンと軽く叩いて形を整えて干すか、マットレスにピシッと張ってセットしてしまえば気にならなくなります。\n【購入者へのアドバイス】\n「毛玉ができないシーツを探している」「肌に優しく汗を吸ってくれる綿100%が良い」という方には間違いなくおすすめできます！\nマットレスだけでなく厚みのある敷き布団にも対応しているので使い勝手が抜群です。ネイビーは汚れも目立ち /portal/customer-reviews/srp/-/R1KX3BP2RMOYCX/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["偏薄"], "价值体验": ["无匹配标签"]}, {"asin": "B07RJDNWK9", "title": "通常很好的床单", "title_orig": "普通に良いシーツ", "content": "我的床垫是在宜家买的，但有点令人失望，因为它很厚，不能很好地覆盖我，但它是 100% 棉的，我睡在上面很舒服^^\n", "content_orig": "私のベッドマットはIKEAで購入したものですが、厚みがあり、しっかりカバーできなかったので少し残念なところはありますが、綿100％は大変気持ちよく寝ております＾＾\n", "model": "色: ホワイト | サイズ: クイーン・160X200cm", "star": 3, "reviewer": "ranmam", "date": "2024-09-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3GIQ6J0NVTS65/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07RG8MCG5", "title": "易于使用。", "title_orig": "使いやすさ。", "content": "易于清洗和设置。\n", "content_orig": "洗濯も簡単、セットも簡単です。\n", "model": "色: オリーブ | サイズ: シングル・100X200cm", "star": 3, "reviewer": "堀江光人", "date": "2024-09-05", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R13HXD2YDSR5DI/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07RF9Z2R6", "title": "普通", "title_orig": "普通", "content": "我以为它和普通床单没有什么不同。\n优点是耐用，即使洗后也能持续很长时间。\n", "content_orig": "極一般のシーツと変わらないかなと思った。\n洗濯しても丈夫で長持ちしそうなのは良い。\n", "model": "色: ホワイト | サイズ: ダブル・140X200cm", "star": 3, "reviewer": "らめ", "date": "2024-09-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RH87HW5LVPGPW/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07SHFCXYV", "title": "我想要多一点角撑板", "title_orig": "マチがもう少し欲しい", "content": "棉质的质量非常好，我喜欢它的触感。折痕不多，因此，与其使用床箱床单，不如使用稍薄的床垫。我想把它拉长以适合床，但橡胶不太紧，而且当我睡觉时床顶往往会下垂。我想拉动两端以使其紧贴，但角撑板太窄，橡胶可能很脆弱。如果我们能在这一点上有所改进那就太好了。\n", "content_orig": "コットンの質はとても良く、肌触りも気に入りました。まちがあまりないので、ベットボックスシートというよりは、もう少し厚みの薄いマットレスならちょ const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withQualityIssue = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const textureGood = REVIEWS.filter(r=>r['触感体验'].includes('触感舒适')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数（各星级均衡各100条抽样）</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">样本平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${textureGood}</div><div class="label">明确反馈触感舒适</div></div>
    <div class="stat"><div class="num">${withQualityIssue}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN（部分）：<b>' + asins.slice(0,12).join('</b> · <b>') + '</b>' + (asins.length>12? ' 等共'+asins.length+'个':'');
}

// ---------- generic pie builder ----------
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
