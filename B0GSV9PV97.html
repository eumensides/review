パッドです。\n", "model": "色: ライトグレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "Amazonカスタマー", "date": "2026-08-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2JLQPGUCRGCOY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["容易移位"], "感官感受": ["触感舒适", "透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV731R4", "title": "实惠又满意", "title_orig": "お手頃で満足感あり", "content": "由于我养猫，所以买了一个容易看到毛发和污渍且可水洗的，成本和厚度都不错。\n", "content_orig": "猫を飼ってるので毛、シミがわかりやすく、丸洗いのできる物を購入、金額、厚み使用感共に良かったです。\n", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 5, "reviewer": "ニノ", "date": "2026-08-05", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3UW53TOYH7KK7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["厚度", "具有性价比"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV5RSZN", "title": "桃皮绒防水床垫，触感柔软，易于护理使用。", "title_orig": "ピーチスキンで肌触りが良く、介護にも使いやすい防水敷きパッド", "content": "由于妈妈要求护理等级为4级，所以床垫上一年四季都少不了防水垫，所以我就订了这个用于护理用途。很多防水床垫看上去手感生硬，但这款正如产品描述所说，采用桃皮绒加工而成，质感光滑。它感觉不到僵硬或松脆，对皮肤感觉温和，睡起来似乎很舒服。四个角上的橡胶有足够的长度，可以轻松地在床垫上安装和拆卸。作为护理人员，能够每天更换床单非常有帮助，甚至更容易一些。\n", "content_orig": "母が要介護4のため、一年を通してマットレスの上には防水パッドが欠かせず、介護用として注文しました。防水タイプの敷きパッドは、ごわごわした硬い手触りのものが多いように思いますが、こちらは商品説明どおりピーチスキン加工で、さらりとした肌触りです。ゴワゴワ・バリバリした感覚がなく、肌当たりがやさしく寝心地も良さそうだと感じました。4隅のゴムは長さにゆとりがあり、マットレスへの着脱もスムーズでした。毎日のシーツ交換が少しでも楽になるのは、介護をしている立場としてとても助かります。\n", "model": "色: ベージュ | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Na", "date": "2026-08-01", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R14JCQTLRWVNV0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV6RLGM", "title": "就连被子也不会被淋湿", "title_orig": "布団まで濡れない", "content": "我订购这个是为了防止我的孩子尿床。\n\n我的印象是，大多数防水床单都有一种嘎吱嘎吱的感觉，但这款防水床单的噪音和僵硬程度较低，而且触感柔软舒适。\n\n四个角有橡胶，安装很方便，而且不容易打滑。\n\n它还具有防水功能，因此您可以放心，仅用这一件就可以防止尿床。\n\n该面料手感四季皆宜，不仅可用于儿童，还可用于护理、宠物保护等多种用途。\n\n我认为即使对于不喜欢防水床单舒适度的人来说，该产品也很容易尝试。\n", "content_orig": "子どものおねしょ対策用に注文しました\n\n防水シーツはシャカシャカ・カサカサした寝心地のものが多い印象でしたが、こちらは防水シーツ特有の音やゴワつきが少なく、肌触りも柔らかめで快適です。\n\n四隅のゴムで取り付けも簡単で、ズレにくいのも良かったです。\n\n防水性もしっかりしているので、これ1枚でおねしょ対策ができる安心感があります。\n\nオールシーズン使いやすい生地感で、子ども用はもちろん、介護やペット対策など幅広い用途で活躍してくれそうです。\n\n防水シーツの寝心地が苦手な方にも試しやすい商品だと思いました\n", "model": "色: ブルー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "ゆっちゃん", "date": "2026-07-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2B7M0NJAWSUK6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["防水效果好"], "产品质量": ["容易移位"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV4DD8X", "title": "尽管它是防水的，但它比我想象的要柔软并且易于使用。", "title_orig": "防水なのに思ったより柔らかくて使いやすい", "content": "我买这个是为了防止我孩子盗汗和我的猫皮肤粗糙。四个角上的加固橡皮筋与床垫牢固贴合，有助于防止床垫在您睡觉时移动。\n颜色是浅灰色，平静，与房间的氛围融为一体。桃皮绒的面料比我预想的更柔软、更光滑，厚度也让睡起来更舒服一些。\n背面的防水材料不太厚，而且很轻，所以清洁时很容易滑到羽绒被下面。\n即使在洗衣机中洗涤也不会变形，并且易于干燥，适合日常使用。不过，使用一段时间后，我想看看橡皮筋的耐用性和防水性能是否能持续。\n", "content_orig": "子どもの寝汗や猫の粗相対策に購入しました。四隅の強化ゴムバンドがしっかりマットレスにフィットして、寝ている間もパッドがズレにくいのは助かります。\n色は薄いライトグレーで落ち着いており、部屋の雰囲気になじみました。ピーチスキン加工の生地は思っていたより柔らかく、さらっとした触り心地で、厚みもあるため寝心地が少し良くなった気がします。\n裏の防水素材は分厚すぎず軽いので、掃除のときや布団の下に潜り込ませるのも簡単でした。\n洗濯機で洗っても型崩れしにくく、乾きやすいのも日常使いに向いています。ただ、長く使ってみてゴムバンドの耐久性や防水性能の持続性がどうかは今後見ていきたいところです。\n", "model": "色: ライトグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazonカスタマー", "date": "2026-07-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2PUF57F9EX321/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用", "厚度", "颜色", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适", "触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "让护理安心无忧", "title_orig": "介護用として安心感が得られる", "content": "这款防水床垫是为需要护理的父母购买的。\n\n当我想到防水床单时，我总是想象它们有类似乙烯基的质感，睡起来很不舒服，但当我真正穿上它们时，触感几乎没有任何不适。由于表面经过柔软处理，触感与普通床单无异，可以放心使用。\n\n另外，作为护理人员，对我来说最有帮助的是，如果有少量尿液漏出，我可以简单地将其擦掉。您可以最大程度地减少损坏，而不必每次都立即清洗，这大大减少了您日常的工作量。\n\n即使半夜犯错，也不用弄脏蒲团。有了这种安全感，我们现在就可以安心休息，不用为彼此担心了。它是一款实用可靠的物品，可以减轻日常护理的身心负担。\n", "content_orig": "介護が必要な親のために調達した防水仕様の敷きパッドです。\n\n防水シーツというと、どうしてもビニールのような質感や寝苦しさを想像していましたが、実際に敷いてみると肌触りの違和感がほとんどありません。表面が柔らかく加工されているため、普通のシーツと同じような感覚で、本人も抵抗なく使えています。\n\nまた、介護をする側として一番助かっているのは、少量の尿漏れであればサッと拭き取るだけで済む点です。毎回すぐに丸洗いしなくても被害を最小限に抑えられるため、日々の労力がずいぶんと軽減されます。\n\n夜中に失敗しても布団を汚さずに済む。という安心感があることで、お互いに気を揉むことなく休めるようになりました。日々の介護の負担を物理的にも精神的にも和らげてくれる、実用的で頼りになるアイテムです。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Com", "date": "2026-07-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2DDA0XKBDM5KA/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["防水效果差"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "防水但柔软，适合睡觉！四季皆可使用的防水垫", "title_orig": "防水なのに柔らかな寝心地！オールシーズン使える防水敷きパッド", "content": "【使用感受】\n我选择了深灰色单一尺寸（100 x 200 厘米）。\n面料很坚固，但表面很柔软，我没有感觉到防水类型常见的僵硬感。触感良好，可以舒适地用作日常使用的床垫。它的四个角有橡胶，因此很容易穿上和取下床垫。\n\n [优点]\n\n防水设计可安全应对盗汗、尿床、护理和宠物。面料坚固耐用，触感柔软，睡眠舒适。\n四个角带有橡胶，方便安装。抗菌、防臭、防尘螨规格使其易于清洁。可水洗，易于清洁。深灰色使污渍不那么明显。\n\n 【引起我注意的点】\n\n由于其坚固的结构，感觉比普通床垫厚一点。它是防水的，因此与完全布的床垫相比，它具有稍微独特的质感。\n\n [概述]\n垫子防水，但触感柔软，睡起来很舒服。您可以在不想弄脏床垫的情况下放心使用它，例如与孩子一起睡觉、防止尿床、盗汗或与宠物一起睡觉时。我还喜欢简单的深灰色，让它很容易融入你的卧室。\n\n ⭐ ★★★★★\n", "content_orig": "【使用感】\nダークグレーのシングルサイズ（100×200cm）を選びました。\n生地はしっかりしていますが、表面は柔らかく防水タイプにありがちなゴワゴワ感はあまり感じませんでした。肌触りも良く、普段使いの敷きパッドとして快適に使用できます。4隅ゴム付きなので、マットレスへの着脱も簡単でした。\n\n【良かった点】\n\n防水仕様で寝汗やおねしょ、介護、ペット対策にも安心\n生地がしっかりしていて丈夫な印象\n肌触りが柔らかく寝心地が良い\n4隅ゴム付きで取り付けが簡単\n抗菌・防臭・防ダニ仕様で清潔に使える\n洗濯できるのでお手入れしやすい\nダークグレーで汚れが目立ちにくい\n\n【気になった点】\n\nしっかりした作りのため、一般的な敷きパッドよりやや厚みを感じます\n防水仕様なので、完全な布製敷きパッドと比べると多少独特の質感はあります\n\n【総評】\n防水機能がありながら肌触りは柔らかく、寝心地も良い敷きパッドでした。子どもとの添い寝やおねしょ対策、寝汗対策、ペットと一緒に寝る場合など、マットレスを汚したくない場面で安心して使えます。シンプルなダークグレーで寝室になじみやすい点も気に入りました。\n\n⭐ ★★★★★\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazonカス夕マー", "date": "2026-07-25", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2N8Z9IYT03VD5/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用", "触感舒适", "防螨抗菌"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV4DD8X", "title": "简单易操作的防水床垫", "title_orig": "シンプルで扱いやすい防水タイプの敷きパッド", "content": "我想尝试一下防水型，所以就订购了。当我想到防水片时，我想象的是一种坚硬的材料，但该产品的表面有桃皮绒，我的第一印象是它比我想象的更柔软。\n\n面料光滑，接触皮肤时不会有粘腻感。虽然不是很厚，但是填充量适中，所以睡在上面的感觉还是不错的，没有感觉到防水床单特有的不适感。\n\n它的四个角用橡胶固定，因此很容易固定在床垫上。当您睡觉时，它不会移动太多，一旦安装好，您就可以像普通床垫一样使用它。\n\n我无法确认防水性能，因为我还没有喝过饮料洒在上面，但防水功能让我在盗汗或意外污渍时可以安心。这是我通常不会注意的事情，但由于床垫不容易清洗，我觉得值得用它来保护。\n\n我还喜欢它看起来简单并且不会过多改变床上用品的外观。浅灰色是一种平静的颜色，看起来很容易与其他床上用品搭配。\n\n我刚刚开始使用它，所以我不确定它能持续多久，但目前我可以将它用作日常使用的床垫，不会因为佩戴的手感和舒适度而感到任何不适。对于那些寻找防水床垫的人来说，这可能是一个选择。\n", "content_orig": "防水タイプも試してみたくなり注文しました。防水シーツというとゴワゴワした素材をイメージしていましたが、この商品は表面がピーチスキン加工になっていて、最初に触れた印象は想像より柔らかかったです。\n\n生地はさらっとしていて、肌に触れてもベタつく感じはありません。厚手というほどではありませんが、適度に中綿が入っているため、寝た時の感触も悪くなく、防水シーツ特有の違和感はあまり感じませんでした。\n\n4隅のゴムで固定するタイプなので、マットレスへの取り付けも簡単です。寝ている間も大きくずれることはなく、一度セットしてしまえば普段の敷きパッドと同じような感覚で使えています。\n\n防水性能については、まだ飲み物をこぼしたりする場面がないため確認できていませんが、防水機能が付いていることで寝汗や万が一の汚れに備えられる安心感があります。普段は意識しない部分ですが、マットレスは簡単に洗えないため、保護目的として使う価値はあると感じました。\n\nまた、見た目もシンプルなので、寝具の雰囲気を大きく変えない点も気に入っています。ライトグレーは落ち着いた色合いで、他の寝具とも合わせやすい印象です。\n\n使い始めたばかりなので耐久性はこれからですが、現時点では肌触りや装着のしやすさなど、普段使いする敷きパッドとして違和感なく使えています。防水機能も備えた敷きパッドを探している方には、選択肢の一つになりそうです。\n", "model": "色: ライトグレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "Amazon Customer", "date": "2026-07-23", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3ISF0PMKRD28J/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV2KW34", "title": "帝人击球让您保持干净舒适的睡眠", "title_orig": "帝人中綿で清潔感が保たれ寝心地よし", "content": "将床垫垫放入塑料袋中。\n材质成分为100%聚酯纤维，衬里为聚氨酯。\n当我尝试在上面睡觉时，摸起来很柔软，感觉很舒服。\n它给你一种蓬松的感觉，让你睡得好。\n因为它使用TEIJIN（帝人）填充物，所以可以肯定睡起来会很舒服。\n经过SEK认证的防螨处理和抗菌除臭效果让您保持清洁和安全。\n它也很容易护理，因为它可以在洗衣机中清洗。\n它的四个角上还有橡皮筋，以防止其滑动。\n质量很好，没有污渍或刺绣错误。\n制造国是中国。\n\n这是对久森防水床垫单人的评论。\n", "content_orig": "敷きパッドはビニール袋に入れられていました。\n素材構成はポリエステル100%で、裏地がポリウレタンとなります。\n寝てみたところ、肌触りは柔らかめで寝心地は良かったです。\nふかふか感が出てきもちよく快眠できます。\nTEIJIN（帝人）中綿使用なので良い寝心地に納得です。\nSEK認証の防ダニ加工と抗菌防臭効果があるので清潔感が保たれ安心感があります。\n洗濯機で丸洗い可能という手入れのしやすさも良いですね。\n四隅にゴムバンドもついておりズレ防止もしてくれます。\n汚れや刺繍ミスもなく品質が良かったです。\n生産国は中国となります。\n\nクモリ(Kumori)の防水敷きパッド シングルのレビューです。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazon カスタマー", "date": "2026-07-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1HPZ5946EGSPI/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位", "防螨抗菌"], "防水体验": ["防水效果好"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV5RSZN", "title": "虽然防水，但是布料摸起来很好！", "title_orig": "防水だけど生地感は気持ちいい！", "content": "我正在寻找防水床垫并购买了这个。虽然防水，但面料并不硬挺，经过桃皮绒处理，触感柔软，睡起来很舒服。\n\n四个角可以用橡胶牢固固定，即使翻身也不会滑落，穿脱方便。我想它不仅可以安心地用于防止盗汗，还可以用于尿床的小孩子，照顾孩子，以及宠物一起睡觉的家庭。\n\n我还喜欢它易于护理，因为它可以轻松地在洗衣机中清洗。它带有衬垫，因此具有恰到好处的缓冲效果，因此无论什么季节都可以使用。\n\n它在功能性和易用性之间取得了很好的平衡，而且我对价格感到满意。推荐给那些正在寻找防水片的人。\n", "content_orig": "防水タイプの敷きパッドを探していて購入しました。防水仕様ですが、生地がゴワゴワせず、ピーチスキン加工のおかげで肌触りがやわらかく、とても快適に眠れます。\n\n四隅のゴムでしっかり固定できるので、寝返りを打ってもズレにくく、着脱も簡単でした。寝汗対策はもちろん、小さなお子さんのおねしょや介護、ペットと一緒に寝る家庭にも安心して使えると思います。\n\n洗濯機で気軽に洗えるので、お手入れがしやすい点も気に入っています。中綿入りなので適度なクッション性があり、季節を問わず使えそうです。\n\n機能性と使い心地のバランスが良く、価格にも満足しています。防水シーツを探している方におすすめできる商品です。\n", "model": "色: ベージュ | サイズ: シングル・100X200cm", "star": 5, "reviewer": "gomao", "date": "2026-07-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RYDFYJ7JWWXFU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "即使在夏天，也比较容易入睡，不会僵硬。", "title_orig": "夏でもごわつかずに比較的寝やすいです。", "content": "这是最新的防水床单，所以我将它与旧的进行比较，但即使在夏天的夜晚我也可以在上面睡觉而不会感到僵硬或不舒服。\n如果您经常盗汗，您可能会担心您的床垫，这也是防止尿床的好方法。\n它的四个角可以用橡胶牢固地固定，即使翻身也不会滑落，也不用担心每天早上都要重新调整。\n它可以机洗，所以弄脏了也可以轻松清洗，但冬天不会干，所以最好有一个备用的。\n", "content_orig": "最新の防水ｼｰﾂなので昔と比較しちゃうのですが圧倒的にゴワゴワせずに違和感なく夏場の夜でも寝る事が出来ます。\nどうしても寝汗が多いとマットレスが心配ですし、おねしょ対策としても安心感があります。\n四隅のゴムでしっかり固定できるので、寝返りをしてもズレにくく、毎朝整え直す手間もほとんどありません。\n洗濯機で手入れできるので、汚れても気軽に洗えるのが便利ですが冬は乾かないので予備があると便利です。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "SamansaSamazon", "date": "2026-07-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R6HJ1DO5XRYPX/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV5RSZN", "title": "一款防水且触感柔软的床垫。", "title_orig": "しっかり防水して肌触りも両立の敷きパッド", "content": "说到防水床垫，我的印象是有很多产品很硬，并且具有类似聚酯的感觉，可以锁住热量。\n这是\n・表面经过拉丝处理，比较蓬松♪\n\n背面有防水纹理。\n\n它还配有防滑带。\n\n注意事项与其他同类产品相同。\n由于产品的特性，在洗衣机中洗涤时很难脱水。\n\n如果将这件衣物与其他衣物一起洗涤，这件衣物中的水分可能无法完全脱水，并且水分可能会泄漏到其他衣物中，导致脱水不完全。\n\n如果可能的话，单独处理它实际上可能会节省你很多时间。\n", "content_orig": "防水敷きパッドと言えば、どうしても硬めのポリっぽくて硬めで熱が籠る感じの製品が多い印象ですが、\nこちらは、\n・表面が起毛加工で割とフワサラ\nです♪\n\n裏面は、防水加工らいし質感です。\n\nズレ防止バンドも備わってます。\n\n注意点は、ほかの類似製品同様で、\n製品のの特性上、洗濯機で洗濯時の脱水がしにくいですね。\n\nほかの洗濯物と一緒にすると、これの水分が脱水しきれなきため、他の洗濯物へ水分が漏れてしまい脱水が中途半端になってしまうことがある点ですな。\n\n出来れば、別に扱うのがかえって手間が減るかもです♪\n", "model": "色: ベージュ | サイズ: シングル・100X200cm", "star": 5, "reviewer": "みーくん", "date": "2026-07-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2S8JRQWZDQ7YO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "我开始用它来对抗盗汗和夜间失禁，这给了我更多的安全感。", "title_orig": "寝汗や夜間の失禁対策として取り入れて、安心感が増しました", "content": "我正在寻找一个可以在正在接受照顾的家庭成员的床上使用的。我想要一件防水且可机洗的东西，我选择了这款，因为我被它使用 TEIJIN 的棉絮和对质地的护理的描述所吸引。\n\n当你实际拿起它时，桃皮绒材质没有粗糙感，触感柔软。当我想到防水床单时，我的印象是坚硬而粗糙的材料，但这种防水床单的感觉类似于普通床垫，似乎对使用它的人来说负担较小。\n\n它的四个角有橡胶，因此它牢固地贴合在床垫上，即使翻身也不会滑落。穿脱方便，弄脏后只需脱下即可放入洗衣机。它干燥速度快，这对于需要经常清洗的应用非常有用。\n\n它还具有抗菌、除臭、防螨功能，卫生放心。由于经过防皱处理，清洗后无需熨烫，可直接使用。\n\n我认为对于那些需要防水床单进行护理或盗汗的人来说，这是一个在质地和功能之间取得良好平衡的选择。\n", "content_orig": "介護中の家族のベッドで使うために探していました。防水性があって洗濯機で丸洗いできるものを条件にしていて、TEIJINの中綿を使っていることと肌触りへの配慮が伝わる説明に惹かれてこちらを選びました。\n\n実際に手に取ってみると、ピーチスキン素材でざらつきがなく肌への当たりが柔らかいです。防水シーツと と張り付くことはありませんでした。厚くふかふかしたパッドではなく、寝具を守りながら表面の硬さを和らげる程度の厚みです。\n\n寝返りを打っても四隅のゴムは外れませんでした。朝には腰のあたりに軽いシワが寄りますが、端が大きくめくれたり、足元へずれたりはしていません。縫い目やゴムの付け根にも、大きな糸の飛び出しはありませんでした。\n\n防水面があるぶん、毎日洗うなら、洗い替えを一枚用意した方が楽です。厚みや強いクッション性だけを求める人にはお勧めできません。\n\n商品の写真より実物はずっと良く、星の数は5としました。理由は、四隅ゴムの着脱、直接触れても硬くない表面、落ち着いた色の三点がそろっていたからです。寝汗からマットレスを守りたい人にはお勧めします。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazon カスタマー", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2MHKQWU3NP2Y2/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["厚度", "颜色", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV4DD8X", "title": "用于尿床措施", "title_orig": "おねしょ対策に", "content": "当您想到防水型时，您可能会认为它很硬，但这种类型的表面柔软，触感光滑，因此您可以像普通床垫一样使用它。\n睡觉时不会有不舒服的感觉，而且无论什么季节都似乎很容易使用。\n它的四个角有橡胶，因此安装很快。即使您翻来覆去，它也能保持在原位，直到早上都保持干净。\n整理床铺也变得更加容易。\n我也用过Nitori的防水垫，但它的干燥速度比这快得多，我真的很欣赏这一点，因为防水垫不能脱水。\n不仅可以用来防止孩子尿床，还可以在多汗的季节和护理时使用。您可以感到更加放松，因为您不必担心在紧急情况下弄脏床垫。\n您可以轻松地在洗衣机中清洗它，因此易于护理。干燥后可再次使用，使其易于融入日常使用。\n它外观简洁，非常适合卧室，是您可以毫不犹豫地每天使用的床垫。推荐给那些想要保持床上用品清洁以及注重防水性和质感的人士。\n", "content_orig": "防水タイプというとゴワゴワしたイメージがありましたが、こちらは表面がやわらかく、さらっとした肌触りで普段の敷きパッドとあまり変わらない感覚で使えています。\n寝る時も違和感が少なく、季節を問わず使いやすそうです。\n四隅にゴムが付いているので取り付けはあっという間。寝返りを打ってもズレにくく、朝まできれいな状態を保てています。\nベッドメイキングもラクになりました。\nニトリの防水パッドも使用していましたが、それよりも格段に乾きが早く防水パッドは脱水ができないのでかなりありがたいです。\n子どものおねしょ対策はもちろん、汗をかきやすい季節や介護用としても一枚あると安心できます。もしもの時にマットレスまで汚れる心配が減るので、気持ちにも余裕が持てます。\n洗濯機で気軽に洗えるので、お手入れしやすいのも嬉しいところ。乾いたらまたすぐ使えるので、普段使いにも取り入れやすいです。\n見た目はシンプルで寝室にもなじみやすく、毎日気兼ねなく使える敷きパッドでした。寝具を清潔に保ちたい方や、防水性と肌触りの両方を重視したい方におすすめです。\n", "model": "色: ライトグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazon カスタマー", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R7EP8OWZT5VMK/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["防水效果好"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "可靠的盟友", "title_orig": "心強い味方", "content": "我孩子的睡姿非常好，他会向各个方向打滚……他睡觉时尿尿的量逐渐减少，但当他醒来时，他似乎无法坚持积累的尿量，所以有时他无法及时去卫生间。我请求这款产品是因为我想避免早上更换所有衣服和床上用品的麻烦。\n采用 TEIJIN 棉絮制成​​的防水床单。然而，它看起来就像一个普通的床垫，摸起来感觉很好。当你把它翻过来时，你会发现它是防水的。 （附图）我尝试加一点水。它缓慢地蔓延，但并没有渗透到底部。啊，我对此感到安全。垫子永远不会被弄湿。将湿衣服包裹在这个垫子中将使清洁变得更加容易。不过，我有点担心声音。嗯，睡着了也没关系。\n床单有 6 种颜色和 6 种宽度，从单张到宽特大（是的，有这样的东西），阵容丰富。我正在考虑再买一件来洗。\n\n", "content_orig": "子どもが縦横無尽に転がり回るという素晴らしい寝相で…就寝中のお漏らしは各段に減ってきたのですが、目が覚めるとたまっていたのを保持できないようで、トイレに間に合わないことがあります。朝から着衣一式、寝具一式を総入れ替えの大騒ぎをなくしたくて本品をリクエストしました。\n　TEIJIN中綿使用の防水シーツです。しかし見た目は普通の敷きパッドで、肌触りがよいです。裏返すと、「ああ、防水になっているなあ」と分かります。（添付画像）試しに水を少々垂らしてみました。じわ～っと広がりますが、下に染み渡るようなことはありませんでした。ああ、これなら安心。マットまで濡れるようなことはないです。このパッドに濡れた衣類をくるめば始末もずいぶん楽です。ただ音が少し気になりました。まあ、寝入ってしまえば関係ないですが。\n　シーツは6色あり、シングルからワイドキング（というのもあるのね）まで幅も6種類と、豊富なラインナップです。洗い替えにもう1枚ポチろうかなと思っています。\n　\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "すもぐら", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2LQ0GNKK1Y78Z/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色", "防螨抗菌"], "防水体验": ["防水效果好"], "产品质量": ["棉絮跑出"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "在紧急情况下感到安全", "title_orig": "万が一の安心感", "content": "四个角用橡胶固定的防水垫。\n我订购了深灰色单一尺寸。\n\n我将它固定在 10 厘米厚的单人床垫上使用。\n尺寸完美，不会滑落。\n\n表面经过了桃皮绒处理，亲肤感很好，而且不会给你带来防水的印象。\n即使在出汗的季节也能保持光滑舒适。\n即使弄脏了，也可以放进洗衣机里洗，而且用不了多久就干了。\n\n我使用的是盒式防水布，但这是正确的答案。\n使用起来很舒服。\n", "content_orig": "四隅のゴムで固定するタイプの防水敷パッド。\nダークグレーのシングルサイズを注文しました。\n\n厚さ10㎝のシングルマットレスに付けて使用しています。\n丁度いいサイズ感でズレることもありません。\n\n表面はピーチスキン加工がしてあり、肌触り良く防水であることを感じさせない造りです。\nサラッとしているので汗ばむ季節でも快適。\n汚れても洗濯機で丸洗いでき、乾燥までの時間もそこまで掛かりません。\n\nボックスタイプの防水シーツを使っていましたがこちらに替えて正解でした。\n快適に使えています。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazonのお客様？", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R4HHJ61H2ESP7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV4DD8X", "title": "订购的决定性因素是帝人的 Mighty Top 2。", "title_orig": "注文の決め手は何と言っても帝人のマイティトップ2", "content": "蓝色、米色、白色、摩卡色、\n有6种不同的颜色，浅灰色和深灰色，我选择了浅灰色。\n\n我订购的决定性因素是帝人的 Mighty Top 2。我目前使用的床垫实际上具有 Mighty Top 2 的防尘螨功能，因此我在床垫上添加了这个床垫垫，使其具有双重防螨功能。\n\n在这个季节（夏天），桃皮摸起来比凉凉的感觉更热，但如果你使用空调，那就不会打扰你了。\n\n我还喜欢它的四个角有橡皮筋，背面防水。\n", "content_orig": "ブルー、ベージュ、ホワイト、モカ、\nライトグレー、ダークグレー6種類のカラバリがあって\nライトグレーを選びました。\n\n注文の決め手は何と言っても帝人のマイティトップ2で\n今使ってる敷布団もマイティトップ2で防ダニを実感できてるので\nその敷布団の上に更にこちらの敷きバッドで二重防ダニにしました。\n\nこの季節（夏）ピーチスキンは接触冷感に比べて暑さを感じますが\nクーラーを効かせていれば気になりません。\n\n四隅のゴムバンドも付いてるし\n裏面が防水加工になっているのもいいと思います。\n", "model": "色: ライトグレー | サイズ: シングル・100X200cm", "star": 4, "reviewer": "はらお", "date": "2026-07-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R6E91EASI12L6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色", "不易移位", "防螨抗菌"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "一款功能强大的床垫，防水但触感柔软，易于日常使用。", "title_orig": "防水なのに肌触りが柔らかく、普段使いしやすい高機能敷きパッド", "content": "我印象中防水床垫的质地会比较硬，但由于采用了桃皮绒处理，所以非常柔软，摸起来没有任何不适的感觉。我的印象很好，它看起来很自然，并且与普通床垫具有相同的感觉。\n\n背面的TPU防水涂层坚固，不必担心盗汗或粗暴的宠物弄脏床垫，让您感觉好很多。它有衬垫，厚度合适，躺着时能提供足够的缓冲。\n\n四个角上的橡皮筋又粗又强，即使在睡觉时翻身也不会轻易滑落。我发现它很容易日常使用，因为它可以在洗衣机中清洗并快速干燥。另一个很大的特点是该材料可以在所有季节使用。\n\n总体而言，我觉得这款垫子在防水性、质感和易用性之间取得了很好的平衡，不仅可以安全地用于护理和宠物，还可以用作日常床上用品。\n", "content_orig": "防水タイプの敷きパッドは質感が硬いイメージでしたが、これはピーチスキン加工のおかげでとても柔らかく、触れた瞬間の違和感がほとんどありませんでした。見た目も自然で、一般的な敷きパッドと変わらない雰囲気なのが好印象でした。\n\n裏面のTPU防水コーティングはしっかりしていて、寝汗やペットの粗相があってもマットレスまで染みる心配がなく、精神的にかなり楽になります。中綿入りで適度な厚みがあり、横になったときのクッション性も十分でした。\n\n四隅のゴムバンドは太めで強度があり、寝返りしてもズレにくいのが便利です。洗濯機で丸洗いでき、乾きも早いので日常的に使いやすいと感じました。オールシーズン使える素材なのも嬉しいポイントです。\n\n全体としては、防水性・肌触り・使い勝手のバランスがとても良く、介護用やペット用だけでなく、普段の寝具としても安心して使える敷きパッドだと感じました。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazon カスタマー", "date": "2026-07-17", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R11GCG000CY7GV/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["速干", "厚度", "触感舒适", "不易移位"], "防水体验": ["防水效果好"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "我很满意。", "title_orig": "大満足です。", "content": "我选择这款是因为我正在寻找一款防水床垫垫，但当我实际使用它时，我觉得质量超出了价格。\n\n首先让我印象深刻的是面料的坚实感。不会给人薄薄或不靠谱的感觉，整体厚实，缝线也很牢固。表面柔软，触感舒适，所以我不必担心防水片经常出现的僵硬和不适。它还可以用作日常使用的床垫，没有任何不适。\n\n四个角上的橡胶坚固且易于固定在床垫上。一旦我戴上它，即使我在床上翻身，它也不会轻易滑动并保持稳定。由于它是防水的，因此您可以放心，它会保护您免受汗水和污渍的侵害。\n\n可以清洗也是一大魅力，可以继续卫生地使用。有很多产品在防水方面价格昂贵，但如果以这个价格做的这么好，你会感到满意的。\n\n这是一款质量、易用性、价格平衡得非常好的产品，性价比很高。如果您正在寻找防水床垫，我认为将其作为候选产品是个好主意。\n", "content_orig": "防水タイプの敷きパッドを探していてこちらを選びましたが、実際に使ってみると価格以上の品質だと感じました。\n\nまず印象的だったのは、生地のしっかり感です。薄くて頼りない感じはなく、全体的に厚みがあり、縫製もしっかりしています。表面はやわらかく肌触りが良いため、防水シーツにありがちなゴワつきや寝心地の悪さはあまり気になりませんでした。普段使いの敷きパッドとしても違和感なく使用できます。\n\n四隅のゴムはしっかりしていて、マットレスへの取り付けも簡単です。一度装着するとズレにくく、寝返りを打っても安定していました。防水仕様なので、汗や万が一の汚れ対策としても安心感があります。\n\n洗濯できるので衛生的に使い続けられるのも魅力です。防水機能付きというと価格が高めの商品も多いですが、この価格でここまでしっかりした作りなら十分満足できます。\n\n品質、使い心地、価格のバランスが非常によく、コストパフォーマンスの高い製品でした。防水敷きパッドを探している方なら、候補に入れて損はないと思います。\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "Amazon カスタマー", "date": "2026-07-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RXMFYUU45SKT4/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "具有性价比", "不易移位", "防螨抗菌"], "防水体验": ["防水效果好"], "产品质量": ["品质牢固"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSTVTG8W", "title": "非常满意！", "title_orig": "大満足！", "content": "我对床单非常时尚和光滑的感觉非常满意，它没有防水床单典型的乙烯基感觉！水洗桃皮有自然的皱纹，非常时尚，深灰色的颜色会给你的卧室带来沉稳成熟的氛围！\n\n最重要的是，凭借这种品质，背面是 100% 防水的，这使得它像小玩意一样坚固！它完全阻挡汗水和溢出的饮料，让您感到安全、安心，只要有这一层就可以大大延长您的床上用品的使用寿命！由于四个角上有橡皮筋，只需拉动即可轻松安装和拆卸！\n", "content_orig": "防水シーツ特有のビニール感を一切感じさせない、非常におしゃれでなめらかな肌触りに大満足しています！ピーチスキンに洗いざらし加工を施した自然なシワ感がとってもスタイリッシュで、ダークグレーの色味も寝室をグッと落ち着いた大人っぽい雰囲気にしてくれます！\n\n何より、このクオリティで裏面は100%徹底防水というギャップの強さがガジェット並みに素晴らしいです！汗や飲みこぼしを完全にブロックしてくれるので、これ1枚を敷いておくだけで寝具の寿命が大幅に伸びる安心感があります！4隅のゴムバンドのおかげで、セットするのも取り外すのも引っ張るだけでとてもスムーズです！\n", "model": "色: ダークグレー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "まさ", "date": "2026-07-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R347O2IB04P7XH/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["颜色", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV2KW34", "title": "柔软舒适的防水床垫", "title_orig": "柔らかく快適な防水敷きパッド", "content": "⭐⭐⭐⭐☆\n\n这是一款防水床垫，适用于单一尺寸（100 x 200 厘米）床垫和蒲团。外层材质采用水洗桃皮绒涤纶面料，采用绗缝设计。背面为TPU防水，四个角可以用松紧带牢固固定。\n\n表面柔软舒适，比典型的薄防水床单具有更多的缓冲作用，使睡眠感觉更舒适。触感光滑，几乎没有防水床上用品常见的僵硬或乙烯基感觉。绗缝和填充物提供恰到好处的缓冲效果，但不会太厚。\n\n做工精良，缝线和滚边都很工整。我在使用过程中没有发现缝纫缺陷。四个角上的松紧带很容易贴在床垫上，使用过程中感觉比较难移位。 100 x 200 厘米的尺寸非常适合典型的单人床垫，并能完全覆盖整个睡眠表面。\n\n虽然它作为防水床垫垫出售，但也可以用作防水床垫保护垫。防水背衬可保护床垫免受尿床、溢出和湿气的影响，同时提供舒适的睡眠体验，感觉更像普通的绗缝床垫，而不是防水罩。它易于维护，因为可以将其放入洗衣网中并在洗衣机中轻柔地洗涤。但是，您不能使用烘干机。\n\n总而言之，它是一款制作精良、实用的防水床垫，可提供出色的床垫保护，同时又不会牺牲普通绗缝床垫的舒适度。\n", "content_orig": "⭐⭐⭐⭐☆\n\nシングルサイズ（100×200cm）のマットレスや敷き布団に対応した防水敷きパッドです。表地には洗いざらし加工を施したピーチスキン調ポリエステル生地を使用し、キルティング仕様になっています。裏面にはTPU防水加工が施されており、四隅のゴムバンドでしっかり固定できます。\n\n表面は柔らかく快適で、一般的な薄手の防水シーツよりもクッション性があり、寝心地の良さを感じます。肌触りもなめらかで、防水寝具によくあるゴワつきやビニールのような感触はほとんどありません。キルティングと中綿により、厚すぎない適度なクッション性も備えています。\n\n作りもしっかりしており、縫製やパイピングはきれいに仕上げられています。使用中に気になるような縫製不良なども見当たりませんでした。四隅のゴムバンドはマットレスへの取り付けが簡単で、使用中も比較的ずれにくく感じます。100×200cmのサイズは一般的なシングルマットレスにちょうどよくフィットし、寝る面全体をしっかりカバーします。\n\n防水敷きパッドとして販売されていますが、防水機能付きのマットレスプロテクターとしても十分に使えます。裏面の防水加工により、おねしょや飲み物のこぼれ、水分などからマットレスを保護しながら、防水カバーというより通常のキルティング敷きパッドのような快適な寝心地です。洗濯ネットに入れて洗濯機のやさしいコースで洗えるため、お手入れも簡単です。ただし、乾燥機は使用できません。\n\n全体として、通常のキルティング敷きパッドの快適さを損なうことなく、しっかりとマットレスを保護できる、作りの良い実用的な防水敷きパッドです。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 4, "reviewer": "Daedalus", "date": "2026-07-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RTH6LM70D1FWY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形", "容易移位"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0GSV2KW34", "title": "适当防水", "title_orig": "ちゃんと防水", "content": "正面看起来和摸起来都像一个普通的垫子。\n不过背面是松 const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const waterGood = REVIEWS.filter(r=>r['防水体验'].includes('防水效果好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${waterGood}</div><div class="label">明确反馈防水效果好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
