入ったのでレビューを書く前に即同じものをリピート買いしました。\n柄が入っている表面生地、スケスケの側面生地、防水ビニールになっている裏面生地の3種で構成されています。\nベッドに対してシーツのサイズもぴったり過ぎるほどジャストサイズだったので、スケスケの側面生地が引っ張りや寝相の巻き込みでいつかここから破れそうだな・・・と若干不安です。\n他の方のレビューにもありますが裏がビニールのような防水シートになっているので洗濯脱水後は水がポタポタ滴り落ちます。干す時は注意です。\nダブルのシーツは店頭で探しても中々良いのが無いので機能的でオシャレなものが安く買えて感謝です。", "model": "色: グレー（タオル生地） | サイズ: ダブル・140X200cm", "star": 5, "reviewer": "haco", "date": "2021-01-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1QMIW55ZHTSN7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["防螨抗菌", "吸湿"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适", "透气性好"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59M5VY", "title": "很好", "title_orig": "よかったです", "content": "我觉得质量也不错。", "content_orig": "品質も良いと思います。", "model": "色: グレー（タオル生地） | サイズ: クイーン・160X200cm", "star": 5, "reviewer": "Billy", "date": "2021-01-11", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RAX4IHED2ITZ6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "好的", "title_orig": "Good", "content": "我用它作为床垫，与其他床单分层。质量很好。", "content_orig": "I use it as a mattress covering layered with other bed sheet. It’s good quality.", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "Eli", "date": "2021-01-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RFQCZEPVBAKSU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "它们太硬了，不能起到防水板的作用。", "title_orig": "ゴワゴワのくせして防水シーツとして機能していない", "content": "我之前购买过该产品，但销售页面消失了，所以我将在这里回顾相同的产品。\n综上所述，这款防水片不是我所期望的，不值得购买。\n它很容易脏，睡起来很硬而且不舒服，而且它不防水，所以污垢会渗入下面的床垫。\n我很震惊。", "content_orig": "以前購入した者ですが、販売ページが消えていたため、同一製品であるこちらにレビューします。\nこの防水シーツは結論から言うと期待ハズレ、買うに値しません。\n汚れは付きやすく、ゴワゴワして寝心地も悪くなり、防水性能も無く下のマットレスに汚れが貫通していました。\n非常にショックです。", "model": "色: グレー（タオル生地） | サイズ 签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "感谢您的帮助！", "title_orig": "助かっています！", "content": "我发现它很有用，因为它很容易使用。", "content_orig": "気軽に使えるので重宝しています。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200cm", "star": 5, "reviewer": "芥子", "date": "2020-04-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R59JXMQJEDJKQ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "微妙", "title_orig": "微妙", "content": "微妙", "content_orig": "微妙", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 3, "reviewer": "鈴木雅人", "date": "2020-03-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R329KG9DX6ZXII/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59TSN9", "title": "防水功能💯满分", "title_orig": "防水機能💯満点", "content": "我买这个是因为我的孩子还小。\n防水功能100分完美！\n它根本不泄漏。\n我担心床垫的透气性，但两侧的材料不是防水的，而是普通面料。\n它在我们家非常活跃。", "content_orig": "子供が小さいから 購入してみました。\n防水機能100点満点！\n全然漏れません。\nマットレスに対する通気性が心配していましたが\n側面の素材は 防水ではなく普通の生地です。\n我が家では 大活躍しています。", "model": "色: グレー（タオル生地） | サイズ: キング・180X200cm", "star": 5, "reviewer": "大阪より", "date": "2020-03-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3P2GOJUQ0T5D2/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["送礼"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["透气性好"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "它不透气，但这取决于你。与吸湿垫结合使用，使其舒适。", "title_orig": "透湿性は無いですが工夫次第。吸湿マットなどと組み合わせて快適に。", "content": "当然，由于它们是防水片材，因此透湿性较低并且可能会闷热。\n尝试叠放吸湿垫或床单以减少闷热。\n\n防水材料上覆盖着织物，但由于其相当厚，仅此一点就在一定程度上减少了闷热感。\n床单的柔软度适中，因为有篷布床单，所以几乎没有弹性，但皱纹较硬，不适感不是很明显。\n有些人可能会担心皱纹的硬度，但我认为将其视为防水性的权衡是个好主意。\n\n基本上洗的时候都是在浴缸里洗，不过也算合理，所以还是扔掉买一个新的比较好。\n\n总体而言，我认为缝线牢固，面料坚固，可以放心使用。", "content_orig": "防水シーツなので当然ですが透湿性は低く蒸れます。\n吸湿マットやシートを重ねることで蒸れが改善されるのでぜひ試してください。\n\n防水素材の上に布地が張ってあるのですが厚みがそこそこあるためそれだけでもある程度蒸れは軽減してくれます。\nシートの柔らかさはそこそこで防水シートがあるため伸縮性はほぼありませんがシワが硬く違和感がとても目立つとまではいかないです。\n人によってはシワの硬さが気になるかもしれませんがそこは防水性のとのトレードオフと思うと良いと思います。\n\n基本的に洗うときは湯舟などでモミ洗いとなりますがリーズナブルなので思い切って捨てて新品買ったほうが良いかもしれません。\n\n総合的に縫製も丈夫で布地もしっかりしていると思うので安心して使えます。", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "ナスカ級", "date": "2020-02-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1W6LG8TUJ6D07/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["吸湿"], "冷感体验": ["冷感体验差"], "产品质量": ["无匹配标签"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "让我还没有脱掉尿布的三女儿安心。", "title_orig": "まだまだオムツのはずれない三女には安心", "content": "脱不掉尿布的三女儿。\n有时我尿得太多，以至于尿布从尿布中漏出来，但有了这些床单，我不必担心它会弄脏下面的床罩或床垫。\n由于它不允许水通过，因此不会感觉粘稠。", "content_orig": "オムツのはずれない三女。\nときどきオムツから漏れるほどのオシッコをしてしまうが、このシーツなら、下のカバーやマットレスにしみなくて安心。\n水を通さないからといって、ベタベタ張りつく感じもない。", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 5, "reviewer": "名無しのレビュワー", "date": "2020-02-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R13K32OVSW9T2M/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["送礼"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "皮肤感觉不太好", "title_orig": "肌触りが良くない", "content": "尺寸如描述的那样。\n顶面的防水功能没有问题，但侧面则没有。\n另外，侧面的布料很薄，因此耐用性也令人担忧。\n\n表面摸上去比较粗糙，摸起来手感不太好。\n请勿在手臂和腿裸露睡觉的季节使用。\n\n洗衣服也需要一点时间。", "content_orig": "大きさは説明通り。\n上の面の防水機能に問題は無いが、側面は防水ではない。\nまた、側面の生地は薄く、耐久性に不安がある。\n\n表面はガサつくような感じで、肌触りは良くない。\n腕や脚を出して寝る季節には使わない。\n\n洗濯も少し手間がかかる。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200cm", "star": 3, "reviewer": "ユトリ", "date": "2020-02-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1SRPJIY0HV9F4/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "我很欣赏防水", "title_orig": "防水はありがたい", "content": "如果您有小孩，只要防水就可以让您高枕无忧。\n它还具有平静的色彩和干净的感觉。冬天只有这些床单很冷。\n我女儿睡觉时尿布经常漏尿，但当时我用的是防水布。干燥时，更容易处理有限面积的纸张。\n当我怀孕快结束时，我的羊水破了，我弄湿了床垫。也推荐孕妇使用。", "content_orig": "小さなお子様がいると、防水性であるだけで安心感があります。\n落ち着きのある色合いで清潔感もあります。冬はこのシーツだけだと寒いです。\n就寝中、娘はオムツから尿が漏れることがよくありましたが、そのときは防水シートを使っていました。干すときは面積が限られたシートの方が扱いやすいです。\n臨月のときに、破水したときに派手にマットレスまで濡らしました。妊婦の方にもお勧めです。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200cm", "star": 4, "reviewer": "ミヒート", "date": "2020-02-04", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2ZKES1UX4ISSI/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["送礼"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["颜色高级"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "易于使用的防水垫。然而，质地有点僵硬和粗糙。", "title_orig": "使いやすい防水マット。だけど肌触りがすこしゴワゴワ、ザラザラ。", "content": "防水、防螨、透气的床笠。\n角撑板部分长约 35 厘米，整个外侧都覆盖着橡胶，因此\n如果您使用普通床垫，它会很贴合并保持在原位，这很棒。\n我和我 16 岁的狗一起睡觉，他有时会漏尿，所以这个产品很有帮助。\n质地有点僵硬和粗糙。\n与其直接睡在本产品上，\n我认为如果您使用易于清洗且质地良好的加垫床单，您会睡得更舒服。", "content_orig": "防水、防ダニで、通気性がよいボックスシーツです。\nマチ部分は約35cmあり、全体の外側がゴムが付いているので、\n普通のマットレスならフィットしずれにくくてとても良いです。\n16歳の老犬と寝ていますが、たまにちょい漏れをするので、この商品は助かります。\n肌触りはすこしゴワゴワ・ザラザラしています。\nこの商品の上に直接寝るよりも、\n洗濯しやすく肌触りの良いパッドシーツを敷いた方が気持ちよく寝られると思います。", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "GrouchoSpeaks", "date": "2020-01-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R35ILXFD9EK080/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位", "防螨抗菌"], "冷感体验": ["无匹配标签"], "产品质量": ["品质牢固"], "感官感受": ["触感粗糙", "透气性好"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "易于放置在床垫上", "title_orig": "ベッドマットへのセットは容易", "content": "包裹床垫的床罩。\n它周围有弹性橡胶，因此您可以将其拉伸并将其包裹在床垫上。\n因此，安装和拆卸都很方便，并且在使用过程中不会移位。\n由于这种材料不透水，我把它设置好，每天晚上使用，以防止盗汗被吸收到床垫中。\n表面采用触感正常的布料制成，所以睡在上面不会不舒服，使用起来也很舒服。\n不过，我先洗了再用，但是很难擦干。\n根据预期用途，可能需要经常清洗产品，但您可能会犹豫是否这样做。", "content_orig": "マットレスごと包み込むタイプのベッドカバー。\n伸縮性の良いゴムが周囲に付いているので，思い切って引き伸ばして\nベッドマットごと包み込むようにセットできます。\nなので取り付け・取り外しは容易ですし，使用中にズレることもありません。\n水を通さない素材ということで，寝汗をベッドマットに吸わせないよう目的で\nセットして毎晩使っています。 020-01-05", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2ZYBZTBGDXLAS/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "我认为它的功能很好，但我希望图像中侧面的透明度更容易理解。", "title_orig": "機能的には良いと思うが・・側面の透け感は画像で分かりやすくして欲しかった", "content": "我认为它可以有多种用途，但在家里我将它用于我的狗。\n另一位家庭成员和我的狗一起睡觉，他们已经在床上使用了与该产品概念类似的防水床笠。\n\n我在一张单人床上使用了该产品，该床上配有无头高弹力床垫，该床垫安装在为宠物保留的空间中代替沙发的位置。\n这是您的家人和狗可以躺下玩耍，或者您的狗可以小睡的床。\n本来，我铺了防水床单，然后用普通床笠覆盖，但我决定使用它，因为我认为床笠本身如果防水的话会更好。\n\n我确实认为颜色、图案和设计乍一看很难看出它们是防水布，但是……\n就我个人而言，有一些部分我觉得是很大的困难。\n侧面的材料伸展性很好，很容易覆盖，但材料很薄，可以看到床垫本身。\n当然，为了将其用作床笠，假设有被子，所以我认为这不会有问题，因为它会成为睡觉或铺普通床时隐藏的地方。\n然而，如果你不用被子之类的东西隐藏它，家里的床垫本身和床垫都覆盖着防水床单，所以它们是完全可见的。\n\n我一直使用的防水床笠（我的家人和他们的狗睡觉时使用的）看起来就像普通的床笠，所以我对这款产品侧面的透明感更加不舒服。\n即使为了方便穿着而加强了弹性，即使是为了透气而采用了网布，但我觉得如果是这样透明的话，就显得廉价了。\n我感觉自己老得很快。\n\n比如，如果床垫是有图案的，床铺的填充物颜色不一致，从侧面看就会完全看出来，我觉得会显得很不雅观。\n\n在产品页面的图像中......由于某种原因，侧面看起来比顶部更暗，与真实的东西不同。\n如果它是灰色的，侧面会有一个深灰色的图像，所以你根本不会注意到它是透明的。\n另一方面，真正的东西是一种色调或更浅的纹理。\n如果侧面是产品图片中所示的深色，我认为它不会拾取床垫的颜色图案，无论是网状的还是透明的，这样就可以了。\n\n对于那些不太关心那么多而只想要功能的人来说，这是一款出色的产品。\n对于那些重视卧室内部和外观的人来说，这个产品似乎很缺乏。\n我认为如果某件事是独特的，就应该明确说明。\n如果您对购买感到满意，那很好，但如果您直到打开并安装后才知道它，您的印象将会非常不同。\n这是一个令人失望的产品。", "content_orig": "色々な使い方ができると思いますが、我が家では愛犬の為に使用です。\n愛犬と一緒に就寝は他の家族がしているのですが、そのベッドには本品と\nコンセプトが類似の防水ボックスシーツを既に使用しています。\n\n本品は、ペット専用のスペースにソファ代わりに設置している\nヘッドレスの高反発マットレスのシングルベッドに使用してみました。\n家族と愛犬が寝転がり戯れたり愛犬がうたた寝しているベッドです。\n元々防水シーツを敷いて、上から普通のボックスシーツを被せ設置していましたが\nボックスシーツ自体が防水タイプなら、尚良しだと思い使用しました。\n\n確かに防水シーツとは一見分からない色柄とデザインで良いと思いましたが・・\n個人的には、大きな難点だと感じる箇所がありました。\n側面の素材が伸びは良い為、被せやすくなっていますが非常に薄い素材の為\nマットレス本体が透けて見えてしまいます。\n当然「ボックスシーツ」としての使用には、掛け布団があることが前提なので\n就寝時や普通のベッドメイキングなら、隠れる場所なので問題ないとは思います。\nけれど、掛け布団等で隠さなければ・・マットレス本体とベッドパッド\n我が家の場合、そこに防水シーツも敷いているので、それらが丸見えになります。\n\nこれまで使用の（家族が愛犬と就寝時に使用）防水ボックスシーツは全く普通の\nボックスシーツに見えるため、余計に本品の側面の透け感に違和感を抱きました。\n被せやすいように伸縮性を強化しているとしても、通気性を考慮してメッシュに\nしているにしても、ここまで透けるとチープに見えるだけに感じました。\n経年劣化も早い気がします。\n\n例えば・・マットレスも柄物でベットパットも色に統一感が無ければ\n側面から見れば、丸見えなので非常に不格好だと思います。\n\n商品ページの画像では・・何故か実物とは異なり側面は上面に比べ\n濃い色に見えます。\nグレーなら、側面は一段階濃いダークグレーの画像が掲載されていて\n透け感あることは全く分かりません。\n実物は逆に一段階か、それ以上薄い色合いで質感です。\n商品画像通り側面が濃い色なら、メッシュであろうと透け感があろうと\nマットレスの色柄は拾わないと思いますので、それなら良かったのですが・・。\n\nそこまで拘らず機能性が有れば良い・・と思われる方には優れた製品です。\n寝室のインテリアや見た目も重視する方には、今ひとつな製品に思えます。\n特色がある物は、それも明記すべきと思います。\n納得して購入したなら、それで良しですが・・いざ開封し設置してみて\n初めて知るのでは印象が大きく違うと思います。\nその点が惜しい製品です。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200cm", "star": 3, "reviewer": "LUKE", "date": "2019-12-17", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/ROC2DHS9DRJ82/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "外观是完全正常的床笠", "title_orig": "外観は全く普通のボックスシーツ", "content": "这是我的第一张防水布。\n当我自己尝试时，它看起来完全正常，感觉非常好，以至于我无法看出这是一张普通的床单。如果您将其用于护理，该人可能不会注意到它。\n我实际使用的时候，睡在上面并没有感觉特别脆，也没有感觉床单下面用了乙烯基床单。现在是冬天，夏天透气性可能会差一些，但冬天你不会发现和普通床单有什么区别。\n\n我还不知道长时间使用后背面的防水涂层有多耐用，但到目前为止看起来还不错，我可能会推荐给儿童、护理人员和其他不想让垫子弄湿的人。", "content_orig": "初めての防水シーツです。\n自分で試してみて、見た目は全く普通で手触りも普通のシーツと判断がつかない位の感触ですね。もし介護で使う場合に本人には気付かれないかも?\n実際に使ってみても寝心地も特段パリパリ?ビニールシートをシーツの下に使った時の感じもしないのですね。今は冬で夏場は通気性が若干悪いかも?ですが、冬場は普通のシーツとの違いを特段感じない位ですよ。\n\n長期間使ったら、裏の防水コートの耐久性等はまだ判りませんが、今の所良い感じ、子供、介護、その他でマットまで濡れたら困る方にオススメかもです。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200cm", "star": 4, "reviewer": "ax2", "date": "2019-12-17", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3TZ9HEM468PFG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z5BDFHV", "title": "它也可用于狗。", "title_orig": "わんこ用にも使えます。", "content": "有时我的狗和我一起睡在床上，我不用担心他犯错。将它放在床垫上，您就可以使用它，而不必担心弄脏床垫。穿着时，腋下伸展良好，方便穿着和清洗。", "content_orig": "一緒にベッドでワンコが寝るときがあり、そのとき失敗するのを心配しなくていいようになりました。マットレスの上に敷いておくと、マットレスまで汚れると言うことを心配することなく使えます。ひくときには、脇の部分がよく伸びるので、装着しやすく、洗濯も簡単です。", "model": "色: グレー（タオル生地） | サイズ: シングル・100X200c /srp/-/R1SSW33OI0WTIU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["品质牢固"], "感官感受": ["触感舒适", "透气性好"], "价值体验": ["无匹配标签"]}, {"asin": "B07Z59YB37", "title": "表面光滑", "title_orig": "表面はサラサラしています", "content": "我尝试使用它，因为它被称为防水片。\n由于边缘由可拉伸材料制成，因此安装很容易。\n毛巾面料触感光滑。\n您可以放心，这些床单将保护您的蒲团和床垫。\n性价比也还不错，推荐有小孩和老人的家庭。", "content_orig": "防水シーツと言う事で使ってみました。\n取り付けはフチが伸びる素材なので簡単です。\n肌触りはタオル地でサラサラ。\nこのシーツで布団やマットレスが保護されるので安心です。\nコスパも悪くないので、お子さんが居る家庭やお年寄りにもお勧めです。", "model": "色: グレー（タオル生地） | サイズ: セミダブル・120X200cm", "star": 4, "reviewer": "KT", "date": "2019-11-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1GT686BQAXRD0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["性价比高"]}];

const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else if(dim === '使用人群'){
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可展开/收起日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
