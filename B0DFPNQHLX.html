也不会粘在皮肤上，也没有冷感材料的滑感，因此无论什么季节都可以轻松使用。米色也是一种平静的颜色，可以很好地融入卧室。\n\n它很容易用橡胶固定在四个角上，并且易于拆卸清洗。洗完后，可以调整形状并悬挂晾干，这样更容易晾干，而且易于清洗也很有帮助。我认为它适合那些追求可以日常使用、可以经常洗涤的实用性而不是奢华的人。\n", "content_orig": "タオル地の敷きパッドが好きなので購入しました。ホテルの寝具のような厚手でふかふかのタイプではなく、さらっとした普通のタオルに近い肌触りです。最初は少し薄いかなと思いましたが、寝てみると暑苦しくなく、普段使いにはこのくらいがちょうどよく感じました。\n\n汗をかく時期でも肌に張り付きにくく、冷感素材のようなツルツル感がないので、季節を問わず使いやすいです。ベージュも落ち着いた色で、寝室になじみました。\n\n四隅のゴムで簡単に取り付けられ、洗濯のために外すのも楽です。洗った後は形を整えて干せば乾きやすく、気軽に洗えるところも助かります。高級感よりも、毎日使えてこまめに洗える実用性を求める方に合うと思います。\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ベージュ", "star": 5, "reviewer": "ちん", "date": "2026-07-11", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1FE2LTY9NRTYK/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["冷感", "颜色", "不易移位"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPNNNZ2", "title": "最低品质", "title_orig": "最低品質", "content": "使用一周后出现一个洞。没有耐用性。\n", "content_orig": "使用1週間で穴が空いた。耐久性無し。\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ネイビー", "star": 1, "reviewer": "恐怖のみそ汁", "date": "2026-07-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R77ZTHZJTLTGB/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPM1RX2", "title": "夏季绒毛面料光滑清爽🛌", "title_orig": "夏向きパイル地がサラサラ爽やかで心地良い🛌", "content": "我正在为我的孩子寻找毛巾布垫。\n我一收到就洗了，天气晴朗，所以大约一个小时就干了。\n我忘记把它放到网上了，只是把它放在洗衣机里洗了，但它没有磨损，仍然状况良好。\n我非常喜欢它，所以我立即订购了它进行新的清洗。\n", "content_orig": "子供用に、パイル地の敷きパッドを探していました。\n届いてすぐに洗濯をして、晴れていたので１時間程で乾きました。\nネットに入れ忘れて、そのまま洗濯機で洗ってしまいましたが、ほつれることもなくキレイな状態のままです。\n大変気に入りましたので、洗い替え用に即リピートしました。\n", "model": "サイズ: 02.セミダブル | スタイル: パイル/2024年モデル | 色: ブルー", "star": 5, "reviewer": "MATIRDA", "date": "2026-07-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3CY5YBN1UR2YO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": [" 200cmにはセミダブルサイズをお勧めします、\n余裕でピッタリです。\n", "model": "サイズ: 02.セミダブル | スタイル: パイル/2024年モデル | 色: アイボリー", "star": 5, "reviewer": "越前海岸の釣り人", "date": "2026-06-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2RDPAN6E52DX7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPNNNZ2", "title": "我对这个叫西川的品牌感觉很好。", "title_orig": "西川っていうだけのブランドの気分がいい", "content": "西川的产品价格便宜，但触感良好，尽管可能会积聚一点热量。\n", "content_orig": "西川の商品では安いけど 肌触りはいいですよ\n少し熱は こもる かもしれませんけど\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ネイビー", "star": 4, "reviewer": "Amazon カスタマー", "date": "2026-05-29", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3OKPCD740MRX7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFP167D4", "title": "太好了！", "title_orig": "良かったです！", "content": "我寄给了远方的妈妈。\n我对它的顺畅和愉快的感觉感到非常满意。\n", "content_orig": "遠方の母に送ったのですが、\nサラサラして気持ちが良い、と\nとても喜ばれました。\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ピンク", "star": 5, "reviewer": "tomo", "date": "2026-05-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R201EZB0P7HKPS/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPNNNZ2", "title": "西川品牌是决定因素！", "title_orig": "西川ブランドが決め手！", "content": "在夏季，您很容易盗汗，因此拥有可供选择的床垫很有用。我需要这个才能在干净的床上睡个好觉，我选择它的原因是因为它是西川品牌，但价格便宜。放在床上时很厚实且舒适。\n", "content_orig": "夏のシーズンは寝汗をかくので選択できる敷きパッドは重宝します。清潔なベッドでの安眠には、これが必要となり、また西川ブランドなのに安かったのが選んで決めた理由です。ベッドに敷くと厚みもあるので快適です。\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ネイビー", "star": 5, "reviewer": "Sea Masters", "date": "2026-05-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R32M1JP9848Q55/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配 我能够安心地睡觉，没有任何问题。\n运输又快又好。\n", "content_orig": "大掃除を機にくたびれた敷きパットを買い替えました。\n綿100%で流石安定の西川、何の問題もなく快適に眠れました。\n発送も早くて良かったです。\n", "model": "サイズ: 02.セミダブル | スタイル: パイル/2024年モデル | 色: アイボリー", "star": 5, "reviewer": "のぞみん", "date": "2025-12-29", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RV6SU20CQH4JI/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPJFRQL", "title": "使用方便且不会滑落", "title_orig": "使いやすくズレない", "content": "之前买的已经过时了，所以买来替换的。没有什么特别的问题。可用性和舒适度都是一样的，很舒服。\n", "content_orig": "以前購入したものがもう型落ちなので買い替えの為購入　特に問題無し使い勝手も寝心地も同じで快適です\n", "model": "サイズ: 01.シングル | スタイル: パイル/2024年モデル | 色: ブルー", "star": 5, "reviewer": "Amazon カスタマー", "date": "2025-12-29", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R391FGTJ8KI3N1/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DFPNQHLX", "title": "光滑的绒毛使其适合全年使用。", "title_orig": "さらっとしたパイル感で一年中いけそう", "content": "我想一年四季都使用类似毛圈布的床垫，之所以选择它，是因为它的绒头部分是 100% 纯棉，吸水性很好的描述所吸引。单人尺寸为 100 x 200 厘米，可清洗的床垫方便日常使用。\n\n接触皮肤的一面是绒毛的，正如评论者所说，摸起来感觉“比蓬松更丝滑”，很多人说即使在夏天也可以使用它而不粘腻，这一点我很满意。有评论称，即使使用了一整个夏天，它也不容易起球或起毛，因此每天用作睡觉的地方感觉很安全。另一方面，一些评论说毛巾比想象中的硬，摸起来有点粗糙，所以如果你是对毛巾的蓬松感抱有强烈期望的人，你一开始可能会想，“嗯，也许比我想象的要光滑一些。”由于它的吸汗性很好，有人说如果不洗的话它会变得潮湿，所以假设你经常洗的话，使用它似乎是个好主意。有很多评论说它洗后干得很快，这是一件好事，因为它可以减轻日常使用的压力。\n\n我原本打算将它用作四季皆宜的床垫，但由于它是双面的并且可以全年使用，所以我发现即使季节变化也很容易使用。\n\n价格约为2,200日元，考虑到100%棉绒表面、易洗性和耐用性，我认为在这个价格上这是一个容易选择的系列。\n\n它似乎适合那些喜欢毛巾的光滑感觉并希望在整个季节使用同一个床垫的人。那些想要厚实、蓬松的质地或湿润、拉丝的感觉的人可能有点偏离目标，所以如果你考虑到这一点，你可能会感到满意。\n", "content_orig": "タオル地っぽい敷きパッドを一年通して使いたくて、パイル部分が綿100％で吸水性が良いという説明にひかれて選びました。サイズがシングル100×200cmで、洗える敷きパッドというのも日常使いしやすそうだと思ったポイントです。\n\n肌に当たる面はパイルで、触った感じはレビュー通り「ふわふわ系というよりさらっと寄り」な印象で、夏でもベタつきにくく使えましたという声が多いのが納得でした。実際にひと夏使っても毛玉や毛羽立ちが出にくかったという口コミもあり、毎日寝る場所としては安心感があります。反面、想像より硬め・少しザラっと感じるというレビューもあって、タオルのふんわり感を強く期待している人だと最初は「あれ、思ったよりサラサラ ;

const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
