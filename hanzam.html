<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐天麻布垫 评论洞察分析 — 麻质敷布垫（Rakuten）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #eef3f2;
    --panel: #ffffff;
    --ink: #12262a;
    --ink-soft: #4c6167;
    --teal-900: #0c4a52;
    --teal-700: #0e7c86;
    --teal-500: #2ca6a4;
    --teal-300: #8fd0cd;
    --teal-100: #dcf0ee;
    --sun: #e7a13b;
    --clay: #c1502e;
    --line: #d3e2e0;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 0%, rgba(44,166,164,0.10), transparent 42%),
      radial-gradient(circle at 96% 10%, rgba(12,74,82,0.08), transparent 40%);
    color: var(--ink);
    font-family: "Hiragino Sans GB","PingFang SC","Noto Sans SC","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:1360px;margin:0 auto;padding:40px 28px 80px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    border-bottom:2px solid var(--teal-900);
    padding-bottom:22px;margin-bottom:28px;flex-wrap:wrap;
  }
  header.top .titleblock h1{
    font-size:30px;margin:0 0 6px;letter-spacing:.2px;color:var(--teal-900);
    font-weight:700;
  }
  header.top .titleblock p{margin:0;color:var(--ink-soft);font-size:14px;}
  header.top .asinlist{font-size:12px;color:var(--ink-soft);max-width:520px;line-height:1.7;}
  header.top .asinlist b{color:var(--teal-700);}

  .stats{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px;
  }
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 22px;min-width:150px;flex:1;
  }
  .stat .num{font-size:26px;font-weight:700;color:var(--teal-900);}
  .stat .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .section-title{
    font-size:15px;font-weight:700;color:var(--teal-900);
    margin:38px 0 16px;padding-left:10px;border-left:4px solid var(--teal-500);
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 12px;position:relative;
  }
  .card h3{margin:0 0 2px;font-size:16px;color:var(--ink);}
  .card .hint{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;}
  .chart-holder{position:relative;height:280px;}
  .legend-list{
    display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .legend-item{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
    cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .15s;
  }
  .legend-item:hover{background:var(--teal-100);color:var(--teal-900);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-item .cnt{font-weight:700;color:var(--ink);}

  /* Modal */
  .modal-mask{
    display:none;position:fixed;inset:0;background:rgba(12,30,32,.45);
    z-index:999;align-items:flex-start;justify-content:center;padding:5vh 20px;
    backdrop-filter: blur(1px);
  }
  .modal-mask.open{display:flex;}
  .modal{
    background:#fff;border-radius:16px;max-width:1040px;width:100%;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{
    padding:18px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .modal-head .htxt h2{margin:0;font-size:18px;color:var(--teal-900);}
  .modal-head .htxt p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .modal-head .close-btn{
    border:none;background:var(--teal-100);color:var(--teal-900);width:32px;height:32px;
    border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .modal-search{padding:12px 24px;border-bottom:1px solid var(--line);}
  .modal-search input{
    width:100%;padding:9px 14px;border-radius:8px;border:1px solid var(--line);
    font-size:13px;background:var(--bg);outline:none;
  }
  .modal-search input:focus{border-color:var(--teal-500);}
  .modal-body{overflow:auto;padding:0 24px 20px;flex:1;}
  table.reviews{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.reviews thead th{
    text-align:left;position:sticky;top:0;background:#fff;
    padding:10px 8px;border-bottom:2px solid var(--teal-900);color:var(--teal-900);
    white-space:nowrap;
  }
  table.reviews tbody td{
    padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink);
  }
  table.reviews tbody tr:hover{background:var(--teal-100);}
  .star-badge{
    display:inline-block;padding:1px 8px;border-radius:20px;font-weight:700;font-size:11.5px;
  }
  .s5{background:#dcf0ee;color:var(--teal-700);}
  .s4{background:#e6f2ce;color:#5a7a1a;}
  .s3{background:#fdefd0;color:#a06b0d;}
  .s2{background:#fbe0d0;color:#a44a1f;}
  .s1{background:#f7d6d6;color:#a3312f;}
  td.content-cell{max-width:340px;}
  td.content-cell .orig{color:var(--ink-soft);font-size:11px;margin-top:3px;}
  .empty-hint{padding:40px;text-align:center;color:var(--ink-soft);font-size:13px;}

  footer{margin-top:50px;color:var(--ink-soft);font-size:11.5px;text-align:center;}

  @media (max-width:640px){
    .wrap{padding:24px 14px 60px;}
    header.top h1{font-size:22px;}
    .chart-holder{height:230px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="titleblock">
      <h1>评论洞察分析 · 麻质敷布垫（Rakuten）</h1>
      <p>乐天麻布垫 · 乐天(Rakuten)评论数据 · 导出日期 2026-09-08</p>
    </div>
    <div class="asinlist" id="asinlist"></div>
  </header>

  <div class="stats" id="statsRow"></div>

  <div class="section-title">星级与人群分布</div>
  <div class="grid" id="gridTop"></div>

  <div class="section-title">使用期望 · 客户购买时希望达成的目的与改进诉求</div>
  <div class="grid" id="gridExpect"></div>

  <div class="section-title">实际体验感受</div>
  <div class="grid" id="gridExperience"></div>

  <div class="section-title">价值体验</div>
  <div class="grid" id="gridValue"></div>

  <footer>点击任意扇区或图例，可查看对应标签下的具体评论内容原文与译文。</footer>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <div class="htxt">
        <h2 id="modalTitle">数据详情</h2>
        <p id="modalSub"></p>
      </div>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-search">
      <input type="text" id="modalSearch" placeholder="在结果中搜索关键词…" oninput="renderTable()">
    </div>
    <div class="modal-body">
      <table class="reviews">
        <thead>
          <tr>
            <th>ASIN</th><th>星级</th><th>标题</th><th>评论内容</th><th>型号</th><th>评论人</th><th>日期</th>
          </tr>
        </thead>
        <tbody id="modalTbody"></tbody>
      </table>
      <div class="empty-hint" id="emptyHint" style="display:none;">未找到匹配的评论</div>
    </div>
  </div>
</div>

00パーセントでのお値段なので、お得だと思いました。（実用品・普段使い｜自分用｜はじめて）", "content_orig": "", "model": "", "star": 5, "reviewer": "購入者さん", "date": "2022/07/15", "link": "", "使用人群": ["自用"], "使用期望": ["冷感", "具有性价比"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "", "content": "悩んで悩んで家族分購入しましたが、大満足です。シャリっと熱り心地とひんやりとした感覚がとても気持ち良いです。綿のシーツだと、汗っかきの息子のベッドが汗臭かったのが、麻に変えただけで臭さが無くなり、そこが一番の驚きでした。…（以下省略、実用品・普段使い｜自分用｜はじめて）", "content_orig": "", "model": "", "star": 5, "reviewer": "mon116さん", "date": "2022/06/28", "link": "", "使用人群": ["自用"], "使用期望": ["冷感"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "夏はコレ。", "title_orig": "", "content": "昨年に続き追加購入しました。汗かきの家族もサラッとして気持ち良いと言っています。ラベンダー色も素敵で、これから使うのが楽しみです。（実用品・普段使い｜家族へ｜リピート）", "content_orig": "", "model": "", "star": 5, "reviewer": "購入者さん", "date": "2022/06/08", "link": "", "使用人群": ["自用"], "使用期望": ["触感舒适"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "申し分なし！", "title_orig": "", "content": "リネン良さは分かってはいるものの、それでも肌触りが違う！中綿までリネンでこのお値段はとってもお得でした。（実用品・普段使い｜家族へ｜はじめて）", "content_orig": "", "model": "", "star": 5, "reviewer": "そうまめ2177さん", "date": "2022/05/12", "link": "", "使用人群": ["自用"], "使用期望": ["触感舒适", "具有性价比"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "", "content": "お高いですが、夏の睡眠時の不快感をどうにか軽減したく、レビューが良かったので買ってみました。心地よく眠ることができ、大変満足しています。家族分買い足し、なかなかの値段なりましたが、本当に買って良かったと思います。…（以下省略、実用品・普段使い｜家族へ｜はじめて）", "content_orig": "", "model": "", "star": 5, "reviewer": "梅照たあこさん", "date": "2022/03/28", "link": "", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "", "title": "", "title_orig": "", "content": "ハリのあるしゃりしゃりとした触り心地で、触るとひんやりします。ベッドに敷いて横になってみると、熱がこもらずとても快適です。麻ですが、ごわごわすることなく肌あたりも良いので、購入してよかったです。（実用品・普段使い｜家族へ｜はじめて）", "content_orig": "", "model": "", "st const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

// ---------- stats ----------
function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- build all cards ----------
renderStats();

makeCard(document.getElementById('gridTop'), {
  id:'chartStar', title:'星级分布', dim:'star',

makeCard(document.getElementById('gridExperience'), {

});
makeCard(document.getElementById('gridExperience'), {

makeCard(document.getElementById('gridExperience'), {

</script>
