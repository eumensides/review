_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBVKZN", "title": "质量有变化吗？", "title_orig": "品質が変わった？", "content": "我几年前买了它，对它非常满意，所以我又买了它。看起来质量已经明显改变了。织物干燥，感觉就像在灼伤您的皮肤。每次我洗它，它都会缩水得令人难以置信。久森的蒲团质量也较差。\n", "content_orig": "数年前に購入して良かったので、再度購入。明らかに品質が変わった気がします。生地はカラカラとしていて、肌が焼けるような感覚がします。洗うたびにあり得ないくらい縮みます。クモリの布団の方もクオリティが下がっていた\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 1, "reviewer": "koki", "date": "2024-02-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2RIN1BHUXP08U/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C27Q9P7Y", "title": "由100%纯棉制成，不蓬松但有光泽。", "title_orig": "綿100％でふわふわ系ではなくツヤツヤ系です。", "content": "P.S.）多次洗涤（轻柔洗涤）后，我开始注意到织物表面起毛或变质。耐久性不太好。\n ────────────────────────────────────────────────────────────────────────────\n\n由于是棉质床单，因此透气性和保暖性达到了很好的平衡，所以一年四季都可以使用。\n表面不是蓬松的，而是光滑的，所以冬天戴上的那一刻感觉有点冷，但它很快就能保持热量，让你睡得很舒服。\n吸汗效果很好，冬天出汗也可以使用。我认为这是棉床单的一大优点。\n\n尺寸没有其他问题，而且这些床单的价格也不错。\n\n附：洗过几次后，感觉表面起毛或变质的速度还算快。\n", "content_orig": "追記)何度が洗濯(弱洗濯)したら生地表面の毛羽立ちというか劣化感が良く分かるようになりました。耐久性はいまいちです。\nーーーーーーーーーーーーーーーーーーーーーーーーーー\n\n綿シーツなので通気性と保温性のバランスも良くて年中使えます。\n表面がふわふわ系ではなくサラサラツルツル系なので、冬は床入りした瞬間に少しヒヤっとしますがすぐに保温されて快適に眠れます。\n汗もしっかり吸ってくれるので冬の汗かきにも対応できます。このへんは綿シーツの大きなメリットだと思います。\n\nその他サイズ感などの問題もなく価格設定も悪くないシーツです。\n\n追記\n何度か洗った所、表面の毛羽立ちというか劣化はそこそこ早いと感じました。\n", "model": "色: オリーブ | サイズ: シングル・100X200cm", "star": 3, "reviewer": "とるとる", "date": "2024-02-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1R3OQD88LI62T/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用", "吸湿"], "冷感体验": ["无匹配标签"], "产品质量": ["耐洗不变形", "起球"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0C27Q9P7Y", "title": "由100%纯棉制成，触感良好。据说四季皆宜，但冬天却很冷。", "title_orig": "綿100％で触り心地も良いのです。オールシーズン対応との事ですが、冬場は冷たくヒンヤリします。", "content": "它由 100% 棉制成，相当厚实，所以摸起来很舒服 itle": "当我把它放进烘干机时它烧焦了。", "title_orig": "乾燥機に入れたら焦げた", "content": "当我打开包装时，我注意到一股气味，所以我在使用前将其放入洗衣机和烘干机中，但尽管我从未使用过它，但其中一些融化并燃烧了。确实，如果仔细观察显示，烘干机似乎无法使用。是我的错忽略了这一点，所以我也没办法，但我不认为出售时有提到它与烘干机不兼容。如果因为花粉季节而无法在室外晾衣服怎么办？我希望至少在购买之前就被告知了。\n", "content_orig": "パッケージを開けた時に臭いが気になったので、使用前に洗濯機と乾燥機にかけたところ、一度も使ってないのに一部が溶けて焦げてしまいました。確かに表示をよく見ると乾燥機は使えないようです。見落とした自分も悪いので仕方がないのですが、販売する際乾燥機非対応などの記載がなかったように思います。花粉の季節なので外に干せない時はどうしたら良いのでしょうか。せめて購入前に事前に教えて欲しかったです。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 1, "reviewer": "黒柴", "date": "2023-02-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RWGBFPGMCKUPU/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBT39Y", "title": "床很好，但只有床垫，感觉被利用了", "title_orig": "Good bed but only mattress and felt taken advantage", "content": "舒适的床。他们本来会得到 5 的开始，但我认为它会带有一个框架，因为我搜索了带有框架的床，并且照片都显示它带有框架，而不是像其他网站那样单独显示。所以我感觉有点被骗了。这只是床垫，因此会产生误导，因为套装推荐也显示它带有框架。我认为他们应该只放一张床垫的照片，尤其是在退房时。所以请注意，这只是我觉得不错的床垫。\n", "content_orig": "Comfortable bed. They would have gotten a 5 start but I thought it was going to be coming with a frame as I did my search of beds with frame and the photos all show it with a frame and not alone as other sites. so I felt a little cheated. This is only the mattress so it is misleading because the set package recommendation also shows it with frame. I think they should put a photo of the mattress only by itself especially at check out. So take note, this is only the mattress which I found good.\n", "model": "色: ホワイト | サイズ: クイーン・160X200cm", "star": 3, "reviewer": "R Brown", "date": "2023-02-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2CIYZR3OW2LC0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBQ935", "title": "我正在使用它，没有任何问题。", "title_orig": "問題なく使っています。", "content": "这很正常。如果你说 content": "我很期待使用它，因为它对我的皮肤感觉非常好。\n买来后，我尝试先洗一次再使用，但洗完后发现线头有部分松脱了。\n自从打开以来，我还没有看过所有的东西，也没有洗过它，所以我不知道是从一开始还是因为我洗过它，但如果洗一次后线就松开了，我会担心未来，因为床单经常被洗。\n", "content_orig": "肌触りが良く使うのを楽しみにしておりました。\n購入してから、1度洗濯をして使用しようと思い、洗濯をしましたら、糸が解れた箇所を見付けました。\n開封してから、全てくまなく見て洗濯をしたわけでは無いので、最初からなのか、洗濯をしたからなのか、分かりませんが、1度の洗濯で糸が解れてしまう様では、シーツはよく洗う物なので…先が思いやられます。\n", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 3, "reviewer": "naraland", "date": "2021-07-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2X8L50LWSL7RE/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["耐洗不变形", "开线"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBVKZN", "title": "半双人间", "title_orig": "セミダブル", "content": "我夏天买的，因为它是棉质的，而且很便宜，所以我可以把它放在床单下面。无论如何，尺寸很小。即使用卷尺测量，高度也特别矮。\n ○我会回购Kawa等大厂的产品。\n", "content_orig": "シーツの下に敷いて使うため、夏にむけて、綿素材だからよいとお安いので購入。とにかくサイズが小さい。メジャーで計っても、縦が特に短いです。\n○川とか、大手メーカーのものを買い直します。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 2, "reviewer": "にゃんこ", "date": "2021-06-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2NDV46CDKBD3A/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XB7VVS", "title": "有一处有污垢...", "title_orig": "一ヶ所汚れが……", "content": "发货很快，第二天就到了，但是有一个地方看起来像泥土。\n我不会退货，因为看起来洗的时候会脱落，但我很难过。\n", "content_orig": "迅速な発送で，次の日に届きましたが…一ヶ所汚れのような箇所がありました。\n洗濯したら落ちそうなので，返品はしませんが…悲しかったです。\n", "model": "色: グレー | サイズ: セミダブル・120X200cm", "star": 2, "reviewer": "AKIHO", "date": "2021-05-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3PREUTKR53XDE/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBVJ8S", "title": "柔软的", "title_orig": "柔らかい", "content": "很舒服。\n", "content_orig": "ここちよかったです。\n", "model": "色: アイボリー | サイズ: クイーン・160X200cm", "star": 3, "reviewer": "Amazon カスタマー", "date": "2021-05-15", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2RDY5BIEAIT98/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBY61W", "title": "我感觉自己很小", "title_orig": "気持ち小さいような", "content": "总体来说，透气性和快干没有问题，不过我是用来当床垫的。\n感觉有点小。缩小了吗？\n", "content_orig": "全体的には通気性、速乾性と問題ないのですが、ベッドパッドとして使っていますが、\nやや小さい感じがします。縮んだ？\n", "model": "色: アイボリー | サイズ: シングル・100X200cm", "star": 3, "reviewer": "おもち", "date": "2021-04-05", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2Z7ZQ7XKUK5ZE/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["速干"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XB7VVS", "title": "缝线很差，有污渍。", "title_orig": "縫製が悪い上に汚れがあった", "content": "首先，在打开包装之前我注意到有红色污渍。\n当我打开包装并检查是否有其他污渍时，我很失望，因为缝线比污渍更糟糕。\n\n很遗憾，因为评论很好。\n\n我把它退回来了。\n", "content_orig": "まず、開封前に赤い汚れに気付きました。\n開封し他にも汚れ部分がないか確認したところ、汚れよりも縫製が悪すぎてがっかりしました。\n\n評価がよかっただけに、残念です。\n\n返品しました。\n", "model": "色: グレー | サイズ: セミダブル・120X200cm", "star": 1, "reviewer": "msplo07", "date": "2021-04-01", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R5V429QLUQ7V/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBVKZN", "title": "不要被过多的评论所迷惑", "title_orig": "あまり口コミにまどわされないように", "content": "我刚刚遭受压缩性骨折，所以它对我来说太僵硬，导致我的背部和臀部疼痛，所以不幸的是它不适合我。\n", "content_orig": "圧迫骨折していた直後でしたので、私には固すぎて、背中や腰が痛くて、残念ながら合わなかったです。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 1, "reviewer": "みっこ", "date": "2021-03-15", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R16888F0XIRQ0X/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XC5KX9", "title": "冬天冷吗？", "title_orig": "冬には冷たい？", "content": "虽然号称四季皆宜，但在寒冷的房间里确实感觉凉爽，所以如果您想要温暖的床单，我们建议使用公司提供的其他面料制成的床单。我觉得除了冬天以外什么都适合。\n而且，它给人的感觉也不像天然材料。它具有类似化学纤维的光滑质感。\n", "content_orig": "オールシーズン向けとはいうものの、寒い部屋の中ではひやっとした感触になるので、暖かいシーツがお望みの方は同社が提供するほかの生地でできたものをお勧めします。冬以外にはいいと思います。\nあとあんまり天然素材という感じがしません。化学繊維ぽいつるっとした触感です。\n", "model": "色: アイボリー | サイズ: セミダブル・120X200cm", "star": 3, "reviewer": "カス タマー", "date": "2021-01-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R150O0GMYF515W/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBQ935", "title": "垫上的棉花", "title_orig": "敷きパットから綿", "content": "里面的纤维是从床垫里出来的，如果你睡了一整夜，很多棉状的纤维就会粘在你的睡衣上。我用了3天就停了。\n", "content_orig": "敷きパットから中の繊維が出てきて　一晩寝るとパジャマに綿のような繊維が沢山付く。3日使って止めた。\n", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 1, "reviewer": "ぷんぷん😡", "date": "2021-01-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1L208UTC6N9OQ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBV36B", "title": "很脏", "title_orig": "よごれてた", "content": "不可能的。是重用吗？\n不知道为什么这么脏，虽然是全新的，但看上去就像是用过的一样。\n也许是因为我很流利。\n", "content_orig": "ありえない。使い回しとかですか？\n新品でなんでこんな汚れが付くのかわかんない\nなんか使用感もあるように感じます。\nペラペラだからかな。\n", "model": "色: ホワイト | サイズ: ダブル・140X200cm", "star": 1, "reviewer": "多和田悠香", "date": "2020-12-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1WPX5U6R165QO/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XCB7LX", "title": "不适合冬天", "title_orig": "冬には向かない", "content": "我买它是因为它适合所有季节，但在不被体热加热的区域保持凉爽。我认为这是不需要加热时的完美产品。\n", "content_orig": "オールシーズンということで購入しましたが、体温で温まっていない場所は冷んやりしています。暖房のいらない時期には最適な商品だと思います。\n", "model": "色: グレー | サイズ: ダブル・140X200cm", "star": 3, "reviewer": "Amazon カスタマー", "date": "2020-12-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2JA8WK2G9LJK4/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBQ935", "title": "我很失望。", "title_orig": "とても残念です。", "content": "我为我的家人买了它。\n其中一张背面有一个约5毫米大小的洞，甚至还贴有一张贴纸，估计是检查时贴的。\n我真的很喜欢这个产品本身，但由于我不能换货，只能接受退货，所以我别无选择，只能使用它。\n", "content_orig": "家族分購入しました。\nうち1つ裏側に5ミリくらいの穴が空いており検品時に貼ったであろうシールまでついてました。\n商品自体はとても気に入ってますが交換が出来ず、返品のみ対応なので仕方なく使うことにします。\n", "model": "色: グレー | サイズ: シングル・100X200cm", "star": 1, "reviewer": "Amazon カスタマー", "date": "2020-12-09", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RIQ21C0FME1H0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBWGB5", "title": "可水洗，脏了也能轻松清洗", "title_orig": "Washable, when it gets dirty easy to wash", "content": "易于使用和清洗\n", "content_orig": "Easy to use and wash\n", "model": "色: アイボリー | サイズ: キング・180X200cm", "star": 3, "reviewer": "Bong", "date": "2020-12-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R6EZ0XYZAWXCM/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBJK22", "title": "没有太多的缓冲感", "title_orig": "クッション感はあまりない", "content": "因为它是一个床垫，我认为它会提供更多的缓冲，但我并没有真正感觉到它。\n不过现在是冬天了，保温性有所提高，所以还是比较满意的。\n", "content_orig": "敷きパッドなので多少クッション性が上がるかなと思ったのですがあまり感じられなかったです。\nただ冬場なので断熱性は上がったので満足感はある。\n", "model": "色: ホワイト | サイズ: セミダブル・120X200cm", "star": 3, "reviewer": "ラン", "date": "2020-12-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1F3P80GXTVZ3S/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XBT39Y", "title": "嘈杂", "title_orig": "Noisy", "content": "嘈杂\n", "content_orig": "Noisy\n", "model": "色: ホワイト | サイズ: クイーン・160X200cm", "star": 1, "reviewer": "James", "date": "2020-11-12", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RNUQ3957YZ1F6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XC5KX9", "title": "广告符号有问题。", "title_orig": "広告表記に問題あり。", "content": "既然广告上说外层材质是100%棉，我想很多人都会以为里面也是100%棉，但其实里面是100%聚酯纤维。床垫外层仅使用天然材料是没有意义的。\n人们常说，您的身体在一晚上产生的汗液相当于一瓶奶的量。天然材料可适当调节和排汗。聚酯纤维不具备该功能。\n顺便说一句，我们经常使用的是 100% 羊毛床蝠。\n我在家洗的时候发现它缩水了，所以我想如果是100%纯棉的就好了，所以就买了。\n羊毛可以适当调节湿度。如果穿着不调节的合成纤维，盗汗就会导致冷汗，使身体寒冷。如果你的身体很冷，你就无法睡个好觉。\n选择棉质、羊毛、丝绸等材质的床上用品是有逻辑的。\n它没有那么厚，所以你不能指望有太多的缓冲作用。\n我们使用的纱布材料是棉和合成纤维的混合物，质量很好。\n我以为如果是 100% 棉的话也会是一样的，但是当我收到它时，我很失望，因为它是这么便宜的材料。\n", "content_orig": "表地が綿１００％と宣伝しているので、中のワタまで綿１００％なのかと勘違いして手に入れてしまう人が続出だと思うけど、中身はポリエステル１００％です。ベッドパットを表地だけ天然素材にしても全く意味がありません。\n体からは一晩で牛乳瓶●本分の汗が出る、とよく言われますよね。天然素材はちゃんと、その汗を調整して発散させてくれます。ポリエステルにその機能はありません。\nちなみにうちで正規に使っているのは、ウール１００％のベッドバットです。\nこれがうちで洗うと縮むので、綿１００％ならいいなぁと思って手に入れたのです。\nウールは、湿度をちゃんと調整してくれます。調整しない化学繊維を身にまとうと、寝汗がそのまま汗冷えにつながって、体が冷えてしまいます。体が冷えると良い睡眠がとれません。\n綿、ウール、絹、などの寝具を選ぶにはちゃんと理屈があるのです。\n厚みもそれほどないので、クッション性に期待もできません。\nうちで使っている綿と化繊の質を上手にハイブリッドにしたガーゼ素材のパシー●は良いです。\n綿１００％ならそれと同じなのかな、と思って届いたのをみたら、あまりに安い素材なので、がっかりしました。\n", "model": "色: アイボリー | サイズ: セミダブル・120X200cm", "star": 2, "reviewer": "アマゾン太郎", "date": "2020-10-16", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R18VXGFRYLXBRH/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B085XB7VVS", "title": "表面由光滑的棉质材料制成。具有一定缓冲性能的床垫。", "title_orig": "表面はサラサラした綿素材。ある程度クッション性もある敷きパッド。", "content": "目前小双人床垫的价格为3280日元。\n我认为价格合理，因为它的衬垫很好，缝制也很仔细。\n表面由 100% 棉制成，是一种坚固的编织材料。\n该面料编织精细，触感光滑。\n衬里为 100% 聚酯纤维，纯白色、光滑的材料。\n填充物也是 100% 聚酯纤维。\n它不是很厚，但大约有1厘米厚，所以提供了一些缓冲作用。\n （当你对它施加重量时，填充物会塌陷，所以它会变薄。）\n四个角缝有实心橡胶，宽度为3厘米。\n如果是厚床垫，橡胶可能会随着时间的推     <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
