mazon カスタマー", "date": "2026-07-08", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R38AD4P38Z265L/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TJY5ST", "title": "优良的防水性。", "title_orig": "撥水性は抜群。", "content": "我买这个是因为我的猫有时会在床上撒尿。衬里看起来像乙烯基，因此具有极强的防水性，但对人体来说不透气，因此在夏季会感到闷热。另外，清洗前请彻底沥干。\n", "content_orig": "猫が、たまにベッドでオシッコしてしまうので購入しました。裏地がビニールみたくなっていますので撥水性は抜群ですが、人間にとっては通気性が良くないため夏シーズンは蒸れ感はあります。それと、洗濯するさいは十分脱水して下さい。\n", "model": "サイズ: セミダブル・120X200cm | 色: ダークグレー", "star": 5, "reviewer": "Ⓜ️まぁ", "date": "2026-07-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1BB01NPFC3Z0F/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "缝线有划痕", "title_orig": "縫製がチクチクする", "content": "这种布料的触感确实不错，但感觉很刺痛，可能是由于缝线不好造成的。\n我给了它 2 颗星，因为我认为这将是一篇更蓬松的文章，根据照片中的图像，会让你产生悬念。\n", "content_orig": "生地の触り心地は確かに良いんですが、縫製が雑なのか、チクチクします。\n写真のイメージから、もっとホワホワで、スリスリしたくなるような記事かと思ってたので星2にしました。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 2, "reviewer": "ぴ", "date": "2026-06-29", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1RW8EVOYKRNA7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVX44", "title": "衬里很脆弱", "title_orig": "裏地が脆い", "content": "我家有一只猫，皮肤比较粗糙，所以这个月（6/7）买了，已经洗了大概5次了，但是今天（6/23）晒的时候，发现内衬好几处都破了。都是破的地方不同，所以看起来不像是被什么东西夹住了。一看破的地方，里面有棉花。它不粘在外层材料上，而且防水衬本身就像金箔一样脆弱，所以看起来肯定很容易撕裂。我过去用过几张防水片，但这些是迄今为止最脆弱的。坦白说，我认为防水片洗几次后就撕裂是不可能的。\n\n 7/8 附录 上次用的时候，我用胶带把撕破的地方补了一下，但是今天洗完后，撕破的地方又多了。我把它放在洗衣网里，把脱水时间缩短到2分钟，但它还是撕破了。这太糟糕了。\n", "content_orig": "粗相癖のある猫がいるので今月(6/7)購入して既に5回ほど洗いましたが、今日(6/23)干していたらもう数箇所も裏地が破れているのを発見しました\n全てバラバラの位置が破れているので何かに引っ掛けたとかでもなさそうです\n破れているところを見ると綿が入っている分表地と密着しておらず、防水裏地自体も金箔ぐらいペラペラで確かに破けやすそうな印象です\n今までいくつか防水シーツを使ってきて同じように使用してきましたがこれがダントツ1番脆いです\nはっきり言って防水シーツが数回洗うだけで破れるのは論外だと思います\n\n7/8追記\n前回破れたところをテープで補修して使っていましたが、本日の洗濯後また破れた箇所が増えていました\n洗濯ネットに入れて脱水も2分と短くしましたがそれでも破れます\nこれはあまりにも酷いです\n", "model": "サイズ: ダブル・140X200cm | 色: ライトグレー", "star": 1, "reviewer": "にゃほにゃほ", "date": "2026-06-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R27UNDVQ9XOX8G/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["耐洗不变形"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1THY3MS", "title": "还好是防水的", "title_orig": "防水なのが良い", "content": "它具有抗菌、防尘螨和防水功能。\n", "content_orig": "抗菌防ダニ ・防水なのが良いです。\n", "model": "サイズ: シングル・100X200cm | 色: ライトグレー", "star": 5, "reviewer": "narijunchan", "date": "2026-06-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1MYPM5ATZ9YVS/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["防螨抗菌"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TD6WMZ", "title": "第七次重复 我想以后继续购买", "title_orig": "7枚目のリピート 今後も買い続けたい", "content": "这是我第七次重复。我用它作为儿童游戏垫套和床垫。触感良好，使用起来很舒服。虽然洗起来有点困难（洗完后，水滴得像雨一样，除非你再旋转一两次），但我认为这是一个非常好的产品。\n", "content_orig": "かれこれ7枚目のリピートです。子どものプレイマットカバーやベッドパットとして使用しています。手触りよく使い心地よいです。洗濯がやや大変ですが（洗濯後、追加で脱水1〜2回程しないと雨のように水が垂れてくる）大変良い商品だと思います。\n", "model": "サイズ: ダブル・140X200cm | 色: ホワイト", "star": 5, "reviewer": "かつやの娘", "date": "2026-06-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R236LFVDTLXDRC/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1THY3MS", "title": "不适合尿床的儿童。", "title_orig": "こどものおねしょには不向き。", "content": "这些床单从来没有保护我的床垫不被我的孩子尿床。我将用其他制造商替换它。不建议将其作为儿童尿床的治疗方法。即使我穿着尿床裤，我仍然可以透过漏水看到。\n", "content_orig": "このシーツで子供のおねしょからマットレスを守れたことは1度もありませんでした。別のメーカーに買い替えます。子供のおねしょ対策としてはおすすめできません。おねしょ用ズボンを履いてなお漏れた分すら貫通です。\n", "model": "サイズ: シングル・100X200cm | 色: ライトグレー", "star": 1, "reviewer": "kaku.d", "  ◎根据您的睡眠姿势和使用条件，边缘可能会移动，因此如果您想要完全防止移动，床笠类型可能更合适。您的选择将取决于床垫的规格。\n\n ◆◆概述◆◆\n\n久森防水床垫具有高防水性和床垫。\n这是一款实用性极强的产品，既舒适又舒适。\n\n由于弄湿的各种风险，如尿床、宠物不良行为、护理和防盗汗措施，\n保护昂贵的床垫和蒲团。\n\n防水布特有的不适感较少，且柔软且有衬垫，因此\n这是一款可以舒适地用作普通床垫的宝石。\n\n综合考虑以上内容，我会给5星评价。\n", "content_orig": "『クモリ(Kumori) 防水敷きパッド（シングル・100X200cm アイボリー）』\n\n◆◆特徴◆◆\n\n1. 優れた防水性と安心感\n【防水機能】 裏面のTPU防水素材が、マットレスや敷布団への、\n水分浸透や汚れをしっかり防いでくれる。\n\n2. 快適な寝心地と肌触り\n【肌触り】 表面はピーチ生地で、洗いざらし加工により、\n自然なシワと柔らかさを加え、サラサラとして気持ち良い\n肌触りを実現できている。\n\n3. 衛生面への配慮\n【抗菌・防ダニ】 抗菌防臭機能とダニ対策機能を備えており、\nダニ透過率0%を誇る。\n\n4. 取り付けとお手入れのしやすさ\n【取り付け】 4隅に強化ゴムバンドが付いており、\nマットレスや敷布団に簡単に取り付けられ、ズレにくいため、\n寝相が悪くても安心だ。\n\n◆◆良かった点◆◆\n\n◎強力な「マットレス保護力」。用途は、お子様のおねしょ、\nペットのそそう、高齢者や病人の介護用、寝汗対策、経血対策、\n布団のカビ・汗染み防止、など、非常に幅広く対応してくれる。\n\n◎騒音（カサカサ音）。 防水シーツ特有の「カサカサ」「パリパリ」\nといったビニール音は、使用していくうちに軽減される。\nほとんど気にならないレベルだ。\n\n◎【中綿入り】 ほどよいボリュームの中綿が充填されており、\n普通の防水シーツよりも厚みとクッション性があり、ふんわりと\n心地よい寝心地を実現している。\n\n◎防水層がマットレスからのダニの侵入を遮断する役割も果たし\nてくれる。アレルギーを持つ方やマットレスを清潔に保ちたい\nユーザーにも適するといって良い。\n\n◎【洗濯と速乾性】 洗濯機で丸洗い可能。お手入れが簡単だ。\n乾きやすいため、夜に洗って翌朝（または夜）には使えるほどの\n速乾性があり、たいへん衛生的だ。\n\n※洗濯時は洗濯ネットを使用し、手洗いコースで洗う方法が推奨\nされる。脱水が不十分だと水が垂れてしまうため、脱水を2回行う\nなど、工夫が必要だ。\n\n◆◆留意点◆◆\n\n◎寝相や使用状況によっては、端がずれることがあり、完璧なズレ\n防止を求める場合は、ボックスシーツタイプの方が適している\nかもしれない。マットレスの仕様によって選択が異なるだろう。\n\n◆◆総評◆◆\n\nクモリの防水敷きパッドは、高い防水性と敷きパッドの、\n快適な寝心地を両立させた、実用性の高い製品だ。\n\nおねしょ、ペットの粗相、介護、寝汗対策など、様々な水濡れリスクから、\n高価なマットレスや布団を守ってくれる。\n\n防水シーツ特有の不快感が少なく、中綿入りでふんわりしているため、\n通常の敷きパッドとしても快適に使用できる逸品だ。\n\n以上の内容を勘案した結果、評価は星５つとさせて頂きます。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "poseidon＊", "date": "2025-09-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RO3YBHVP3764U/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["速干", "不易移位", "防螨抗菌"], "防水体验": ["防水效果好"], "产品质量": ["耐洗不变形", "棉絮跑出"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "我喜欢它可以保护床垫。", "title_orig": "マットレスを保護できるのがいいです", "content": "虽然它通常与预防尿床和护理有关，但对于成年人来说使用起来也很舒适。\n即使睡觉时出汗，也不用担心它会渗入床垫中，因此您可以放心，它会始终保持清洁。\n表面摸起来很光滑，睡起来感觉很自然，没有防水床单特有的粗糙感。\n因为它们很厚，所以比薄纸更柔软，并且四个角上的松紧带将它们牢固地固定到位，因此它们不太可能移动。\n由于可以彻底清洗，因此易于维护。然而，脱水时水分会积聚，所以我认为你需要小心这一点。\n我认为这是一款实用的物品，不仅对于儿童和宠物，而且对于成人也可以安全使用。\n", "content_orig": "一般的におねしょ対策や介護向けのイメージが強いですが、大人が使っても快適です。\n寝ている間に汗をかいてもマットレスに染み込む心配がなく、いつも清潔に保てるのが安心。\n表面はさらっとした感触で、防水シーツ特有のガサガサした感じがなく自然な寝心地でした。\n厚みもあるので薄いシーツよりふんわりしており、四隅のゴムでしっかり固定できるのでずれることも少ないです。\n丸洗いできるので手入れも楽です。ただ、脱水するときは水がたまるのでその辺は注意が必要かなと思います。\n子供やペット用としてだけでなく、大人の生活でも安心して使える実用的な一枚だと思います。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "ぷろとれっく", "date": "2025-09-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1BTP5Q83922JY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适", "触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TDYCQJ", "title": "我买了Kumori的防水床垫，它对我很有帮助。", "title_orig": "クモリの防水敷きパッドを購入して助かった", "content": "这是一位正在抚养孩子的母亲说的。最近，我的孩子晚上更容易尿床。就在那时我发现了久森的防水床垫。\n\n我买了一张宽特大号200x200厘米的防水床单并将其放在我孩子的床上。背面的 TPU 防水材料可防止湿气渗透和污垢，因此您可以放心，您孩子的床会保持清洁。\n\n我还喜欢它不仅防水，而且还具有衬垫，可提供柔软舒适的睡眠体验。四个角上的橡皮筋也牢固地固定在一起，以确保舒适的睡眠。\n\n早上很容易取下和清洗，因此即使在忙碌的早晨，您也可以毫无压力地使用它。久森的防水床垫对于我正在抚养孩子来说已经成为一个非常方便的物品。\n", "content_orig": "子育て中のママのです。最近、子供が夜間におねしょをすることが増えてきました。そんな時に見つけたのが、クモリの防水敷きパッドです。\n\n私はワイドキングサイズの200x200cmの防水シーツを購入し、子供のベッドに敷きました。裏面のTPU防水素材が水分浸透や汚れを防ぎ、子供のベッドを清潔に保つことができるので安心です。\n\nまた、防水機能だけでなく、中綿入りでふんわりとした寝心地を提供してくれる点も気に入っています。4隅に付いているゴムバンドもしっかりと取り付けられ、ズレることなく快適な睡眠をサポートしてくれます。\n\n朝も取り外しや洗濯が簡単なので、忙しい朝でもストレスなく使えます。子育て中の私にとって、クモリの防水敷きパッドはとても便利なアイテムとなりました。\n", "model": "サイズ: ワイドキング・200X200cm | 色: ダークグレー", "star": 5, "reviewer": "Amazonカスタマー", "date": "2025-08-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1J2S44HGRFXFF/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TGQD7Q", "title": "完美契合", "title_orig": "ピッタリ", "content": "尺寸也很完美\n", "content_orig": "サイズもピッタリでよかった\n", "model": "サイズ: クイーン・160X200cm | 色: ダークグレー", " 松干燥，因此易于护理，如果晚上干燥，第二天可以再次使用。\n我洗过好几次了，干得很快，而且卫生。\n\n此外，它的四个角上有松紧带，因此它可以牢固地贴在您的床垫或蒲团上，不会轻易滑落。\n然而，根据您的睡眠方式和使用方式，边缘可能会发生变化，因此如果您想要更牢固的贴合性，我认为使用床笠类型会更安全。\n\n我认为它可以用于多种用途，包括防止宠物表现不佳、有小孩的家庭以及护理。\n表面的桃皮绒面料触感非常温和，舒适度方面你不会有任何抱怨。\n冬日温暖，春夏初夏舒适，但盛夏如果没有空调，可能会觉得有点热。\n\n它重量轻、易于操作，在防水、防尘螨、易于清洁等功能方面非常令人满意。\n推荐给那些想要保持蒲团和床垫清洁以及在选择床单时不想牺牲舒适度的人。\n", "content_orig": "薄くてサラリとした肌触りがとても気に入っています。\n一般的な防水シーツにありがちなシャカシャカした違和感はなく、表面は普通のシーツとほとんど変わらない感覚で寝られるのがうれしいポイントです。\n裏側だけがしっかり防水仕様になっていて、汗や経血、ペットやお子さんの粗相など、いざという時もマットレスや布団をしっかりガードしてくれるので、安心感があります。\n\n自分はベッドに変えたタイミングで購入しましたが、ダニアレルギーにも配慮されていて、ダニ透過率ゼロというのも安心材料のひとつです。\n洗濯も丸ごと洗えて乾きやすいので、夜干せば翌日また使えるくらい手入れが楽です。\n何度か洗っていますが、すぐ乾いて衛生的に使えています。\n\nさらに、ゴムバンドが四隅に付いているので、マットレスや敷布団にしっかりフィットしてずれにくいです。\nただ、寝相や使い方によっては端がずれてしまうこともあるので、よりしっかり固定したい場合はボックスシーツタイプの方が安心だと感じました。\n\nペットの粗相対策や小さなお子さんのいる家庭、介護用途まで幅広く使えると思います。\n表面のピーチスキン生地はとても優しい手触りで、寝心地にも不満はありません。\n真冬は暖かく、春先や夏場も快適でしたが、真夏はエアコンがないとやや暑さを感じることもあるかもしれません。\n\n軽くて扱いやすく、防水効果やダニ対策、洗いやすさなど、機能面でも満足度は高いです。\n布団やマットレスを清潔に保ちたい方、シーツ選びで寝心地を妥協したくない方にはおすすめできる一枚です。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 4, "reviewer": "OHM79", "date": "2025-06-13", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2Q790LZILJ7X7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "防螨抗菌"], "防水体验": ["防水效果好"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1THY3MS", "title": "易干，四季皆宜", "title_orig": "乾きやすい、オールシーズン使える", "content": "背面由乙烯基类材料制成，可防止其渗入您的蒲团或床垫。\n我一直在用，虽然还是有点冷，但是冬天很暖和，而且表面摸起来还是有点凉的，所以很舒服。\n对于我来说，盛夏没有空调可能很难受热，但四季皆宜也是有道理的。\n\n并不是像照片中那样它没有吸收所有的水，而是它不让它到达地毯，所以它闪烁了一会儿，但它吸收了它。\n\n我已经洗过几次了，它很容易干，所以这是一个优点。\n另一个好处是，织物的致密编织可以防止尘螨通过，而无需使用化学品。\n床垫和蒲团很让人放心，因为即使脏了也很难清洗。\n\n P.S.：虽然我尿了很多，但床垫却安然无恙。\n请放心，不会因表面排斥力过多而损坏底部。\n我很高兴我拥有它。\n感谢您的帮助。\n", "content_orig": "裏面がビニールっぽい素材になっていて、敷布団やマットレスまで染み込まないようになっています｡\nまだ少し肌寒い時期から使わせて頂いていますが、冬は暖かく、今の時期はまだ触ると表面がほんの少しひんやりしたように感じられ快適です。\n真夏はエアコンがないと暑がりの私は厳しいかもしれませんが、オールシーズン用というのも納得です。\n\n写真のように水分を丸ごと吸水しないわけではなく、敷物まで届かせないという趣のものなので、一瞬弾きますが吸収してくれます ネットに入れなかっただけですぐ破けるのは商品としてどうかと思う。\n", "model": "サイズ: クイーン・160X200cm | 色: ベージュ", "star": 1, "reviewer": "Amazon カスタマー", "date": "2025-05-11", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1PL23OSSK5SD7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["防水效果差"], "产品质量": ["耐洗不变形"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "看来洗的时候多留意一下比较好。", "title_orig": "洗う際は様子を見ながらやったほうが良さそうです", "content": "这是一种防水层相当厚的防水板。\n虽然它是针对儿童的，但对于床必不可少的情况来说它很有用。\n橡胶具有适度的弹性，因此将其挂在厚床上可能会有点困难。\n防水层有点厚，放进洗衣机有点紧张。\n", "content_orig": "そこそこ防水層に厚めのある防水シーツです。\n子供向けではありますがベッドに必須になるシーンに便利です。\nゴムの伸びがほどほどなのでぶ厚めのベッドに引っ掛けるのは少し大変かもしれません。\n防水層が少し厚いので洗濯機にかけるときが少し不安になります。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 4, "reviewer": "ける", "date": "2025-05-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R7C9LIPJAAXSJ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "有足够的空间容纳一杯茶。", "title_orig": "湯呑み一杯分は余裕でした", "content": "买来是为了晚上使用。\n\n我对突然投入生产感到紧张，所以我把它放在地板上，并倒了一杯水作为测试。\n看起来衬里是防水的，表面吸水并且不会渗透到背面。\n\n衬里由类似于优质塑料袋的材料制成，而且看起来确实防水。\n因此，如果你经常睡觉用它，可能会感觉有点闷。\n", "content_orig": "夜のアレ用に購入。\n\nいきなり本番投入は不安だったので、試しに床に敷いて湯呑み一杯分の水をぶちまけてみました。\n撥水するのは裏地のようで、表面は水を吸収して、裏までは貫通しませんでした。\n\n裏地は高級なレジ袋のような素材で、確かに水を弾きそうです。\nそのため、通常の寝る用に使用となると、多少蒸れ感はあるかもしれません。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 4, "reviewer": "たか", "date": "2025-05-10", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1AU8VHRTKZ4NZ/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["吸湿"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "好的", "title_orig": "良い", "content": "一开始，它像防水床单一样清脆而吵闹，但使用一段时间后，它变得像普通床单一样安静，你不会注意到它。我还不确定保水能力，但似乎可以很好地阻止它。\n", "content_orig": "はじめは防水シーツらしくパリパリとうるさいが、しばらく使うと普通のシーツのように結構静かになって気にならなくなる\n保水力はまだ分からないが、しっかり n材質も、洗濯記号も刻印されていていい商品です。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "Bibliomanes", "date": "2025-05-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2XW0RA6WZEQVY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["颜色", "不易移位"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVX44", "title": "很好", "title_orig": "良かった", "content": "触感很好，我真的很喜欢这个颜色。我做了一次非常好的购买。\n", "content_orig": "手触りが良く、色もとても気に入りました。とても良い買い物ができました。\n", "model": "サイズ: ダブル・140X200cm | 色: ライトグレー", "star": 5, "reviewer": "モウ", "date": "2025-05-07", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1MSMC0QJSP3N6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVGX3", "title": "床垫污渍对策◎", "title_orig": "マットレス汚れ対策◎", "content": "对于不喜欢空调或经常盗汗的人来说，我认为将其放在床单或摸起来凉爽的垫子下面是个好主意。这是因为如果直接触摸它，汗水可能会积聚。\n\n如果床垫脏了，就没法洗了，想要去除污渍就需要小苏打或者漂洗清洁剂，但如果不彻底擦干，那就是大问题了……\n\n这么麻烦的事情如果只用一件事就能解决的话，那就便宜了。\n", "content_orig": "エアコン嫌いな人や、寝汗がひどい人には、シーツか、接触冷感のマットの下に仕込んでおくのがいいと思います。直接触れてると汗溜まりの可能性があるからです。\n\nマットレスが汚れてしまうと洗えないですし、シミを取るなら重曹やら、リンサークリーナー必要ですが、しっかり乾燥させないと大変なことになる……\n\nそんな煩わしい事がこれ一つで解決できるのなら安いもんです。\n", "model": "サイズ: シングル・100X200cm | 色: ダークグレー", "star": 5, "reviewer": "チャッチャイ", "date": "2025-05-04", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R9DHONXOKYZK9/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TDS1ZW", "title": "非常适合", "title_orig": "ピッタリフィットしている", "content": "我买这个是为了换季。感觉很好，皮肤感觉很好。穿脱方便。感觉良好，偏差较小。\n", "content_orig": "季節の変わりのため購入しました。肌触りも良く気持ち良いです。つけ外しは簡単に出来ます。ズレも少なくていい感じ。\n", "model": "サイズ: ダブル・140X200cm | 色: ダークグレー", "star": 5, "reviewer": "あやか", "date": "2025-05-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2O1QST9LXN3VG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1THY3MS", "title": "根据产品描述的好产品", "title_orig": "商品説明通りの良品", "content": "我点这个是因为季节变化时我容易盗汗。根据产品描述，它很容易贴在床垫上，表面感觉就像一张普通的床单。重要的防水似乎没有问题。\n", "content_orig": "季節の変わり目に寝汗をかきやすいので注文しました。商品説明通りマットレスに付けやすく、表面は通常のシーツのような感触でよいです。肝心の防水も問題なさそうです。\n", "model": "サイズ: シングル・100X200cm | 色: ライトグレー", "star": 5, "reviewer": "sugarsalt", "date": "2025-05-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3NL10AH8KRVD7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "背面有防水片的软垫", "title_orig": "裏面に防水シートがある中綿入りの敷きパッド", "content": "（有些图片可能会产生误导，所以我会提供额外的解释。）\n产品页面顶部的第一张图片给人的印象是护垫的顶面（身体侧）是防水的，但护垫的顶面（身体侧）根本不防水。它很容易吸水而不排斥水。\n在第三张图片中，水正在涂在背面的防水布上。\n\n本产品的软垫背面有白色 TPU 防水片。床垫表面经过桃皮绒处理，触感柔软。采用这种结构，当水滴到表面上时，水渗入垫层并停留在底部防水片处。毫无疑问，它是可洗的，但我认为床垫很难洗。\n在经常使用防水布的生活方式中，我们决定将本产品作为最后的手段，并使用薄而小的防水片来防止本产品被弄湿。我认为你可以一石二鸟，因为防水布可以防止尘螨进入。\n\n象牙色是一种平静的颜色，就像彩色图像一样。\n我在面料或缝制上找不到任何缺陷，我不认为质量不好。\n\n这是 Kumori 防水床垫的评论，单人，防水床单，尿床床单，抗菌防尘螨，蓬松，填充，可水洗，4 个角有橡胶，易于穿脱，四季皆宜，与床/床垫/蒲团兼容，护理宠物床垫保护罩，床垫（单人，100 x 200 厘米，象牙）。\n", "content_orig": "誤解を招きそうな画像があるので補足説明します）\n商品ページの頭にある画像1枚目、敷パットの上面（体側）が水を弾いているようなイメージの画像ですが、敷パットの上面（体側）は水を全く弾きません。水を弾くこともなく、すーっと吸水します。\n画像3枚目、水をかけているのは裏面の防水シートに対してです。\n\n本商品は、中綿入りの敷きパッドの裏面に白色のTPU素材の防水シートがあります。敷きパッドの表面はピーチスキン加工で肌触りの柔らかいものでした。このような構造ですので、表面に水を垂らすと、敷きパッド層に水が染み込み、一番下の防水シートで水が止まります。洗えることに間違いありませんが、敷きパッドを洗うとなると大変だと思います。\n防水シートが頻繁に活躍するような生活では、本商品は最後の砦としての役割とさせ、本商品が濡れないように薄手で小さい防水シーツを用いることにしました。防水シートがダニの侵入を遮ってくれるので一石二鳥になると思います。\n\nアイボリーは色のイメージそのままの落ち着いた色合いでした。\n生地や縫製に不備は見当たらず質感も悪くないと思います。\n\nクモリ(Kumori) 防水敷きパッド シングル 防水シーツ おねしょシーツ 抗菌防ダニ さらふわ 中綿 洗える 4隅ゴム付き 着脱簡単 オールシーズン ベッド/マットレス/敷き布団対応 介護用 ペット マットレスプロテクター ベッドパッド （シングル・100X200cm アイボリー）　のレビューです。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "Amazonカスタマー", "date": "2025-05-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2M1ZAJM5Z2SV0/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["触感舒适", "颜色", "吸湿", "防螨抗菌"], "防水体验": ["防水效果差"], "产品质量": ["耐洗不变形"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "有助于防止水分转移到床垫上", "title_orig": "敷き布団への湿気移り防止目的にも良い", "content": "我认为它最初是用作护理床或供小孩子使用的。\n然而，我是一个出汗（而且很冷）的人。\n不知不觉间，床垫表面已经出现了污渍和发霉之类的东西……\n作为一个穷人，我没有钱买新床单或支付清洁费。使用除霉剂去除霉菌，然后彻底清洗床垫并悬挂晾干。已经很难了。\n\n就在那时我看到了这个产品。正如其他人的评论中提到的，我想知道这是否可以减少水分转移到床垫上？\n我立即尝试使用它，但湿度记号笔（吸收水分时会变色的试纸）即使在几天后也没有变色。\n它对皮肤也不会感觉不好。\n啊，现在你可能不需要去除沉重床垫上的霉菌，清洗它们，彻底冲洗它们，然后晾干两天。\n", "content_orig": "本来は介護ベッドや小さな子供さん用目的で使用するものなんだと思います。\nしかし自分は汗っかき（のくせに寒がり）なんですよ。\nいつしか敷布表面に染み模様や、カビっぽいものが点々と……\n貧乏な自分は敷布を買い換えるお金も、クリーニングに出すお金もありません。カビ取り剤でカビ除去をして、それから敷布を念入りに洗って、干して乾かす。もう大変。\n\nそんな時に見てしまったのがこの製品。他の方のレビューでも書かれていましたが、これは敷布への湿気移りを緩和できるのでは？\n早速使用してみましたが、数日しても湿度マーカー（湿気を吸うと色が変わる試験紙）も色が変化せず。\nまた肌触りも悪くない。\nああ、これで重たい敷布のカビ除去して、足踏みして洗って、きれいにすすいで、2日干して、なんて事をしなくても済むようになるかもしれません。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "寝過ごしみっちゃん", "date": "2025-05-02", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R275C62N80AJ39/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "防水功能正如宣传的那样。", "title_orig": "防水機能は謳い文句通り", "content": "我尝试在淋浴时将其涂抹在表面一段时间，但它没有渗到底部。\n\n然而，表面织物吸水性良好。\n结果，确实没有向下渗出，但由于表面含有水，湿润感并没有太大变化。\n\n看起来这个结构是由绗缝床单和休闲床单粘在一起而成的。\n\n购买该产品的决定因素是您是否不想让水渗入底部。我没试过，但说得极端一点，用这些床单可以储水。另一方面，由于表面区域通常会变湿，因此最好的使用方法是让尿液（除了……）吸收到床单中，并防止下面的区域变湿。\n\n就我而言，它与上述方法略有不同，但我很容易出汗，因此将这张床单放在我的蒲团上可以防止汗水渗入下面的蒲团。你也可以在上面放一张很酷的床单，但我认为你只用这张床单就可以度过这个季节。\n在我使用它的方式中，它会吸收汗水并且不会流到底部，这很好，因为它可以防止蒲团上发霉和汗渍。\n\n令我困扰的一件事是，产品描述中的照片给人的印象是表面织物也是防水的（拒水）。这是一个你在使用之前不会注意到的差异，所以我觉得改进它会更好。\n", "content_orig": "シャワーでしばらく表面を当ててみたが、下面に滲み出てくることは無かった。\n\n但し表面の生地はよく水を吸う。\n結果、下に滲み出ないことは確かだが、表面には水を含むので、びしょびしょ感はあまり変わらない。\n\nようはキルト加工のシーツとレジャーシートを貼り合わせた構造になっている感じだ。\n\nこの商品の購入の決め手は下に水を染み込ませたく無いかどうかにかかる。試していないが極端な言い方をすれば、このシーツで水を貯めることも可能だろう。その代わり表面の部分は普通に濡れるので、おしっこ（…以外、何でも良いが…）をシーツに吸わせて、その下を濡らさないようにするという使い方になるだろう。\n\n私の場合上の使い方とは少し違うが、汗をかきやすい体質なので、このシーツを敷布団の一番上に敷くことで、かいた汗が下の布団にまで滲み出るのを防ぐことができる。さらに上にひんやりするシーツを敷く場合のあるが、ほぼこのシーツ一枚でシーズンを乗り切ることができると思う。\n私の使い方でも汗を吸ってくれる上に下にいかないのは布団のカビ防止、汗染み防止などにもなり非常に良い。\n\n一点気になったのは、製品説明の写真が、表面の布も防水（撥水）のように勘違いしてしまうような表現になっていることだ。これは使ってからで無いとわからない違いなので改善した方が良いと感じた。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 4, "reviewer": "平成デビューレビューア", "date": "2025-04-30", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R8J84I4Y2RLF7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["吸湿"], "防水体验": ["防水效果差", "防水效果好"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "不要担心您的宠物是否快乐", "title_orig": "ペットが嬉ションしても安心", "content": "我以为它会被蒸，因为背面像乙烯基，但它保持光滑。\n虽然是春天，白天也会有一些热的时候，但还不是真正的夏天，所以夏天来的时候感觉可能会有点不同，但现在你可以像普通的不防水垫一样使用它。\n\n我有时会边喝酒边睡觉，所以不用担心溢出。\n", "content_orig": "裏側がビニールの様なので蒸すかなぁと思ったんですが、サラサラな感じのままでした。\n春なのに日中少し暑い日もありますが、まだ夏本番ではないので、夏になったらちょっと違う感じになるかも知れませんが、現状普通防水じゃないパッドの様に使えます。\n\n飲み物を飲みながら寝ることもあるので、こぼした時安心です。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 4, "reviewer": "TEN TUCKER", "date": "2025-04-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2U6NJWRDAKRDG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["防水效果差"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVGX3", "title": "底垫结论", "title_orig": "敷きパッドの結論", "content": "没有防水床垫特有的松脆感，也没有不适感。\n手感与普通床垫没有太大区别，而且面料耐用。\n而且，价格低廉。\n如果它是防水的并且具有这种品质，那么它将陪伴您一生。\n特别推荐给有时将床用作沙发的人。\n", "content_orig": "防水敷きパッド特有のパリパリ感がなく不快感ゼロ。\n肌触りも普通の敷きパッドと大差ありませんし、生地も丈夫です。\nしかも価格が安い。\n防水でこのクオリティならもう一生これで良いじゃん。\nベッドをソファー代わりにすることがある人には特にお勧めですね。\n", "model": "サイズ: シングル・100X200cm | 色: ダークグレー", "star": 5, "reviewer": "天吾", "date": "2025-04-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2XRQAXHTZS0XG/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["耐用", "触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "致我的祖母", "title_orig": "祖母に", "content": "由于需要护理，我大部分时间都躺在床上，所以我把它用在床垫上。\n", "content_orig": "要介護でベット上で過ごす事が多くベットマットに敷いて使っています。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "とよきん", "date": "2025-04-28", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RIX35GFTB99Y6/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVGX3", "title": "可洗的", "title_orig": "洗える", "content": "我认为大多数常见的尿床防水床单的内部都有一层薄膜状涂层，以防止水渗透。\n这样的处理乍一看似乎并非如此。\n正如产品图片中所写，它似乎可以使用洗衣网在洗衣机中清洗。\n如果你用洗衣机洗防水布，最坏的情况下你的房子可能会被毁掉，所以我认为这个产品在这方面很容易使用。\n我实际上没有给它倒过水，也没有用过洗衣机，所以有些事情我不知道，但我认为它是一个制作精良的产品。\n", "content_orig": "よくあるおねしょ用の防水シートは水を通さないように内側がフィルム加工みたいになっている物が多いと思います。\nこちらはそのような加工はぱっと見無さそうです。\n商品画像に書いてありますが、洗濯ネットを使って洗濯機で洗えるようです。\n防水系のシーツなどは洗濯機で洗うと、最悪家がぶっ壊れる可能性がありますのでそういう面ではこちらの商品使いやすいかと思います。\n実際に水を垂らしたり洗濯機を使ったりしていないのでわからない部分もありますが、造りもしっかりしていていい商品だと思います。\n", "model": "サイズ: シングル・100X200cm | 色: ダークグレー", "star": 4, "reviewer": "にゃんこ", "date": "2025-04-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RE5VVDY1S8INF/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1T7XKWY", "title": "防水垫，触感光滑，填充物看起来像普通床垫。", "title_orig": "なめらかな手触りで中綿入りの、普通の敷きパッドにしか見えない防水パッド", "content": "我订购此产品是为了让我年老且住院的母亲在万一身体不适时减轻精神和身体上的负担。有衬垫，厚度适中，看起来有保湿力和吸收力。我认为人们很容易接受它，因为它摸起来很光滑，看起来就像一个普通的床垫。此外，说明书上还提到，背面的材料不允许水通过，同时还能防止尘螨从下面进入，因此您在使用该设施的床时可以感到安全。另外，如果你使用洗衣网，你可以在洗衣机的手洗循环中清洗它，所以我想这样做。\n", "content_orig": "高齢で病院施設に入居している母が、万が一、粗相した際に、本人の心身の負担が少ないようにと注文。中綿が入って適度な厚みがあるので、保湿力・吸収力もありそうです。手触りもなめらかで普通の敷きパッドにしか見えないので、本人も受け入れやすいと思います。また、裏面の素材は水を通さないと同時に、下からのダニの侵入を防ぐと説明書きにあるので、施設のベッドを使うのに際し、安心感があります。また、洗濯ネットを使用すれば、洗濯機の手洗いコースで洗濯できるということで、そのようにしていきたいと思います。\n", "model": "サイズ: シングル・100X200cm | 色: ベージュ", "star": 5, "reviewer": "urara", "date": "2025-04-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1SPMO04L2Z9NM/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["厚度", "触感舒适"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1TFVGX3", "title": "方便防螨应用", "title_orig": "防ダニの用途には便利", "content": "当你打开它时，有一股醋酸的味道。\n我认为它会在一段时间后消失，但如果你担心它，我认为最好提前将其干燥。\n\n我把它挂在一张简单的单人垫子上供客人使用。\n尺寸恰到好处，即使不是床也可以用作蒲团。\n\n我对防水并不是特别讲究，但在日本西部，我习惯在床上铺防水床单以防止尘螨，然后再铺上普通床单。\n它兼作床垫，因此很容易将防水床单固定到位。\n\n产品背面采用防水面料，摩擦时会发出沙沙声。\n如果你把它铺开睡觉也没关系，但我认为在上面盖上一张床单是个好主意。\n", "content_orig": "開けると酢酸の匂いがします。\nしばらくしたら消えるとは思いますが、気になる人は事前に干した方がいいと思います。\n\n来客用のシングルの簡易マットにかけました。\nサイズ的にはぴったりで、ベッドでなくても敷布団で大丈夫です。\n\n特に防水にはこだわりませんが、西日本ではベッドに防ダニを兼ねて防水シーツを敷いてから、普通のシーツを敷いていました。\nこれは敷きパッドを兼ねているので防水シーツがずれることもなく楽ですね。\n\n商品は裏が防水布になっていて、こするとカサカサと音がします。\n普通に広げて寝るぶんにはそれほど気にはなりませんが、この上からシーツをかけるといいと思います。\n", "model": "サイズ: シングル・100X200cm | 色: ダークグレー", "star": 4, "reviewer": "amazon customer", "date": "2025-04-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1N5D1VRDFVG56/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["不易移位", "防螨抗菌"], "防水体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0F1THY3MS", "title": "质地，松紧带，防水，快干，可水洗。各方面都很优秀的产品。", "title_orig": "肌触り、ゴムバンド、防水性、速乾性、丸洗い可。全てにおいて、優良商品。", "content": "触感良好，并配有坚固的松紧带，因此不会从蒲团上滑落。\n\n当我把水洒在上面时，它会浸入外层织物中，但由于衬里是防水的，所以水留在里面，下面的蒲团不会弄湿。而且干得很快。可以彻底清洗也很好。\n", "content_orig": "肌触りもいいし、しっかりしたゴムバンドも付いているので布団からずれにくいのもいいです。\n\n試しに水をこぼしてみたら表の布地には染み込みますが、裏地が防水になっているため水分が内部にとどまり、その下の布団が湿るようなことはありませんでした。そして乾くのもはやいです。丸洗いできるのも良いですね。\n", "model": "サイズ: シングル・100X200cm | 色: ライトグレー", "star": 5, "reviewer": "Amazon customer", "date": "2025-04-26", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2JUASPN9ZTJE6/ref=cm_cr_getr_d_r     <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  // sort: for star keep natural order 5..1 desc by convention (5,4,3,2,1), else by count desc but 无匹配标签 last
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  // legend
  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
