But we put it on our bed and it's like we are sleeping on a brick. Maybe it's just the one we got? I'm determined to \"break it in\" even though my husband would rather sleep on our couch. 😭 i was so excited for this since we have pets. Hopefully it fluffs out?", "model": "色: グレー | サイズ: クイーン-1", "star": 3, "reviewer": "Syd", "date": "2026-08-06", "link": "https://www.amazon.com/gp/customer-reviews/R21IK1V9MB5PBJ?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "来吧，搞乱", "title_orig": "Go ahead, make a mess", "content": "使用这款产品，您确实可以把床垫搞得一团糟，而不会损坏您的床垫。好的！", "content_orig": "You can really make a dirty mess together without ruining your mattress with this product. Nice!", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Ceej", "date": "2026-08-06", "link": "https://www.amazon.com/gp/customer-reviews/R35BUWLBHQOL48?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "吵闹而且不温柔", "title_orig": "Noisy and not soft", "content": "它听起来有点塑料味和沙哑的声音。听起来有点像睡在 Target 购物袋上。希望有更多的布料，更安静、更柔软。", "content_orig": "Its a little plastic-y and scratchy sounding.  Kinda sounds like sleeping on a Target shopping bag.  Wish it was more fabric to be quieter and softer.", "model": "色: グレー | サイズ: クイーン-1", "star": 3, "reviewer": "Jeff", "date": "2026-08-04", "link": "https://www.amazon.com/gp/customer-reviews/R227GGU97LULEY?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "我不推荐这个产品，不防水", "title_orig": "I do not recommend this product, not waterproof", "content": "我不推荐这个产品。这个床垫套不防水，也许是防水的。我的猫在床上撒尿，它直接穿过这个保护器，我不得不更换我的床垫，这很贵。", "content_orig": "I do not recommend this product.  This mattress cover is not waterproof, water resistant maybe.  My cat peed on the bed and it went right through this protector and I had to replace my mattress, which was expensive.", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Tracy Beadles", "date": "2026-08-03", "link": "https://www.amazon.com/gp/customer-reviews/RBOEL3I9BA3AV?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不防水", "title_orig": "Not Waterproof", "content": "根本不防水。", "content_orig": "Not waterproof at all.", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Brian Lowe", "date": "2026-08-02", "link": "https://www.amazon.com/gp/customer-reviews/R6VEGT7XAKC8A?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "会压缩", "title_orig": "Comprimiría", "content": "工作不够努力，不能很好地压缩羽绒被", "content_orig": "No funciona lo suficiente no comprime bien los edredones", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Greisy", "date": "2026-08-02", "link": "https://www.amazon.com/gp/customer-reviews/R25QT5M1SUYV4G?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "防水的？？不会，但它也不会将水转移到床垫上", "title_orig": "waterproof?? No but it also does not transfer water to a mattress", "content": "刚刚收到并测试了防水系数。水不会形成水珠并流走，但也不会完全渗透，因为背衬是防水材料，可以作为屏障，防止下面的床垫完全浸透。我有一个标准的厚床垫，这个很合适。我选择灰色是因为我发现白色即使在用高乐氏清洗后也会显示出身体油脂，我不喜欢在睡觉时闻到。如果我发现它不能很好地清洗/干燥，我会更新这篇评论。我很高兴这不会让我在晚上感到热，也不会发出任何沙沙声，尽管我上面确实有一个普通的白色床垫。我只是推迟给 5 颗星，因为我不能保证它的可洗性或在洗涤周期中的耐用性。我从不使用烘干机烘干任何含有橡胶或乳胶成分的物品，因此，如果这种情况成立的话，我可能会订购 2 秒垫作为洗涤日的备用。", "content_orig": "Just received this and tested the waterproof factor.  Water does not bead up and run off but it also does no go through entirely because the backing is a waterproof material as a barrier to prevent complete saturation to the mattress underneath.  I have a standard thick mattress and this fit just fine.  I chose grey because I find white shows body oils even after being washed with clorox, which I prefer to not smell while sleeping.  I will update this review if I find that it does not wash/dry well.  I was pleased that this did not make me feel hot during the night nor did it make any rustling noise, although I do have a regular white mattress pad over it.  I held off on giving 5 stars only bc I cannot vouch for its washability or hold up in a wash cycle.  I never use a dryer for anything that has a rubber or latex content so I may be ordering a 2 second pad as a backup on wash days, if this holds up.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "DIY senior", "date": "2026-08-02", "link": "https://www.amazon.com/gp/customer-reviews/RRUYRFNRGCHIZ?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["颜色"], "冷感体验": ["冷感体验好"], "产品质量": ["无匹配标签"], "感官感受": ["透气性好"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "真糟糕！", "title_orig": "Bummer!", "content": "不幸的是它没有完成它的任务。我的一个孩子两次弄湿了床，而且两次都弄到了我的床垫上。我读过很多评论，说它对其他人有用，所以我不知道他们在做什么，但这对我来说完全令人失望。", "content_orig": "Unfortunately it did not do its job. One of my kids has wet the bed twice and it went through to my mattress both time. I’ve read a lot of reviews that it worked for others so I don’t know what they are doing but it’s been a complete letdown for me.", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Angelaguill", "date": "2026-08-01", "link": "https://www.amazon.com/gp/customer-reviews/R3LVZOYUDOF08?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "有效的", "title_orig": "Effective", "content": "固体材料，仍有一些因幼儿尿床而渗漏", "content_orig": "Solid material, still some leak through from toddler bed wetting", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Justin", "date": "2026-07-30", "link": "h ORK", "content": "没有工作。不买", "content_orig": "Did not work. Do not buy", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Jason Brown", "date": "2026-07-25", "link": "https://www.amazon.com/gp/customer-reviews/R1GBPOTU4ENG43?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不防水", "title_orig": "Not waterproof", "content": "不防水", "content_orig": "Not waterproof", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Anna Stocker", "date": "2026-07-23", "link": "https://www.amazon.com/gp/customer-reviews/R2LHEB63YM8G4K?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "安静防水，但不透气", "title_orig": "Quiet waterproofing, but NOT breathable", "content": "防水层是塑料衬垫。它不明显（移动时不会“起皱”或发出噪音），但绝对不透气。冬天还好，但夏天却让人出汗。", "content_orig": "The waterproofing is a plastic liner.  It is not noticeable (does not \"crinkle\" or make noise when you move), but it is absolutely NOT breathable.  Fine in the winter, but in the summer it makes for a sweaty experience.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Lync", "date": "2026-07-22", "link": "https://www.amazon.com/gp/customer-reviews/R2G7L42HLD95SV?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验差"], "产品质量": ["无匹配标签"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不建议热睡者使用", "title_orig": "Not recommended for hot sleepers", "content": "我没发现它防水。它会导致床垫和床单变得非常热。大多数晚上我睡得很热，而其他晚上我由于透析而睡得很冷。我发现自己醒来时发现床垫保护罩和床笠的温度超过 100 华氏度。让我在睡觉前醒来，用风扇冷却床垫保护套和床笠。如果您是热睡者，则不建议使用床笠。", "content_orig": "I did not find it to be waterproof. It causes the mattress and sheets to get extremely hot. Most nights I am a hot sleeper and other nights I'm a cold sleeper due to dialysis. I find myself waking up to the mattress protector and fitted sheet over 100 degrees Fahrenheit. Causes me to wake up undercover and cool mattress protector and fitted sheet with fan before going back to sleep. If you are a hot sleeper not recommended under fitted sheet.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Stefanie Norris", "date": "2026-07-19", "link": "https://www.amazon.com/gp/customer-reviews/R3NZW8U118JS9Y?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验差"], "产品质量": ["无匹配标签"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不防水", "title_orig": "not waterproof", "content": "我们购买的所有三个产品使用几个月后开始泄漏。始终用温和的洗涤剂冷水洗涤，风干。\n\n当我们的幼儿床的床垫保护罩下有一大块污渍时，我们才发现了这一点。 :/\n\n没有明显的损坏，它只是停止工作。", "content_orig": "Started leaking through after a couple months of use with all three of the ones we bought. Always washed cold, gentle detergent, air dried.\n\nFound out the hard way when our toddlers bed had a large stain under the mattress protector. :/\n\nNo visible damage, it just stopped working.", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "CJ Myers", "date": "2026-07-17", "link": "https://www.amazon.com/gp/customer-reviews/RXZEFE4ZR4RA?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "浪费钱", "title_orig": "Waste of money", "content": "在床上不到一周，接缝处就裂开了。浪费钱。", "content_orig": "Less than a week on the bed and the seams are ripping. Waste of money.", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "FeStein", "date": "2026-07-17", "link": "https://www.amazon.com/gp/customer-reviews/RQWKBTXKXG0UB?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["开线"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "脆脆的", "title_orig": "Crunchy", "content": "不喜欢我能感觉到它……原来的 tempurpedic 床垫很光滑，但有了这个盖子，它现在“有纹理且凹凸不平”", "content_orig": "Dislike that I can feel it … original tempurpedic mattress is smooth but with this cover it’s nWe needed something other than white because my partner sweats a lot at night. It’s not very patted only looks like it. Thin overall but should do the trick.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Tracy", "date": "2026-06-17", "link": "https://www.amazon.com/gp/customer-reviews/R37L6QTBKBXOJ1?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "绝对垃圾", "title_orig": "Absolute garbage", "content": "垃圾。不要浪费你的钱...\n\n我为一个刚学会走路的孩子买了这个，他最近从尿布换成了普通内裤，因为如厕训练非常成功。然而，仍然预计会发生一两起事故。这个保护器绝对没有任何作用，尿液直接穿过保护器并浸湿了下面的床垫。我在另一个地方测试了一下，倒了一点水，水直接渗透了床垫。我的孩子说它很舒适，而且它确实非常适合床，但它实际上并不能真正保护您的床垫。没有保护者比浪费时间和金钱要好。它甚至不能正确清洗！它保留了像死人的握力一样的气味，第一次清洗后闻起来像氨水！", "content_orig": "Garbage. Don't waste your money...\n\nI got this for a toddler who recently made the switch from diapers to regular undies as potty training was going very successful. However, still expected an accident or two. This protector did absolutely NOTHING and urin went directly through the protector and soaked the mattress underneath. I tested another spot on it and poured a little bit of water on it, the water went straight through and soaked the mattress. My kid said it was comortable, and it definitely does fit the bed pretty well, but it literally does nothing to actually protect your mattress. Its better to just not have a protecter than use this waste of time and money. It doesnt even wash properly! It holds on to odors like a dead man's grip and smells like ammonia after the first wash!", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Kimberly", "date": "2026-06-15", "link": "https://www.amazon.com/gp/customer-reviews/R2X6SZXNPEIFPN?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "小的", "title_orig": "Small", "content": "几乎不适合我的 15 英寸床垫。", "content_orig": "Barely fit , "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不贴合，睡觉时会在您身下聚成一团。", "title_orig": "Does not fit tight and bunches up under you when you sleep on it.", "content": "我把它放在 14 英寸的床垫上，看起来非常合适，直到我睡在上面，它就皱起来了。我喜欢灰色", "content_orig": "I put it on a 14 inch mattress and it looked like it was a perfect fit until I slept on it and it bunches up. I love the gray color", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Louise", "date": "2026-05-26", "link": "https://www.amazon.com/gp/customer-reviews/RBS5MNTBMIYBR?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["容易移位"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "警告根本不防水", "title_orig": "WARNING NOT WATERPROOF AT ALL", "content": "远非防水！我订了 4 个，每个房间一个，我的房间最糟糕。我有一个两岁的孩子，妈妈喜欢晚上睡觉。附上我的床垫，到处都是湿的应变。全新床垫", "content_orig": "FAR FROM WATERPROOF! I ordered 4, one for each room and my room gets it the worst.. I have a two year old and mommy likes to sleep at night. Attached is my mattress, wet strains everywhere. Brand new mattress", "model": "色: グレー | サイズ: クイーン-1", "star": 1, "reviewer": "Marchae Wright", "date": "2026-05-23", "link": "https://www.amazon.com/gp/customer-reviews/R24WQ2H6KDYXPQ?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "隔着床单都能感觉到缝线", "title_orig": "Can feel the stitching through sheets", "content": "它由与宠物沙发套相同的面料制成。您可以通过标准床笠感觉到上面的缝线。它还使盗汗变得半常见", "content_orig": "This is made of the same fabric as a pet couch covering. You can feel the stitching on it through a standard fitted sheet. It also makes night sweats semi-common", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Kim", "date": "2026-05-23", "link": "https://www.amazon.com/gp/customer-reviews/R3OPQWUTLHKHN9?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感粗糙", "透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "分崩离析", "title_orig": "Falls Apart", "content": "起初这很棒，但我在换了几次床单后发现它已经散架了。不知道这是怎么发生的，考虑到上面总是有一张床单，但布料确实撕裂了", "content_orig": "This was great at first then I noticed after changing my sheets a few times that it’s falling apart. Not sure how this happens considering there’s always a sheet on top of it but the fabric is literally tearing", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Nadia Wanna", "date": "2026-05-20", "link": "https://www.amazon.com/gp/customer-reviews/RBKWR1P4MAWLO?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "好吧，不太好", "title_orig": "Okay not great", "content": "我在 11 月份购买了 BEDLORE 防水床垫保护垫，并一直使用它。总体而言，它做得还不错，但不如预期。\n早期，它在夜间大量出汗时保护床垫，这让我对产品充满信心。然而，使用几个月后，它在一次更严重的潮湿事件中出现故障。虽然床垫没有完全损坏，但它仍然受到影响，这违背了防水保护器的目的。\n对于光保护来说，这可能就足够了。但如果您期望完全防水的可靠性，这可能达不到要求。我现在想知道是否值得更换或为我购买的未使用的产品寻求退款。", "content_orig": "I purchased the BEDLORE Waterproof Mattress Protector in November and have been using it consistently. Overall, it does an okay job — but not as well as expected.\nEarly on, it protected the mattress during heavy night sweating, which gave me confidence in the product. However, after several months of use, it failed during a more significant moisture incident. While the mattress wasn’t completely ruined, it was still affected, which defeats the purpose of a waterproof protector.\nFor light protection, it may be sufficient. But if you’re expecting full waterproof reliability, this may fall short. I’m now left wondering whether it’s worth replacing or seeking a refund for the unused one I purchased.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "M.C.", "date": "2026-05-17", "link": "https://www.amazon.com/gp/customer-reviews/R1DE0ZKYI6TPJ5?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "请遵循洗涤说明！", "title_orig": "FOLLOW WASHING INSTRUCTIONS!!", "content": "我从 2025 年 12 月下旬到现在 2026 年 5 月 15 日一直有这个问题。此后我已经洗过两次了，今天我 2 岁的侄子在我床上打盹时发生了意外，它渗入了床垫。这是最小量的液体，因为我在行动中把他吵醒了。确实抓住了它并阻止了“泄漏”。尽管如此，它还是泄露了。然而，我确实会用热水清洗所有东西，并在每次装载时按下烘干机上的“更干燥”选项……今天我很失望。我想责怪产品，但当我回去阅读洗涤说明时，发现有一些我没有遵循的规格。这个产品对我来说根本没有持续多久。如果你得到了它，只要你完全按照洗涤说明进行操作，它就会很好用。他们一点也不宽容。", "content_orig": "I’ve had this since late December 2025 it’s now may 15 2026. I’ve washed it 2 times since and today my 2 year old nephew had an accident while napping in my bed and it went through to the mattress. It was the smallest amount of liquid because I woke him up in the act. Literally caught it and stoped the “spill”. Still, it leaked through. However, I do wash everything on hot and press the “more dry” option on the dryer every load…  today I was disappointed. I want to blame the product but when I went back and read the washing instructions, there were specifications I did not follow. This product did not last long at all for me. If you get it, it will work well as long as you follow the washing instructions to a T.  They are not that forgiving at all.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Durra Lyons", "date": "2026-05-15", "link": "https://www.amazon.com/gp/customer-reviews/RH88RWYDVKO5L?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "做工非常好，但是……", "title_orig": "Very nicely made but…", "content": "这款 BEDLORE 床垫保护罩采用优质材料制成，设计精美。这是非常奢华的感觉和制作。不幸的是我不得不退货，因为它太厚了，让我晚上出汗。如果它没有导致我盗汗，如果需要的话我肯定会再次购买。", "content_orig": "This BEDLORE mattress protector is made w very great materials and designed nicely. It’s very luxury feeling and made. Unfortunately I’m having to return it because it is so thick and caused me to sweat at night. If it didn’t cause me to have night sweats I would definitely purchase again if need be.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, " rolongar vida del colchón.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Sayuri Hechavarria Dreke", "date": "2026-01-13", "link": "https://www.amazon.com/gp/customer-reviews/RZ9XMLMN9QGN4?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["具有性价比"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["性价比高"]}, {"asin": "B0C1NNYJGB", "title": "功能性——不过不喜欢铆钉", "title_orig": "Functional- not a fan of the rivets though", "content": "喜欢这种材料以及它的保护作用——不喜欢所有的铆钉。与完全光滑的床单相比，一开始很不舒服，需要一段时间才能适应。", "content_orig": "Love the material and how protective it is- not a fan of all the rivets. It was quite uncomfortable at first and took a while getting used to compared to a completely smooth sheet.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Becky", "date": "2026-01-13", "link": "https://www.amazon.com/gp/customer-reviews/RPD4FNNO401RP?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感粗糙"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "床垫套", "title_orig": "Mattress cover", "content": "我的新大号床垫的床垫套，我也是从亚马逊订购的。非常漂亮和毛绒", "content_orig": "Mattress cover for my new queen size mattress that I also ordered off of Amazon. Very nice and plush", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Sherry, Mrs", "date": "2026-01-12", "link": "https://www.amazon.com/gp/customer-reviews/R3FON48SE6CF4?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "请注意，只能以 40° 水温洗涤！", "title_orig": "Attention lavage à 40° seulement !", "content": "与产品照片（以及包装上）所示相反，它不能在 60°C 下洗涤，但可以在 40°C 下洗涤，并且只能在低温下干燥。这是床垫标签上写的内容……只有在打开包装后才能看到。\n\n除了这个令人不自信的细节之外，产品的尺寸很好，它很适合厚床垫，但布料感觉很“塑料”，当你在床上移动时会发出噪音。\n\n简短的。完成这项工作，但至少是这样。", "content_orig": "Contrairement à ce qui est indiqué sur les photos du produit (ainsi que sur son emballage), il ne se lave pas à 60°C mais a 40°C, et se sèche uniquement à basse t 以使用多年的床垫保护垫。不幸的是我把包装扔掉了所以我不能退货。", "content_orig": "I had this protector on the bed for less than a month and discovered it's ripped to shreds.  No clue what happened to it, but I've had other mattress protectors that have lasted for years.  Unfortunately I threw out the packaging so I can't return it.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Coolbreeze", "date": "2026-01-05", "link": "https://www.amazon.com/gp/customer-reviews/R3W0J9H20WCQMK?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "好材料", "title_orig": "Buen mayerial", "content": "根据规格非常好", "content_orig": "Muy bueno de acuerdo a especificaciones", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Beety", "date": "2026-01-04", "link": "https://www.amazon.com.mx/gp/customer-reviews/R3KKEW3M3H9OWP?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不防水", "title_orig": "Not Waterproof", "content": "它非常合身，睡起来感觉很好，但不幸的是，当我的狗在床上发生事故时，我发现它不防水。", "content_orig": "It has a good fit and feels good to sleep on but i unfortunately found out it's  not waterproof when my dog had an accident on the bed.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "I. C. Wiener", "date": "2026-01-02", "link": "https://www.amazon.com/gp/customer-reviews/R3IEULZKRT7N5?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "让他们宣布的事情成真", "title_orig": "Que sea cierto lo que anuncian", "content": "这是一个好产品", "content_orig": "Es un buen producto", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Mayra Molina", "date": "2025-12-22", "link": "https://www.amazon.com/gp/customer-reviews/R2UP7QP8IGJW5T?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "舒适、无缝，但侧面不防水。", "title_orig": "Comfy, seamless, but not waterproof on sides.", "content": "当床单被剥掉时，看起来并不引人注目，也不可怕。睡一觉就好了。不幸的是，有一次我需要这个来工作（咖啡洒在我的床上），但它没有。为什么？因为只有顶部是防水的，侧面不是——如果液体从边缘流走，您的床垫仍然会被弄脏。", "content_orig": "Unobtrusive and not terrible to look at when the sheets are stripped. Just fine to sleep on. Unfortunately, the one time that I needed this to work (coffee spilt on my bed) it didn’t. Why? Because only the top is liquid proofed, not the sides — your mattress will still get stained if liquids run off the edges.", "model": "色: グレー | サイズ: クイーン-1", "star": 3, "reviewer": "TTB", "date": "2025-12-20", "link": "https://www.amazon.com/gp/customer-reviews/R1KH0Y6BZTPVBF?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "作为顶层又漂亮又厚实", "title_orig": "Nice and thick as a top layer", "content": "我对这个产品没有任何问题，但我决定不支持爸爸为床罩提供防水的六边拉链床罩。如果您正在为正在接受如厕训练的孩子或发生意外的父母寻找一款防水产品，那么这是一款非常有用且易于清洗的产品。现在正是我所需要的。", "content_orig": "I had no problem with the product, but I decided against dad any favor of a waterproof six side zipped cover for the bed. If you’re looking for a product that is waterproof for your child who is being potty trained or parent that is having accidents, this is a very useful and easy to wash product. Just now what I need it.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "p", "date": "2025-12-14", "link": "https://www.amazon.com/gp/customer-reviews/R1CMQMJN9YZNLH?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["厚度"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "完美契合。", "title_orig": "Fitted perfectly.", "content": "非常适合床垫，但我希望它有更多衬垫，但它确实发挥了作用", "content_orig": "Fits perfectly on the mattress,  however I was looking for it to be more padded, nevertheless it 耐用。没有传统防水床垫保护垫那样的“塑料”感觉。\n缺点：让我的床感觉“僵硬”并且锁住了我的体温。我尝试了三个晚上，但再也做不到了。每天晚上都会醒来好几次，不舒服，出汗。第四天晚上把它脱下来，终于睡得像个婴儿了。\n\n我不在退货窗口，所以它被捐赠给当地的妇女庇护所。", "content_orig": "Pros: Good quality, seems durable. Doesn't have that \"plastic-y\" feel like traditional waterproof mattress protectors.\nCons: Made my bed feel \"stiff\" and locked in my body heat. I tried for 3 nights and just couldn't do it any longer. Kept waking up several times throughout every night uncomfortable and sweaty. Took it off on night #4 and slept like a baby finally.\n\nI'm outside my return window so it's getting donated to my local women's shelter.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "FlaMomma", "date": "2025-09-19", "link": "https://www.amazon.com/gp/customer-reviews/R3WQ4A4TTUDSH?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["冷感体验差"], "产品质量": ["耐用度高"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "不防水", "title_orig": "NOT WATERPROOF", "content": "不防水。我有一只小狗，需要保护我的床垫。她接受过家庭训练，只是她在我的床上发生过事故。小便渗了出来。不要指望它 100% 防水。", "content_orig": "Not waterproof.  I have a puppy and needed to protect my mattress. She is house trained except she has had accidents on my bed. Pee seeped thru.  Do not expect it to be 100% waterproof.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Diggy", "date": "2025-09-18", "link": "https://www.amazon.com/gp/customer-reviews/R1XOHM0LZ6QYB2?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "做它应该做的事。", "title_orig": "Does what it’s supposed to.", "content": "有点僵硬。否则很好。", "content_orig": "It’s kind of stiff. Otherwise good.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Jaime Rose", "date": "2025-09-18", "link": "https://www.amazon.com/gp/customer-reviews/RRB60Q0YVJXV9?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "优质产品", "title_orig": "Quality product", "content": "很合身。防水的。让狗毛远离我的床垫。", "content_orig": "Good fit. Waterproof. Keeps dog hair off my mattress.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Jadin", "date": "2025-09-17", "link": "https://www.amazon.com/gp/customer-reviews/R2GR71ND4KOV8H?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "颜色不错", "title_orig": "Nice color", "content": "它不像我想象的那么厚或软。", "content_orig": "It's not as thick or as soft as I expected.", "model": "色: グレー | サイズ: クイーン-1", "star": 3, "reviewer": "Cynthia Argintar", "date": "2025-09-14", "link": "https://www.amazon.com/gp/customer-reviews/R3CM2LH3KUGQOZ?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["厚度", "颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "设计需要一点开发阅读描述", "title_orig": "Design needs a little bit of developing read descript", "content": "所以我真的很喜欢这个东西，除了洗的时候。它每次都会收缩得越来越大，到了它刚好适合我的床的地步，几乎在接下来的 2 或 3 次洗涤中，它可能会收缩太多而变得不合身，这对我来说可能是个问题，如果我买这样的东西时必须一遍又一遍地购买它，我希望能够在未来几年使用它。不只是一年，所以这是一个不错的产品。在这里，它可以很好地保护最上面的床垫。边缘不受保护。而且它的贴合度不是太紧，因此他们需要对这款产品进行一些修改，将其做得更大一点，以适应更深的床垫，并使底部更紧。这样，如果它开始收缩，它就不会想要翻转，或者预收缩它，这样它就不会收缩。每次有人洗的时候", "content_orig": "So I really like this item, except when I wash it. It shrinks more and more every time, getting to the point, where it's just fitting my bed, barely in the next 2 or 3 washes, it probably will shrink too much to fit good, and that to me can be problematic if I have to keep buying it over and over when I buy something like this, I want to be able to use it for years to come. Not just a year, so it's a nice product. Here it works good to protect your mattress on the very top. The edges are not protected. And it doesn't fit super tight, so they need to do a little bit of finigling with this product, make it a bit larger for the deeper mattresses and to be more tight around the bottom. So that it doesn't Like want to flip up if it starts to shrink or pre shrink it so it isn't shrinking. Every time somebody washes it", "model": "色: グレー | サイズ: クイーン-1", "star": 3, "reviewer": "corena white", "date": "2025-09-14", "link": "https://www.amazon.com/gp/customer-reviews/R3H9FUZ5ER1ZUA?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "注意细节..", "title_orig": "Pay attention to detail..", "content": "希望它是棉质的而不是热涤纶的..不是你的错，我会订购一个更好的..喜欢这个颜色😍", "content_orig": "Wish it was cotten instead of hot polyester.. not your fault,  I will order a better one.. love the color 😍", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "angela", "date": "2025-09-11", "link": "https://www.amazon.com/gp/customer-reviews/R3GC7DOJOT1KKA?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "品质好", "title_orig": "Good quality", "content": "优良的产品和品质\n到达速度快\n适合深床垫", "content_orig": "Excellent product and quality\nArrived fast\nGood for deep mattress", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Fanny", "date": "2025-08-25", "link": "https://www.amazon.com/gp/customer-reviews/R2E7XIXSENUZ2S?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["品质牢固"], "感官感受": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "睡觉时蜷缩得很厉害", "title_orig": "Bunches up badly while sleeping", "content": "口袋松了，睡觉时在我身下严重皱起，无法在一堆僵硬的皱纹上睡觉。很失望，因为颜色比基本的白色好得多，而且绗缝上衣感觉很棒。也确实防水。可惜我睡不着，只好回去了。", "content_orig": "Pockets are loose, bunches up badly beneath me while sleeping, can't sleep on a pile of stiff wrinkles.  Disappointed because the color is way nicer than basic white, and quilted top feels great.  Truly waterproof too. Shame I can't sleep on it, had to return.", "model": "色: グレー | サイズ: クイーン-1", "star": 2, "reviewer": "Ben Riffey", "date": "2025-08-22", "link": "https://www.amazon.com/gp/customer-reviews/RNFLTOZMWUEOL?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["颜色"], "冷感体验": ["无匹配标签"], "产品质量": ["容易移位"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "品质优良，感觉优质", "title_orig": "Great quality and feels premium", "content": "优质床垫套，与我一年来以一半成本购买的旧床垫套相比非常厚。我喜欢它柔软、耐用的感觉，可以紧贴在床垫上，而且很容易穿上。被子有点厚，透气，但我觉得我用这个比旧的更热，但睡在上面的感觉是一样的。我喜欢这种材料的质量，它感觉很好，而且很耐用，如果狗在上面撒尿，也能防止水沾到床上。我还没有完全测试最后一部分，但我想这是一件好事。如果我发现任何情况，我会更新。", "content_orig": "Great quality mattress cover, it is very thick compared to my old covers we've had for year at half the cost. I like that it is soft and feels durable fits snuggly on the mattress and was easy to put on. The cover is a bit thicker and is breathable but I feel like I get more over heated with this than our old one but it feels the same sleeping on it. I like the quality of the material it feels nice but also feels durable and able to keep the water off the bed if the dogs ever pee on it. I haven't fully tested that last part out but I guess that's a good thing. I will update if I do find anything out.", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "Joseph Yarka", "date": "2025-08-19", "link": "https://www.amazon.com/gp/customer-reviews/R29IKPAXAP5JYU?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["厚度"], "冷感体验": ["冷感体验差"], "产品质量": ["耐用度高", "品质牢固"], "感官感受": ["触感舒适", "透气性差"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "舒适", "title_orig": "Comfort", "content": "贴合舒适", "content_orig": "Fitted well  comfort", "model": "色: グレー | サイズ: クイーン-1", "star": 4, "reviewer": "PRAVEENA", "date": "2025-08-18", "link": "https://www.amazon.com/gp/customer-reviews/R3B850REQFBXWJ?ie=UTF8&ASIN=B0GWL8NSPV", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "冷感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "感官感受": ["触感舒适"], "价值体验": ["无匹配标签"]}, {"asin": "B0C1NNYJGB", "title": "好的，但不是最好的", "title_orig": "O   const withImg = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const coolGood = REVIEWS.filter(r=>r['冷感体验'].includes('冷感体验好')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${coolGood}</div><div class="label">明确反馈冷感体验好</div></div>
    <div class="stat"><div class="num">${withImg}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN：<b>' + asins.join('</b> · <b>') + '</b>';
}

// ---------- generic pie builder ----------
// dim: field name in REVIEWS, or 'star' special
function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else if(dim === '使用人群'){
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

// ---------- modal ----------
let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可展开/收起日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
