ルー", "star": 3, "reviewer": "ター坊", "date": "2025-05-03", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R18JKWMI2L9E40/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "一体式设计体验": ["尺寸/床垫适配问题"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "很光滑", "title_orig": "サラサラしてます", "content": "皮肤感觉很好。\n", "content_orig": "肌触りが良いです。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "k", "date": "2025-04-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1OOR5EB7FM0C/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "易于佩戴和使用！", "title_orig": "つけやすくて使いやすい！", "content": "床单将卷起来装在袋子里。\n\n这是我第一次使用床笠，因为它有弹性，所以可以固定在原位，让整理床变得非常容易！\n质地柔软蓬松。我在床垫上使用它，但它也可以在较厚的床垫上使用，没有任何问题。我尝试睡在上面，但它不松脆也不滑，而且很舒服。\n即使晚上出汗，也没有粘腻的感觉，很舒服。\n\n根据产品介绍照片，我以为颜色会是灰白色，但实际上更接近灰色。\n", "content_orig": "シーツが丸めて袋詰めにされてそのまま届きます。\n\nボックスシーツは初めて使用しましたが、ゴムが入っているのでズレずに着けられてベッドメイキングがとても楽です！\n手触りは柔らかくて、ふわふわしています。マットレスにつけて使用していますが、厚めのマットレスでも問題なくつけられます。寝てみましたがシャカシャカもすべすべもせず、寝心地は良かったです。\n寝汗をかいてもベタベタせず、快適でした。\n\n色は商品紹介写真だとオフホワイトかなと思いましたが、グレーに近かったです。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "Amazonカスタマー", "date": "2025-03-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2HMQJ0HYFOHVT/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["闷热不透气"], "一体式设计体验": ["固定牢固不易滑落"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "生地感◎。", "title_orig": "生地感◎。", "content": "布料摸起来非常好，但是它带有床垫，所以有点笨重。\n干燥时间也比片材长。\n夏天的话，即使挂在外面也很快就会干，所以在出汗的季节可能会更有用。\n床垫容易积灰，因此我们推荐给注重清洁的人士。\n", "content_orig": "生地感はとてもいいのですが、やはりベッドパット付きなので少々嵩張りますね。\n乾燥時間もシーツより長いです。\n夏場は外に干してもすぐ乾きそうなので、汗をかくシーズンのほうが重宝するかも。\nベッドパットはホコリなども溜まりやすいので、清潔第一の方にオススメします。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "Amazonカスタマー", "date": "2025-03-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1DZFLYE5AL16R/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["闷热不透气"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "我担心打开包装时有气味。", "title_orig": "開封時の匂いが気になった", "content": "它强调皮肤感觉很好，但没有我想象的那么好。\n但一体式床笠穿脱方便，价格合理，方便经常洗涤。\n由于它是由 100 Poly 制成的，因此给人的感觉不太柔滑，虽然摸起来很柔软，但似乎吸汗效果不太好。\n最让我困扰的是打开包装时的气味。我洗完后用它。\n", "content_orig": "肌触りの良さを強調していますが、自分は期待したほどではありませんでした。\nただ、一体型ボックスシーツで付け外しは楽ちんで、値段も手頃なので頻繁な洗い替えには便利です。\nポリ100なこともありさらっとしたような印象は受けず、柔らかい肌触りではあるのですが吸汗性があまりよくなさそうに感じます。\n開封時の匂いが一番気になりました。洗ってから使用しています。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "Amazonカスタマー", "date": "2025-02-27", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RXNIXQ6G8SH8N/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["异味明显"], "一体式设计体验": ["一体设计省心便利"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "由于垫和片材是一体的，因此非常易于操作", "title_orig": "パッド・シーツ一体でとても取り扱いやすい", "content": "这是一款结合了床笠和床垫的产品。\n\n如果是单独的物品，床垫可能会移动。\n该产品是集成的，因此您不必担心。\n\n床单和垫是一体的，比普通床单更容易处理。\n很容易放在床垫上。\n\n床垫的厚度既不太厚也不太薄，四季皆可使用。\n\n这款产品的垫子部分也是聚酯材质的，不过好像同品牌也有一款是棉质材质的。\n如果您对材料很挑剔，我认为最好也检查一下。\n", "content_orig": "ボックスシーツとベッドパットが一体となった商品です。\n\n別体品だと、ベッドパットがずれてしまうことがありますが、\n本品は一体となっているのでその心配がありません。\n\nシーツとパットが一体となっていることで、一般的なボックスシーツより扱いやすく、\nマットレスにかけるのが非常に楽でした。\n\nベッドパット部の厚さも厚すぎず薄すぎずオールシーズンで使えるのが良いです。\n\n本品はパッド部もポリエステル素材ですが、同じブランドで綿素材のものもあるようなので、\n素材にこだわりがある方はそちらもチェックしてみると良いかと思います。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "てっさん", "date": "2025-02-22", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1TKE7PAL43VM/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["四季可用"], "触感体验": ["无匹配标签"], "产品质量": ["厚度不足/缓冲差"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "皮肤感觉良好，不易滑落。", "title_orig": "肌触りよくズレにくい。", "content": "因为我总是朝脚的方向踢床垫，不知不觉间枕头边就变低了，我呼吸困难，所以我订购了这个产品来正确地覆盖所有东西，使床垫很难移动。\n它很容易引入，没有奇怪的气味或昂贵的物质。皮肤感觉也很好。有时候，当我踢蒲团时，蒲团会动，但这也是没办法的事，因为蒲团本身已经有了被踢的折痕。如果您将来购买新床垫，您几乎永远不需要踢它或移动它。\n然而，它可能缺乏一些力量，但只有持续使用你才会知道。使用半年后如果遇到什么问题我会更新。\n我认为目前来看这是一个非常好的产品。\n", "content_orig": "いつも足の方向に敷布団を蹴ってしまうので枕側がいつの間にか低くなって息苦しくなっていたので、きちんと全てを覆って敷布団をずらしにくくなるように本商品を注文した。\n　変な匂いや価格物質もなく導入も容易だった。肌触りも良好。まだ多少敷布団をけってずらしてしまうこともあるが、敷布団自体にすでに蹴ったあとの折り目が付いているから仕方ない。今後新しい敷布団を購入すれば蹴ってずらすことはほぼなくなるだろう。\n　ただ少し強靭さに欠けるかも、まぁそこは使い続けないと分からない。半年使って問題が生じたら追記する。\n　現時点ではまあまあ良い商品だと思う。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "へっぽこドクターK（工学）", "date": "2025-02-21", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R27LFLBZTJJHP7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["省心替代分体床品"], "触感体验": ["无匹配标签"], "产品质量": ["异味明显"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "吸湿快干，使用方便", "title_orig": "吸湿速乾で使い勝手が良いです", "content": "水洗面料制成的床笠。\n柔软的水洗面料非常舒适，触感很好，所以我可以睡得很舒服。\n它还采用速干面料制成，尺寸紧凑，易于清洗。\n此外，垫子的穿脱也很容易。\n面料颜色是象牙色，很平静，所以我认为它适合各种房间。\n价格很合理，所以我可以推荐它。\n", "content_orig": "洗いざらし生地のボックスシーツです。\n柔らかな洗いざらしの生地がとても気持ちよく、肌触りも良かったので心地好く寝ることができました。\nまた、速乾生地でサイズもコンパクトなので、洗濯もしやすかったです。\nしかも、マットへの着脱も楽にできました。\n生地カラーもアイボリーで落ち着いているので、様々なお部屋に合うと思います。\n価格も手ごろなので、オススメできますね。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "バニラ", "date": "2025-02-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R3D9YPJ0418910/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "一体式设计体验": ["尺寸/床垫适配问题"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "安装方便 ◎", "title_orig": "取り付け簡単◎", "content": "在我家，我们放下床垫，然后穿上床笠，我总觉得这很麻烦。\n这是一个内置床垫和床笠，所以很容易放下。\n触感又好又软◎\n不过，我感觉焊盘区域的填充量少了一些。我感觉我心情很好。\n", "content_orig": "我が家では敷きパッドを敷いてからボックスシーツを掛けておりいつも煩わしいと感じていました。\nこちらは敷きパッドとボックスシーツが一体型になっており敷くときとても簡単でした◎\n手触りも柔らかく良かったです◎\nただ少しパッド部分の中綿が少なく感じました。気持ち程度に入っている感じです。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "Amazon カスタマー", "date": "2025-02-20", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R1HEU8325EY1C7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["省心替代分体床品"], "触感体验": ["无匹配标签"], "产品质量": ["无匹配标签"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "好吧但是", "title_orig": "いいですが", "content": "床笠和床垫最好的部分都包裹在包装里，但当我打开它时，里面却是黑色的垃圾。我想知道是否应该在使用前清洗它，但我尝试用吸尘器吸尘，当我醒来时并没有感觉发痒，所以我想这不是问题。\n它有衬垫，所以冬天穿起来很舒服。然而，任何使用这种床垫的人都知道，编织物最终会开始脱落并变得破烂，所以根据它的老化情况，最好使用床笠 + 床垫或毛巾毯。如果您将其放在上面，则无需频繁清洗床笠。\n", "content_orig": "ボックスシーツと敷きパッドのいいとこ取り\n梱包は包まれてる状態でしたが開いてみると黒いゴミ？みたいなのが散らばってました\n一旦洗ってから使うか迷ったんですがとりあえず掃除機をかけて使ってみました\n起きたとき痒かったとかもなかったのでまぁ問題なしか？\n中綿が入ってるので冬場は心地良いです\nただし、この手の敷きパッド使ってる人なら知ってると思いますが、そのうち織り目とかがとれてきてぼろぼろになってくるので経年劣化次第だとボックスシーツ＋敷きパッドorタオルケットのほうがメリットあるかも　上に敷いてたらボックスシーツはあんまり洗わなくて済むわけですしおすし\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "muromoro", "date": "2025-02-19", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RH92491NKIUH4/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "一体式设计体验": ["仍会滑落/移位"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "柔软的感觉", "title_orig": "柔らかな感触", "content": "床笠易于穿脱。该织物是一种柔软的材料。\n它可兼作垫子和床单，并具有薄棉的绗缝感觉。\n一些不满意的地方，例如床垫的硬感或床垫移动的麻烦，都可以得到解决。如果您将床垫分层放在床单上，它们很容易移动，因此一体式床垫看起来更干净。\n冬天很好，但夏天可能会感觉有点热。\n闻起来像是干洗回来的，但你可以洗一下就没事了。\n", "content_orig": "着脱が楽なボックスシーツ。生地は柔らかな素材です。\n　パッドとシーツの兼用になっていて薄い綿が入ったキルティングのような感触です。\n　マットレスの感触が硬いとかベッドパッドがずれて面倒など多少の不満は解消されるかも。シーツの上に敷きパッドを重ねている場合などもズレやすいので一体型は見た目にもすっきりしています。\n　冬は良いですが夏はちょっと暑く感じるかも知れません。\n　ドライクリーニングから戻ってきたみたいな匂いがしましたが洗濯すれば大丈夫です。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "Amazonカスタマー", "date": "2025-02-19", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/RJPXT9PO7FE7L/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["省心替代分体床品"], "触感体验": ["触感舒适"], "产品质量": ["厚度不足/缓冲差"], "一体式设计体验": ["一体设计省心便利"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC1LQ2", "title": "很舒服", "title_orig": "快適ではある", "content": "摸起来感觉相当不错。看起来很耐用，所以很期待。他们说穿脱很方便，但放在厚床垫上就有点困难。他们声称由于填充量适量而具有缓冲性能，但缓冲效果并不好。有总比没有感觉好，而且更多的是取决于这个地区的床垫，所以最好不要有太高的期望。冬天，在北陆、东北、北海道等寒冷地区，单独穿着这个可能会很困难，除非有24小时空调。\n\n舒适度似乎很高，所以我认为考虑到自己的环境来选择一个是个好主意。\n", "content_orig": "触り心地はなかなかに気持ちいいです\n耐久性が高いらしいので期待しています\n着脱簡単と言いますが，分厚いマットレスに敷くにはいささか苦労します\n適量の中綿によるクッション性を謳っていますが，あまりクッション性は感じないです\nないよりはマシ程度ですし，この辺はマットレスに依存するほうが大きいので期待しない方が良いでしょう\n冬にこれ一枚では北陸や東北，北海道などの寒い地域では24時間空調でもない限り厳しいかもしれません\n\n快適性は高そうなので自分の環境と相談しながら選ぶとよいと思います\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: アイボリー", "star": 4, "reviewer": "間宮", "date": "2025-02-19", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R213FDYSH476B5/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["省心替代分体床品"], "触感体验": ["触感舒适"], "产品质量": ["耐用耐洗"], "一体式设计体验": ["无匹配标签"], "价值体验": ["无匹配标签"]}, {"asin": "B0DQKC5Y14", "title": "实现床垫的舒适度，同时防止床垫上出现污渍和擦伤", "title_orig": "マットレスの汚れや擦れを防ぎながら敷きパッドの心地よさも実現", "content": "上部有绗缝的床笠，类似垫子。\n与四个角有橡胶圈的普通床垫相比，整理床需要更多时间，但它也能紧紧包裹床垫，防止污垢和擦伤。\n角板部分有点薄，但由于内部有橡胶，其宽度足以完全容纳 20 厘米的床垫。\n唯一的缺点就是选择时比较笨重。\n", "content_orig": "上部が中綿多めのキルティングで敷きパッドのようになったボックスシーツです。\n四隅にゴム輪のついた一般的な敷きパッドよりベッドメイクの手間はかかりますが、マットレスの再度もしっかりくるんでくれるので汚れや擦れを防止できます。\nマチの部分はやや薄手ですがしっかり幅があり、ゴムが入っているので20cmぐらいのマットレスが完全に入りました。\n選択時にかさばるのだけが難点ですね。\n", "model": "サイズ: シングル・100X200cm | スタイル: パッド一体型ボックスシーツ | 色: ライトグレー", "star": 4, "reviewer": "loupetk", "date": "2025-02-18", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R128VM8GQ8NV3T/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["无匹配标签"], "产品质量": ["厚度不足/缓冲差"], "一体式设计体验": ["穿脱不便"], "价值体验": ["无匹配标签"]}];

const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withQualityIssue = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const textureGood = REVIEWS.filter(r=>r['触感体验'].includes('触感舒适')).length;
  const fixGood = REVIEWS.filter(r=>r['一体式设计体验'].includes('固定牢固不易滑落')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${textureGood}</div><div class="label">明确反馈触感舒适</div></div>
    <div class="stat"><div class="num">${fixGood}</div><div class="label">明确反馈一体式不易滑落</div></div>
    <div class="stat"><div class="num">${withQualityIssue}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN（部分）：<b>' + asins.slice(0,12).join('</b> · <b>') + '</b>' + (asins.length>12? ' 等共'+asins.length+'个':'');
}

function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
