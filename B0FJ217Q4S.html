体化的，不会移动，因此可以大大减轻压力。\n我通常使用盒状床单的垫子，但一体式床单有点难以干燥，但它们看起来很漂亮而且很舒服。\n不会感觉生硬，感觉很好。\n当天气变冷时，我喜欢在上面放更多的垫子。\n", "content_orig": "一体型でズレないのでかなりストレス軽減されます。\n普段はBOX型のシーツにパットを使用していますが一体型は少し干しにくいけど見た目も良いし楽です。\nゴワゴワした感じもなく気持ち良い。\n寒くなってきたらこの上にさらにパットを重ねても使えるし気に入っています。\n", "model": "色: ブルー | サイズ: シングル・100X200cm", "star": 5, "reviewer": "明姫", "date": "2025-10-29", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R2MCZ1ONVOCACY/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "一体式设计体验": ["一体设计省心便利"], "价值体验": ["无匹配标签"]}, {"asin": "B0FJ22GQ3D", "title": "质地温和，融入肌肤。", "title_orig": "肌に馴染む、優しい肌ざわり。", "content": "它具有温和舒适的质地，光滑而湿润。表面柔软且有衬垫，床笠式使其固定牢固且易于更换。\n\n除了绗缝垫的柔软手感外，由于密实的衬里，它还具有防尘螨功能。\n我想在不使用织物柔软剂的情况下清洗该产品，以享受该产品的感觉。\n", "content_orig": "サラッとしているのにしっとり感もある、やさしく心地よい肌ざわりです。表面はパッドでふんわり、ボックスシーツ型なのでしっかり固定できて交換もしやすいです。\n\nキルティング加工のパッドのふんわり感に加え、しっかり目の積んだ裏地のおかげで防ダニ機能もかなり期待できそうです。\nこの肌触りはあえて柔軟剤を使わずに洗濯して楽しみたいです…。\n", "model": "色: ホワイト | サイズ: シングル・100X200cm", "star": 5, "reviewer": "55cat", "date": "2025-10-23", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R7OJVRQA657UC/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "一体式设计体验": ["固定牢固不易滑落"], "价值体验": ["无匹配标签"]}, {"asin": "B0FJ217Q4S", "title": "易于更换", "title_orig": "交換がラクチン", "content": "本产品是床笠，也可用作床垫。\n最大的优点是可以节省更换的时间。\n传统内垫的评价可能会根据您使用的产品类型而有所不同，但垫的功能性不错，而且柔软度适中，皮肤感觉良好。\n虽然你会失去叠两层带来的安全感，但我认为节省时间和精力是非常有吸引力的。\n", "content_orig": "ボックスシーツに敷きパッドの機能も持たせたこちらの商品。\n交換の手間を少しだけ省けるというのが一番のメリットです。\n従来の内側敷きパッドにどんな商品を使っていたかによって評価は変わりそうですが、パッドとしての機能はまずまずで、ほどよい柔らかさで肌触りは良いです。\n2枚重ねることによる安心感は失われてしまいますが、手間が省けるというのはとても魅力的だと思います。\n", "model": "色: ベージュ | サイズ: シングル・100X200cm", "star": 5, "reviewer": "銀色のアバンチュール", "date": "2025-10-23", "link": "https://www.amazon.co.jp/portal/customer-reviews/srp/-/R108LIYEBDCWH7/ref=cm_cr_getr_d_rvw_ttl?ie=UTF8", "使用人群": ["自用"], "使用期望": ["无匹配标签"], "触感体验": ["触感舒适"], "产品质量": ["无匹配标签"], "一体式 const PALETTE = ["#0e7c86","#2ca6a4","#8fd0cd","#e7a13b","#c1502e","#6b8f3f",
                 "#3c6e8f","#a6667a","#8a7dc9","#5aa0c9","#d68c3a","#7a9e6b",
                 "#b06a9e","#4f8a8b"];
const GREY = "#c7d3d1";

function colorFor(label, idx){
  if(label === '无匹配标签') return GREY;
  return PALETTE[idx % PALETTE.length];
}

function renderStats(){
  const total = REVIEWS.length;
  const avg = (REVIEWS.reduce((s,r)=>s+(r.star||0),0)/REVIEWS.filter(r=>r.star).length).toFixed(2);
  const asins = [...new Set(REVIEWS.map(r=>r.asin).filter(Boolean))];
  const withQualityIssue = REVIEWS.filter(r=>r['产品质量'].some(t=>t!=='无匹配标签')).length;
  const textureGood = REVIEWS.filter(r=>r['触感体验'].includes('触感舒适')).length;
  const fixGood = REVIEWS.filter(r=>r['一体式设计体验'].includes('固定牢固不易滑落')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">评论总数</div></div>
    <div class="stat"><div class="num">${avg} ★</div><div class="label">平均星级</div></div>
    <div class="stat"><div class="num">${asins.length}</div><div class="label">关联 ASIN / 型号数</div></div>
    <div class="stat"><div class="num">${textureGood}</div><div class="label">明确反馈触感舒适</div></div>
    <div class="stat"><div class="num">${fixGood}</div><div class="label">明确反馈一体式不易滑落</div></div>
    <div class="stat"><div class="num">${withQualityIssue}</div><div class="label">提及具体品质问题</div></div>
  `;
  document.getElementById('asinlist').innerHTML =
    '涉及 ASIN（部分）：<b>' + asins.slice(0,12).join('</b> · <b>') + '</b>' + (asins.length>12? ' 等共'+asins.length+'个':'');
}

function buildCounts(dim){
  const counts = {};
  if(dim === 'star'){
    for(let s=1;s<=5;s++) counts[s+' 星'] = 0;
    REVIEWS.forEach(r=>{ if(r.star) counts[r.star+' 星']++; });
  } else {
    REVIEWS.forEach(r=>{
      (r[dim]||[]).forEach(tag=>{
        counts[tag] = (counts[tag]||0)+1;
      });
    });
  }
  return counts;
}

function filterReviews(dim, label){
  if(dim === 'star'){
    const s = parseInt(label);
    return REVIEWS.filter(r=>r.star===s);
  }
  return REVIEWS.filter(r=>(r[dim]||[]).includes(label));
}

function makeCard(container, opts){
  const {id, title, hint, dim} = opts;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>${title}</h3>
    <p class="hint">${hint}</p>
    <div class="chart-holder"><canvas id="${id}"></canvas></div>
    <div class="legend-list" id="${id}_legend"></div>
  `;
  container.appendChild(card);

  const counts = buildCounts(dim);
  let labels = Object.keys(counts);
  if(dim === 'star'){
    labels = ['5 星','4 星','3 星','2 星','1 星'];
  } else {
    labels.sort((a,b)=>{
      if(a==='无匹配标签') return 1;
      if(b==='无匹配标签') return -1;
      return counts[b]-counts[a];
    });
  }
  const data = labels.map(l=>counts[l]);
  const colors = labels.map((l,i)=>colorFor(l,i));

  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderColor:'#ffffff', borderWidth:2 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout:'52%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (c)=>{
              const total = c.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total? (c.parsed/total*100).toFixed(1):0;
              return `${c.label}: ${c.parsed} 条 (${pct}%)`;
            }
          }
        }
      },
      onClick: (evt, elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        openModal(dim, title, labels[idx], colors[idx]);
      }
    }
  });

  const legendEl = document.getElementById(id+'_legend');
  const total = data.reduce((a,b)=>a+b,0);
  labels.forEach((l,i)=>{
    const pct = total? (data[i]/total*100).toFixed(1):0;
    const item = document.createElement('div');
    item.className='legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>${l} <span class="cnt">${data[i]}</span> (${pct}%)`;
    item.onclick = ()=> openModal(dim, title, l, colors[i]);
    legendEl.appendChild(item);
  });
}

let currentResults = [];
function openModal(dim, title, label, color){
  currentResults = filterReviews(dim, label);
  document.getElementById('modalTitle').innerText = `${title} — ${label}`;
  document.getElementById('modalSub').innerText = `共 ${currentResults.length} 条相关评论 · 点击行可查看日文原文`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalMask').classList.add('open');
  renderTable();
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
}
document.getElementById('modalMask').addEventListener('click', (e)=>{
  if(e.target.id==='modalMask') closeModal();
});

function starBadge(s){
  return `<span class="star-badge s${s}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

function renderTable(){
  const q = document.getElementById('modalSearch').value.trim().toLowerCase();
  let rows = currentResults;
  if(q){
    rows = rows.filter(r =>
      (r.content||'').toLowerCase().includes(q) ||
      (r.title||'').toLowerCase().includes(q) ||
      (r.asin||'').toLowerCase().includes(q) ||
      (r.model||'').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('modalTbody');
  const emptyHint = document.getElementById('emptyHint');
  if(rows.length===0){
    tbody.innerHTML='';
    emptyHint.style.display='block';
    return;
  }
  emptyHint.style.display='none';
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="this.querySelector('.orig').classList.toggle('shown')">
      <td>${r.asin||''}</td>
      <td>${r.star? starBadge(r.star):''}</td>
      <td>${escapeHtml(r.title||'')}</td>
      <td class="content-cell">${escapeHtml(r.content||'').replace(/\n/g,'<br>')}
        <div class="orig">${escapeHtml(r.content_orig||'').replace(/\n/g,'<br>')}</div>
      </td>
      <td>${escapeHtml(r.model||'')}</td>
      <td>${escapeHtml(r.reviewer||'')}</td>
      <td>${r.date||''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderStats();

makeCard(document.getElementById('gridTop'), {
  id:'chartStar', title:'星级分布', dim:'star',
  hint:'评论星级 1～5 星占比'
});
makeCard(document.getElementById('gridTop'), {
  id:'chartUser', title:'使用人群', dim:'使用人群',
  hint:'自用 或 送礼/给家人 购买动机判定'
});

makeCard(document.getElementById('gridExpect'), {
  id:'chartExpect', title:'使用期望', dim:'使用期望',
  hint:'购买动机、期待达成的核心目的'
});

makeCard(document.getElementById('gridExperience'), {
  id:'chartTexture', title:'触感体验', dim:'触感体验',
  hint:'对面料柔软度/粗糙感的实际体验反馈'
});
makeCard(document.getElementById('gridExperience'), {
  id:'chartQuality', title:'产品质量', dim:'产品质量',
  hint:'起球、起皱、异味、厚度、耐用性等工艺与质量反馈'
});
makeCard(document.getElementById('gridExperience'), {
  id:'chartAllInOne', title:'一体式设计体验', dim:'一体式设计体验',
  hint:'固定防滑、穿脱便利性、床垫适配等一体化结构相关反馈'
});

makeCard(document.getElementById('gridValue'), {
  id:'chartValue', title:'价值体验', dim:'价值体验',
  hint:'价格与体验是否匹配的评价'
});
</script>
